<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personer – Caminante Admin</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  /* ====================================================================
     Personregister - Reise v1.0 trinn 4 (31.08.2026).

     En person registreres ÉN gang: navn, masterpresentasjon, interne
     kontaktopplysninger og en enkel egen bildebank. Rolle, valgt bilde og
     eventuell tilpasset presentasjon hører til den enkelte REISEN og settes
     i Påmeldingstur-editoren (Om reisen) - ikke her.

     Registeret er FORELØPIG HELT INTERNT: ingen anonym lesetilgang på noen
     av tabellene. Telefon og e-post er operative felt for Caminante og skal
     aldri vises utenfor Admin.

     Samme mønster som reisemaal.html/hoteller.html: liste + profilpanel,
     hver endring lagres direkte når feltet forlates.
     ==================================================================== */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:14px 24px; background:var(--surface-1);
    border-bottom:1px solid var(--hairline); position:sticky; top:0; z-index:5;
  }
  .toolbar input[type="search"]{
    flex:1 1 200px; min-width:160px; padding:7px 10px;
    border:1px solid var(--hairline); border-radius:8px; font-size:13px;
    background:var(--surface-1); color:var(--ink-primary);
  }
  .toolbar button.action{
    padding:7px 12px; border:1px solid var(--hairline); border-radius:8px;
    font-size:13px; background:var(--surface-1); color:var(--ink-secondary); cursor:pointer;
  }
  .toolbar button.action.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .toolbar button:hover{ background:var(--page); }
  .toolbar button.action.primary:hover{ background:#123d75; }
  .count-pill{ font-size:12.5px; color:var(--ink-muted); margin-left:auto; padding-left:8px; }
  /* Samme lagringsstatus som editorene ellers i Admin. Selve lagringen er
     uendret (hvert felt lagres direkte når det forlates) - dette er bare
     den synlige bekreftelsen på at det skjedde. Statusen finnes to steder:
     i verktøylinjen (når panelet er lukket) og i panelhodet (når det er
     åpent - panelet dekker verktøylinjens høyre del). */
  .save-status{ font-size:12px; color:var(--ink-muted); min-width:120px; text-align:right; }
  .save-status.feil{ color:#a03030; font-weight:600; }
  .profile-panel .save-status{
    position:absolute; top:20px; right:48px; min-width:0; text-align:right;
  }
  .main{ padding:16px 24px 32px; }
  .list-panel{
    background:var(--surface-1); border:1px solid var(--hairline);
    border-radius:var(--radius); padding:14px; overflow-x:auto;
  }
  .list-panel h2{
    font-size:13px; font-weight:650; margin:0 0 10px; color:var(--ink-secondary);
    text-transform:uppercase; letter-spacing:0.03em;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-weight:600; color:var(--ink-secondary); padding:8px 8px;
    border-bottom:1px solid var(--hairline); cursor:pointer; white-space:nowrap; user-select:none;
  }
  thead th:hover{ color:var(--ink-primary); }
  thead th .arrow{ font-size:10px; color:var(--ink-muted); margin-left:3px; }
  tbody td{ padding:8px 8px; border-bottom:1px solid var(--hairline); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--page); }
  tbody tr.selected{ background:#eaf1fb; }
  .p-navn{ font-weight:600; display:flex; align-items:center; gap:10px; }
  .p-thumb{
    width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:var(--page); border:1px solid var(--hairline);
  }
  .p-thumb-tom{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; background:var(--page);
    border:1px dashed var(--hairline);
  }
  .p-sub{ font-size:11.5px; color:var(--ink-muted); }
  .p-reiser{ font-size:12px; color:var(--ink-secondary); }

  .overlay-bg{ position:fixed; inset:0; background:rgba(11,11,11,0.30); display:none; z-index:20; }
  .overlay-bg.open{ display:block; }
  .profile-panel{
    position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%);
    background:var(--surface-1); box-shadow:-8px 0 24px rgba(0,0,0,0.15);
    transform:translateX(100%); transition:transform 0.18s ease;
    overflow-y:auto; z-index:21; padding:20px 22px 60px;
  }
  .profile-panel.open{ transform:translateX(0); }
  .profile-close{
    position:absolute; top:16px; right:18px; border:none; background:none;
    font-size:20px; cursor:pointer; color:var(--ink-muted); line-height:1;
  }
  .profile-close:hover{ color:var(--ink-primary); }
  .profile-header{ margin-bottom:6px; padding-right:30px; display:flex; align-items:center; gap:12px; }
  .profile-header img.p-thumb-lg{
    width:56px; height:56px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:var(--page); border:1px solid var(--hairline);
  }
  .profile-header h2{ margin:0 0 4px; font-size:20px; }
  .profile-header .meta{ font-size:12.5px; color:var(--ink-muted); }

  .section{ margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline); }
  .section h3{
    font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--ink-secondary); margin:0 0 10px;
  }
  .fact-grid{
    display:grid; grid-template-columns:110px 1fr; row-gap:8px; column-gap:10px;
    font-size:13px; align-items:center;
  }
  .fact-grid label{ color:var(--ink-muted); }
  .fact-grid input, .fact-grid textarea{
    border:1px solid var(--hairline); border-radius:6px; padding:5px 7px; font-size:13px;
    font-family:inherit; color:var(--ink-primary); width:100%; box-sizing:border-box;
  }
  .fact-grid textarea{ min-height:60px; resize:vertical; align-self:start; margin-top:2px; }
  .fact-grid textarea.tall{ min-height:120px; }
  .upload-hint{ font-size:11.5px; color:var(--ink-muted); margin-bottom:10px; line-height:1.45; }
  .intern-merke{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    color:#8a6a1d; background:#fdf4e3; border:1px solid #eddaaf; border-radius:20px;
    padding:1px 7px; margin-left:6px; vertical-align:middle;
  }
  .p-bilde-teller{ font-size:11.5px; font-weight:400; color:var(--ink-muted); }
  .p-img-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
  .p-img-card{ border:1px solid var(--hairline); border-radius:8px; overflow:hidden; background:var(--surface-1); }
  .p-img-card.hoved{ border-color:var(--blue); }
  .p-img-card img{ width:100%; height:110px; object-fit:cover; display:block; background:var(--page); }
  .p-img-body{ padding:6px; }
  .p-img-hoved{ font-size:10.5px; color:var(--blue-dark); font-weight:600; margin-bottom:4px; min-height:13px; }
  .p-img-actions{ display:flex; gap:6px; align-items:center; }
  .p-img-actions button{
    font-size:11px; background:none; border:1px solid var(--hairline); border-radius:5px;
    cursor:pointer; padding:2px 7px; color:var(--ink-secondary);
  }
  .p-img-actions button:hover{ background:var(--page); }
  .p-img-actions button:disabled{ opacity:0.3; cursor:default; }
  .p-img-actions .p-img-remove{ color:#b04a4a; margin-left:auto; border:none; padding:2px 0; }
  .p-last-opp{
    margin-top:10px; font-size:12.5px; padding:7px 12px; border:1px solid var(--blue);
    border-radius:7px; background:var(--surface-1); color:var(--blue); cursor:pointer;
  }
  .p-last-opp:hover{ background:var(--blue); color:#fff; }
  .p-last-opp:disabled{ opacity:0.5; cursor:default; }
  .p-status{ font-size:11.5px; color:var(--ink-muted); margin-top:6px; min-height:15px; }
  .reise-liste{ font-size:13px; line-height:1.6; }
  .reise-liste .rolle{ color:var(--ink-muted); }
  .delete-p{
    margin-top:24px; font-size:12px; color:#b04a4a; background:none;
    border:1px solid var(--hairline); border-radius:7px; padding:6px 10px; cursor:pointer;
  }
  .delete-p:hover{ background:#fbeaea; border-color:#d03b3b; }
  .load-msg{ padding:40px 24px; color:var(--ink-muted); font-size:13px; }
  .save-hint{ font-size:12px; color:var(--ink-muted); }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="company">Caminante Admin</span><span class="tool-name">Personer</span></a>
  <div class="user-area">
    <span id="userName"></span>
    <button class="logout-btn" id="logoutBtn">Logg ut</button>
  </div>
</div>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Søk på navn…">
  <button class="action primary" id="newPersonBtn">+ Ny person</button>
  <span class="count-pill" id="countPill"></span>
  <span class="save-status" id="saveStatus"></span>
</div>

<div id="loadMsg" class="load-msg">Laster personer…</div>

<div class="main" id="mainArea" style="display:none;">
  <div class="list-panel">
    <h2>Personregister</h2>
    <table>
      <thead>
        <tr>
          <th data-key="name">Navn <span class="arrow"></span></th>
          <th data-key="reiser">På reiser <span class="arrow"></span></th>
          <th data-key="bilder">Bilder <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="profile-panel" id="profilePanel"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
/* ---------- State ---------- */

let personer = [];   // trip_leaders-rader + .bilder[] + .reiser[] (klientsidig)
let state = { search:"", sortKey:"name", sortDir:1, selectedId:null };
let opplastingPagar = false;

// Samme tak som workeren håndhever for bildebank-opplasting.
const BILDE_MAKS_BYTES = 15 * 1024 * 1024;

function escapeHtml(str){
  return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function nyKey(){ return (crypto.randomUUID ? crypto.randomUUID() : ("k"+Math.random().toString(36).slice(2))); }

// Lagringsstatus, som i editorene: «Lagrer …» mens et kall pågår, «Lagret
// HH:MM» når det er i havn, rødt ved feil. Flere felt kan lagres samtidig
// (man kan tabbe raskt gjennom skjemaet); telleren sørger for at «Lagret»
// først vises når ALLE pågående kall er ferdige, og at en feil blir
// stående til neste vellykkede lagring.
let lagringerPagar = 0;
let sisteFeil = false;
let sisteStatus = { tekst:"", feil:false };
function settStatus(tekst, feil){
  sisteStatus = { tekst, feil: !!feil };
  document.querySelectorAll(".save-status").forEach(s=>{
    s.textContent = tekst;
    s.classList.toggle("feil", !!feil);
  });
}
function lagringStartet(){ lagringerPagar++; sisteFeil = false; settStatus("Lagrer …"); }
function lagringFerdig(feilet){
  lagringerPagar = Math.max(0, lagringerPagar - 1);
  if(feilet) sisteFeil = true;
  if(lagringerPagar > 0) return;
  if(sisteFeil){ settStatus("Kunne ikke lagre", true); return; }
  settStatus("Lagret " + new Date().toLocaleTimeString("nb-NO", { hour:"2-digit", minute:"2-digit" }));
}
function hovedbilde(p){ return p.bilder.length ? p.bilder[0] : null; }

/* ---------- Lasting ---------- */

async function loadAllData(){
  const [rP, rB, rK, rT] = await Promise.all([
    window.sb.from("trip_leaders").select("*").order("name"),
    window.sb.from("trip_leader_images").select("*").order("sortering"),
    window.sb.from("trip_trip_leaders").select("trip_id, trip_leader_id, role"),
    window.sb.from("trips").select("id, title"),
  ]);
  if(rP.error || rB.error || rK.error || rT.error){
    document.getElementById("loadMsg").textContent = "Kunne ikke laste personregisteret. Last siden på nytt.";
    console.error(rP.error, rB.error, rK.error, rT.error);
    return false;
  }
  const tittelById = new Map((rT.data||[]).map(t=>[t.id, t.title]));
  personer = (rP.data||[]).map(p=>({
    ...p,
    bilder: (rB.data||[]).filter(b=>b.trip_leader_id===p.id).sort((a,b)=>(a.sortering??0)-(b.sortering??0)),
    reiser: (rK.data||[]).filter(k=>k.trip_leader_id===p.id).map(k=>({
      trip_id:k.trip_id, tittel: tittelById.get(k.trip_id) || "(ukjent reise)", rolle:k.role || null,
    })),
  }));
  return true;
}

/* ---------- Liste ---------- */

function filtrert(){
  const q = state.search.trim().toLowerCase();
  let list = personer.filter(p => !q || (p.name||"").toLowerCase().includes(q));
  const k = state.sortKey, d = state.sortDir;
  list.sort((a,b)=>{
    let va, vb;
    if(k === "reiser"){ va = a.reiser.length; vb = b.reiser.length; }
    else if(k === "bilder"){ va = a.bilder.length; vb = b.bilder.length; }
    else { va = (a.name||"").toLowerCase(); vb = (b.name||"").toLowerCase(); }
    return (va < vb ? -1 : va > vb ? 1 : 0) * d;
  });
  return list;
}

function renderList(){
  const list = filtrert();
  const body = document.getElementById("listBody");
  body.innerHTML = "";
  list.forEach(p=>{
    const h = hovedbilde(p);
    const tr = document.createElement("tr");
    if(p.id === state.selectedId) tr.classList.add("selected");
    tr.innerHTML = `
      <td>
        <div class="p-navn">
          ${h ? `<img class="p-thumb" src="${escapeHtml(h.bilde_url)}" alt="">` : `<div class="p-thumb-tom"></div>`}
          <div>
            <div>${escapeHtml(p.name)}</div>
            <div class="p-sub">${escapeHtml((p.bio||"").slice(0,70))}${(p.bio||"").length > 70 ? "…" : ""}</div>
          </div>
        </div>
      </td>
      <td class="p-reiser">${p.reiser.length ? p.reiser.length + (p.reiser.length===1 ? " reise" : " reiser") : "–"}</td>
      <td class="p-reiser">${p.bilder.length || "–"}</td>
    `;
    tr.addEventListener("click", ()=> openProfile(p.id));
    body.appendChild(tr);
  });
  document.getElementById("countPill").textContent = `${list.length} av ${personer.length} personer vises`;
  document.querySelectorAll("thead th").forEach(th=>{
    th.querySelector(".arrow").textContent = th.dataset.key === state.sortKey ? (state.sortDir === 1 ? "▲" : "▼") : "";
  });
}

/* ---------- Skriving ---------- */

async function updatePerson(id, patch){
  lagringStartet();
  const { error } = await window.sb.from("trip_leaders").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", id);
  if(error){ lagringFerdig(true); alert("Kunne ikke lagre endringen: " + error.message); return false; }
  lagringFerdig(false);
  const p = personer.find(x=>x.id===id);
  Object.assign(p, patch);
  renderList();
  if(state.selectedId === id) oppdaterHode(p);
  return true;
}

async function createPerson(){
  lagringStartet();
  const { data, error } = await window.sb.from("trip_leaders").insert({ name: "Ny person" }).select().single();
  if(error){ lagringFerdig(true); alert("Kunne ikke opprette person: " + error.message); return; }
  lagringFerdig(false);
  personer.push({ ...data, bilder:[], reiser:[] });
  renderList();
  openProfile(data.id);
  const navn = document.getElementById("f-navn");
  if(navn){ navn.focus(); navn.select(); }
}

async function deletePerson(id){
  const p = personer.find(x=>x.id===id);
  // Feiler STENGT: vet vi ikke om personen står på reiser, sletter vi ikke.
  const { count, error: eTell } = await window.sb.from("trip_trip_leaders")
    .select("id", { count:"exact", head:true }).eq("trip_leader_id", id);
  if(eTell){ alert("Fikk ikke verifisert om personen står på noen reiser. Sletting er sperret - prøv igjen senere."); return; }
  const advarsel = count > 0
    ? "OBS: " + p.name + " står oppført på " + count + (count===1 ? " reise" : " reiser") + ". "
      + "Slettes personen, fjernes hen også fra disse reisene.\n\n"
    : "";
  if(!confirm(advarsel + "Slette " + p.name + " permanent, inkludert alle bilder?")) return;
  lagringStartet();
  const { error } = await window.sb.from("trip_leaders").delete().eq("id", id);
  if(error){ lagringFerdig(true); alert("Kunne ikke slette: " + error.message); return; }
  // Radene er borte (cascade). Filene - portretter - fjernes også.
  for(const b of p.bilder) await slettFil(b.bilde_url);
  lagringFerdig(false);
  personer = personer.filter(x=>x.id!==id);
  closeProfile();
  renderList();
}

/* ---------- Profilpanel ---------- */

function openProfile(id){
  state.selectedId = id;
  renderProfile(id);
  document.getElementById("overlayBg").classList.add("open");
  document.getElementById("profilePanel").classList.add("open");
  renderList();
}
function closeProfile(){
  state.selectedId = null;
  document.getElementById("overlayBg").classList.remove("open");
  document.getElementById("profilePanel").classList.remove("open");
  renderList();
}
document.getElementById("overlayBg").addEventListener("click", closeProfile);
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && state.selectedId) closeProfile(); });

function oppdaterHode(p){
  const h = hovedbilde(p);
  const hode = document.getElementById("profilHode");
  if(!hode) return;
  hode.innerHTML = `
    ${h ? `<img class="p-thumb-lg" src="${escapeHtml(h.bilde_url)}" alt="">` : ``}
    <div>
      <h2>${escapeHtml(p.name)}</h2>
      <div class="meta">${p.reiser.length ? "På " + p.reiser.length + (p.reiser.length===1 ? " reise" : " reiser") : "Ikke på noen reise ennå"}</div>
    </div>`;
}

function renderProfile(id){
  const p = personer.find(x=>x.id===id);
  const panel = document.getElementById("profilePanel");
  panel.innerHTML = `
    <button class="profile-close" id="closeBtn" title="Lukk">✕</button>
    <span class="save-status${sisteStatus.feil ? " feil" : ""}">${escapeHtml(sisteStatus.tekst)}</span>
    <div class="profile-header" id="profilHode"></div>

    <div class="section">
      <h3>1. Person</h3>
      <div class="fact-grid">
        <label>Navn</label><input id="f-navn" value="${escapeHtml(p.name)}">
      </div>
    </div>

    <div class="section">
      <h3>2. Presentasjon</h3>
      <div class="upload-hint">Masterpresentasjonen. Hentes inn når personen legges til på en reise, og kan tilpasses der uten at denne teksten endres.</div>
      <div class="fact-grid">
        <label>Om personen</label><textarea id="f-bio" class="tall">${escapeHtml(p.bio)}</textarea>
      </div>
    </div>

    <div class="section">
      <h3>3. Kontakt <span class="intern-merke">Internt</span></h3>
      <div class="upload-hint">Kun for Caminante. Vises aldri utenfor Admin.</div>
      <div class="fact-grid">
        <label>Telefon</label><input id="f-phone" value="${escapeHtml(p.phone)}" placeholder="F.eks. +47 …">
        <label>E-post</label><input id="f-email" value="${escapeHtml(p.email)}" type="email">
      </div>
    </div>

    <div class="section">
      <h3>4. Bilder <span class="p-bilde-teller" id="pBildeTeller"></span></h3>
      <div class="upload-hint">Personens egen bildebank. Det første bildet er hovedbildet. På den enkelte reisen velges hvilket av disse som skal brukes - f.eks. et bilde fra Marrakech på en Marokko-reise og et nøytralt profilbilde som taler på en bibelcamp.</div>
      <div class="p-img-grid" id="pBildeGrid"></div>
      <button type="button" class="p-last-opp" id="pLastOppBtn">Last opp bilde</button>
      <input type="file" id="pBildeFile" accept="image/*" multiple style="display:none">
      <div class="p-status" id="pStatus"></div>
    </div>

    <div class="section">
      <h3>5. På reiser</h3>
      <div class="reise-liste" id="pReiser"></div>
    </div>

    <button class="delete-p" id="deletePBtn">Slett person</button>
  `;

  oppdaterHode(p);
  document.getElementById("closeBtn").addEventListener("click", closeProfile);

  const felt = (id, kol)=>{
    document.getElementById(id).addEventListener("change", async e=>{
      const v = e.target.value.trim();
      if(kol === "name" && !v){ e.target.value = p.name; return; }   // navn kan ikke være tomt
      const ok = await updatePerson(p.id, { [kol]: v || null });
      // Feilet lagringen, skal feltet vise det som FAKTISK er lagret - ikke
      // stå med en verdi som ser lagret ut, men ikke er det.
      if(!ok){ const f = document.getElementById(id); if(f) f.value = p[kol] || ""; }
    });
  };
  felt("f-navn", "name");
  felt("f-bio", "bio");
  felt("f-phone", "phone");
  felt("f-email", "email");

  renderBilder(p);
  renderReiser(p);

  document.getElementById("pLastOppBtn").addEventListener("click", ()=> document.getElementById("pBildeFile").click());
  document.getElementById("pBildeFile").addEventListener("change", (e)=> lastOppBilder(p, e.target));
  document.getElementById("deletePBtn").addEventListener("click", ()=> deletePerson(p.id));
}

function renderReiser(p){
  const holder = document.getElementById("pReiser");
  if(!holder) return;
  holder.innerHTML = p.reiser.length
    ? p.reiser.map(r=>`<div><a href="reise-editor.html?id=${encodeURIComponent(r.trip_id)}">${escapeHtml(r.tittel)}</a>${r.rolle ? ` <span class="rolle">– ${escapeHtml(r.rolle)}</span>` : ``}</div>`).join("")
    : `<div class="save-hint">Ikke lagt til på noen reise ennå. Det gjøres i Påmeldingstur-editoren under Om reisen.</div>`;
}

/* ---------- Bildebanken ---------- */

// Fjerner selve filen i person-bilder-bucketen ut fra den offentlige
// adressen. Feiler den, er raden uansett borte - vi sier fra, men stopper
// ikke. Kun adresser i VÅR bucket røres (et gammelt Unsplash-bilde e.l.
// hoppes over).
async function slettFil(url){
  const m = (url||"").match(/\/object\/public\/person-bilder\/(.+)$/);
  if(!m) return;
  const { error } = await window.sb.storage.from("person-bilder").remove([decodeURIComponent(m[1])]);
  if(error) console.warn("Fikk ikke slettet bildefilen:", error.message);
}

function renderBilder(p){
  const teller = document.getElementById("pBildeTeller");
  if(teller) teller.textContent = p.bilder.length ? `(${p.bilder.length})` : "";
  const grid = document.getElementById("pBildeGrid");
  if(!grid) return;
  grid.innerHTML = "";
  if(!p.bilder.length){
    grid.innerHTML = '<div class="save-hint">Ingen bilder lastet opp ennå.</div>';
    return;
  }
  p.bilder.forEach((b, i)=>{
    const card = document.createElement("div");
    card.className = "p-img-card" + (i === 0 ? " hoved" : "");
    card.innerHTML = `
      <img src="${escapeHtml(b.bilde_url)}" alt="">
      <div class="p-img-body">
        <div class="p-img-hoved">${i === 0 ? "Hovedbilde" : ""}</div>
        <div class="p-img-actions">
          <button type="button" class="p-img-venstre" title="Flytt fram"${i === 0 ? " disabled" : ""}>←</button>
          <button type="button" class="p-img-hoyre" title="Flytt bak"${i === p.bilder.length-1 ? " disabled" : ""}>→</button>
          <button type="button" class="p-img-remove">Fjern</button>
        </div>
      </div>`;
    grid.appendChild(card);
    card.querySelector(".p-img-venstre").addEventListener("click", ()=> flyttBilde(p, i, i-1));
    card.querySelector(".p-img-hoyre").addEventListener("click", ()=> flyttBilde(p, i, i+1));
    card.querySelector(".p-img-remove").addEventListener("click", async ()=>{
      // Bildet kan være VALGT på en reise (trip_trip_leaders.bilde_id). Da
      // nulles valget der (on delete set null) og reisen viser ingen bilde
      // for personen til et nytt velges. Si det før vi sletter.
      const { count, error: eTell } = await window.sb.from("trip_trip_leaders")
        .select("id", { count:"exact", head:true }).eq("bilde_id", b.id);
      if(eTell){ alert("Fikk ikke verifisert om bildet er i bruk på noen reise. Prøv igjen senere."); return; }
      const advarsel = count > 0
        ? "Dette bildet er valgt for " + p.name + " på " + count + (count===1 ? " reise" : " reiser") + ". "
          + "Fjernes det, må et nytt bilde velges der.\n\n"
        : "";
      if(!confirm(advarsel + "Fjerne bildet fra " + p.name + " sin bildebank?")) return;
      lagringStartet();
      const { error } = await window.sb.from("trip_leader_images").delete().eq("id", b.id);
      if(error){ lagringFerdig(true); alert("Kunne ikke fjerne bildet: " + error.message); return; }
      lagringFerdig(false);
      p.bilder = p.bilder.filter(x=>x.id!==b.id);
      // Et portrett er en personopplysning: selve filen fjernes også, i
      // motsetning til reisemål/hotell der filen bevisst blir liggende.
      await slettFil(b.bilde_url);
      renderBilder(p); oppdaterHode(p); renderList();
    });
  });
}

async function flyttBilde(p, fra, til){
  if(til < 0 || til >= p.bilder.length) return;
  // Hele listen skrives 0..n-1, ett bilde om gangen - ikke et bytte av to
  // verdier. Feiler ett kall, står basen fortsatt med UNIKE verdier, og
  // neste flytting rydder opp. Et bytte som feilet halvveis ville gitt to
  // bilder samme sortering, og da ville ←/→ mellom dem aldri virket igjen.
  const ny = p.bilder.slice();
  const [b] = ny.splice(fra, 1); ny.splice(til, 0, b);
  lagringStartet();
  for(let i=0; i<ny.length; i++){
    if(ny[i].sortering === i) continue;
    const { error } = await window.sb.from("trip_leader_images").update({ sortering: i }).eq("id", ny[i].id);
    if(error){ lagringFerdig(true); alert("Kunne ikke endre rekkefølgen: " + error.message + "\n\nLast siden på nytt før du prøver igjen."); return; }
    ny[i].sortering = i;
  }
  lagringFerdig(false);
  p.bilder = ny;
  renderBilder(p); oppdaterHode(p); renderList();
}

async function lastOppBilder(p, input){
  const filer = [...input.files].filter(f=> f.type && f.type.startsWith("image/"));
  if(!input.files.length) return;
  if(!filer.length){ input.value = ""; alert("Kun bildefiler kan lastes opp."); return; }
  if(opplastingPagar){ input.value = ""; return; }
  opplastingPagar = true;
  const knapp = document.getElementById("pLastOppBtn");
  const status = document.getElementById("pStatus");
  if(knapp) knapp.disabled = true;
  let noeFeilet = false;
  let startet = false;
  try{
    // Kopier filene til minnet først - input-elementet kan bli tegnet bort
    // underveis (samme grep som i shared/bildevelger.js).
    const kopier = [];
    for(const f of filer){
      if(f.size > BILDE_MAKS_BYTES){ alert(f.name + " er for stor (maks 15 MB) og hoppes over."); continue; }
      try{
        const bytes = await f.arrayBuffer();
        kopier.push(new File([bytes], f.name, { type: f.type }));
      } catch(err){
        noeFeilet = true;
        alert("Kunne ikke lese " + f.name + ": " + (err && err.message ? err.message : err));
      }
    }
    if(!kopier.length) return;
    startet = true;
    lagringStartet();
    let nr = 0;
    for(const fil of kopier){
      nr++;
      if(status) status.textContent = kopier.length > 1 ? `Laster opp ${nr} av ${kopier.length}…` : "Laster opp…";
      try{
        const m = fil.name.match(/\.([a-z0-9]{1,5})$/i);
        const ext = m ? m[1].toLowerCase() : "jpg";
        const path = p.id + "/" + nyKey() + "." + ext;
        const { error: eUp } = await window.sb.storage.from("person-bilder").upload(path, fil, { upsert:false });
        if(eUp) throw eUp;
        const { data: pub } = window.sb.storage.from("person-bilder").getPublicUrl(path);
        const neste = p.bilder.length ? Math.max(...p.bilder.map(b=>b.sortering??0)) + 1 : 0;
        const { data, error } = await window.sb.from("trip_leader_images")
          .insert({ trip_leader_id: p.id, bilde_url: pub.publicUrl, sortering: neste }).select().single();
        if(error) throw error;
        p.bilder.push(data);
        // Brukeren kan ha åpnet en annen person imens - tegn bare hvis
        // panelet fortsatt viser DENNE personen.
        if(state.selectedId === p.id){ renderBilder(p); oppdaterHode(p); }
        renderList();
      } catch(err){
        noeFeilet = true;
        alert("Kunne ikke laste opp " + fil.name + ": " + (err && err.message ? err.message : err));
      }
    }
  } finally{
    if(startet) lagringFerdig(noeFeilet);
    else if(noeFeilet) settStatus("Kunne ikke lagre", true);
    input.value = "";
    opplastingPagar = false;
    if(state.selectedId === p.id){
      const k = document.getElementById("pLastOppBtn");
      if(k) k.disabled = false;
      const s = document.getElementById("pStatus");
      if(s) s.textContent = "";
    }
  }
}

/* ---------- Søk/sortering ---------- */

document.getElementById("searchInput").addEventListener("input", e=>{ state.search = e.target.value; renderList(); });
document.querySelectorAll("thead th").forEach(th=>{
  th.addEventListener("click", ()=>{
    const k = th.dataset.key;
    if(state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
    renderList();
  });
});
document.getElementById("newPersonBtn").addEventListener("click", createPerson);

/* ---------- Init ---------- */

(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  const ok = await loadAllData();
  document.getElementById("loadMsg").style.display = "none";
  if(!ok) return;
  document.getElementById("mainArea").style.display = "block";
  renderList();
})();
</script>
