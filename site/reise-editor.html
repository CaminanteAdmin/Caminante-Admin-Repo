<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Påmeldingstur – Caminante Admin</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  /* ====================================================================
     Påmeldingstur-editor - Reise v1.0, trinn 1: Rydding og Reiseinfo.

     Bygget etter produktspesifikasjonen av 31.08.2026. Den gamle modellen
     (overnattingsmodus, overnattingsalternativer, prismatrise, kundevaluta-
     lås, grunnrytme, minimum deltakere, slug i Reiseinfo) er fjernet fra
     editoren. Databasetabellene som KAN være relevante for Bibelcamp står
     urørt til den produktgjennomgangen er gjort - editoren bruker dem bare
     ikke lenger.

     Bevart maskineri fra tidligere byggetrinn (kvalitetssikret av Neuer):
       - Lagring leser KUN fra state, aldri fra DOM-elementer som kan mangle.
       - Lagringskjeden har .catch som gjenoppretter kjeden, viser synlig
         feilbanner med "Prøv igjen", og beholder skitten-flagget slik at
         45-sekundersnettet automatisk prøver på nytt.
       - Innlasting feiler STENGT: klarer vi ikke å lese en datakilde,
         stopper editoren i stedet for å vise en tom reise som en senere
         lagring ville duplisert.
       - Programdager (trinn 3): genereres fra reisens datoer, treffes på
         sitt dagnummer og SLETTES ALDRI herfra. Dager utenfor perioden
         ligger bevart og inaktive - se synlighetsregelen i
         sql/reise_v1_trinn3_program.sql.
       - Sletting av reisen er sperret når den har påmeldinger, og sperren
         feiler STENGT når tellingen ikke kan verifiseres.
       - Kritiske felt (reisenavn, datoer) er låst bak «Endre» på en reise
         som ikke er under arbeid.
     ==================================================================== */
  :root{
    --blue:#2a78d6;
    --blue-dark:#184f95;
    --card-bg:#eaf2fb;
    --card-border:#a9c9ec;
    --warn-bg:#fdf4e3;
    --warn-border:#eddaaf;
    --err-bg:#c0392b;
  }
  body{ background:var(--surface-1); }

  .editor-header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:14px; padding:14px 24px 10px; flex-wrap:wrap;
  }
  .editor-header .left{ flex:1 1 380px; min-width:280px; }
  .editor-header .type-line{ font-size:12px; color:var(--ink-muted); margin-bottom:2px; }
  .editor-header .navn-visning{
    font-size:20px; font-weight:650; color:var(--ink-primary); min-height:26px;
  }
  .save-status{ font-size:12px; color:var(--ink-muted); margin-top:4px; min-height:16px; }
  .save-status.feil{ color:#a03030; font-weight:600; }
  .editor-header .right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .editor-header select#f-status{
    padding:7px 10px; border:1px solid var(--hairline); border-radius:8px;
    font-size:13px; background:var(--surface-1);
  }
  button.danger{
    padding:7px 12px; border:1px solid #eec3c3; border-radius:8px;
    background:#fbeaea; color:#a03030; font-size:13px; cursor:pointer;
  }

  /* Synlig feilbanner - lagringsfeil skal aldri kunne passere ubemerket. */
  #feilBanner{
    display:none; position:sticky; top:0; z-index:12;
    background:var(--err-bg); color:#fff; padding:10px 24px;
    font-size:13px; align-items:center; gap:14px;
  }
  #feilBanner.open{ display:flex; }
  #feilBanner .melding{ flex:1; }
  #feilBanner button{
    padding:6px 12px; border-radius:7px; border:1px solid rgba(255,255,255,0.6);
    background:transparent; color:#fff; font-size:12.5px; cursor:pointer;
  }

  .tab-bar{
    display:flex; gap:2px; padding:0 24px; border-bottom:1px solid var(--hairline);
    overflow-x:auto; align-items:center;
  }
  .tab-btn{
    padding:9px 14px; font-size:13px; border:none; background:transparent;
    color:var(--ink-secondary); cursor:pointer; border-bottom:2.5px solid transparent;
    white-space:nowrap;
  }
  .tab-btn.aktiv{ color:var(--blue-dark); font-weight:650; border-bottom-color:var(--blue); }
  .tab-btn:disabled{ color:#c4c2ba; cursor:default; }
  .tab-btn .soon{ font-size:9.5px; text-transform:uppercase; color:#b3b1a9;
    border:1px solid var(--hairline); border-radius:20px; padding:1px 5px; margin-left:5px; }

  .main{ padding:18px 24px 60px; max-width:1080px; }
  .tab-panel{ display:none; }
  .tab-panel.aktiv{ display:block; }

  .card{
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:16px; margin-bottom:16px;
  }
  .card-title{
    font-size:12.5px; font-weight:650; color:var(--ink-secondary);
    text-transform:uppercase; letter-spacing:0.03em; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .field-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .field label{ display:block; font-size:12px; color:var(--ink-secondary); margin-bottom:3px; }
  .field input, .field select, .field textarea{
    width:100%; padding:7px 9px; border:1px solid var(--hairline); border-radius:7px;
    font-size:13px; background:var(--surface-1); color:var(--ink-primary);
    box-sizing:border-box; font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field .hint{ font-size:11px; color:var(--ink-muted); margin-top:3px; }
  .full{ grid-column:1 / -1; }

  /* Reisenavn skal være det første og mest fremtredende feltet. */
  .field input#ri-navn{
    font-size:17px; font-weight:650; padding:10px 12px;
  }
  .dager-visning{
    font-size:13px; padding:8px 10px; background:var(--surface-1);
    border:1px solid var(--hairline); border-radius:7px; color:var(--ink-secondary);
    min-height:19px;
  }
  .reisemaal-kobling{ font-size:12px; margin-top:5px; }
  .reisemaal-kobling a{ color:var(--blue-dark); }
  .reisemaal-kobling button{
    border:none; background:transparent; color:var(--ink-muted); cursor:pointer;
    font-size:12px; padding:0 3px;
  }

  /* Låste kritiske felt på en reise som ikke er under arbeid */
  .laast input, .laast select, .laast textarea{ background:var(--page); color:var(--ink-muted); }
  .laas-linje{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-muted); }
  .laas-linje button{
    padding:4px 10px; font-size:12px; border:1px solid var(--hairline);
    border-radius:7px; background:var(--surface-1); cursor:pointer; color:var(--ink-secondary);
  }

  /* ---- Program: ett kort per dag. Dagnummer og dato er ren visning -
     begge regnes ut fra reisens datoer, og kan ikke redigeres. ---- */
  .dag-kort{
    background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:14px 16px; margin-bottom:12px;
  }
  .dag-kort-hode{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .dag-kort-hode .dag-nr{ font-size:13px; font-weight:700; color:var(--blue-dark); white-space:nowrap; }
  .dag-kort-hode .dag-dato{ font-size:12.5px; color:var(--ink-secondary); }
  .dag-kort input.dag-tittel{
    width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--hairline);
    border-radius:7px; font-size:14px; font-weight:600; background:var(--surface-1);
    color:var(--ink-primary); font-family:inherit; margin-bottom:8px;
  }
  .dag-kort textarea.dag-tekst{
    width:100%; box-sizing:border-box; min-height:130px; padding:8px 10px;
    border:1px solid var(--hairline); border-radius:7px; font-size:13px; line-height:1.5;
    background:var(--surface-1); color:var(--ink-primary); font-family:inherit; resize:vertical;
    margin-bottom:10px;
  }
  .dag-kort .dag-bilder-label{
    font-size:11.5px; font-weight:600; color:var(--ink-secondary);
    text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px;
  }
  .program-melding{
    background:var(--surface-1); border:1px solid var(--hairline); border-radius:10px;
    padding:16px; font-size:13px; color:var(--ink-secondary); line-height:1.5;
  }
  .program-melding a{ color:var(--blue-dark); }
  /* Bevarte dager utenfor perioden: en rolig beskjed, ikke en feil. */
  .program-bevart{
    background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:10px;
    padding:10px 14px; font-size:12.5px; color:#8a6a1d; margin-bottom:12px; line-height:1.5;
  }

  /* Bildeboksen holdes smal, i samme sjikt som de øvrige kortene i
     Reiseinfo - selve forhåndsvisningen har sitt eget tak i
     shared/bildevelger.js. */
  .forside-wrap{ max-width:260px; }

  .load-msg{ padding:40px 24px; color:var(--ink-muted); font-size:14px; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script src="shared/bildevelger.js"></script>
<script>
/* ====================================================================
   State-basert editor. ALT som lagres bor i state; DOM er kun visning og
   inndata. Lagringen leser aldri fra DOM-elementer som kan mangle.
   ==================================================================== */

let tripId = null;
let state = {
  trip: {},        // KUN feltene denne editoren eier - se tripPayload()
  internal: { interne_notater: "", antall_deltakere: null },
  // Programdager. Identiteten er DAGNUMMERET, ikke plassen i listen:
  //   {id, day_number, fields:{title, description}, endret,
  //    bilder:[{id, clientKey, image_url, alt_text, bank_id}], bilderEndret,
  //    originalBildeIds:Set}
  // Listen inneholder ALLE dager som finnes i basen - også de som ligger
  // utenfor reiseperioden (bevarte). Hvilke som vises, avgjøres ved tegning.
  days: [],
};
let originalIds = {};
let reisemaalRegister = [];   // {id, navn, land} til reisemål-koblingen
let reisemaalRegisterFeilet = false; // lastefeil skal ikke se ut som slettet reisemål
let paameldingsAntall = 0;
let opplaast = false;         // kritiske felt låst når status !== kladd, til «Endre» bekreftes

function el(id){ return document.getElementById(id); }
function escapeHtml(str){
  return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function newClientKey(){ return (crypto.randomUUID ? crypto.randomUUID() : ("k"+Math.random().toString(36).slice(2))); }
// Tomt felt skal bli null - aldri 0.
function numOrNull(v){ return (v===""||v===null||v===undefined||isNaN(v)) ? null : Number(v); }

const TYPE_LABEL = { reise:"Reise", bibelcamp:"Bibelcamp" };

/* Antall dager beregnes ALLTID fra datoene - det finnes ingen manuell
   overstyring, og dermed ingen mulighet for at datoer og dagtall spriker. */
function beregnDager(){
  const t = state.trip;
  if(!t.start_date || !t.end_date) return null;
  const diff = Math.round((new Date(t.end_date) - new Date(t.start_date)) / 86400000) + 1;
  return diff > 0 ? diff : null;
}

/* ---------- Autolagring med synlig feilhåndtering ---------- */
let saveChain = Promise.resolve();
let autosaveDirty = false;
let autosaveTimer = null;
let autosaveKlar = false;

function markDirty(){
  if(!autosaveKlar) return;
  autosaveDirty = true;
  settStatus("Ulagrede endringer …");
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(utlosAutolagring, 2500);
}
setInterval(()=>{ utlosAutolagring(); }, 45000);
function utlosAutolagring(){
  if(!autosaveDirty) return;
  autosaveDirty = false;
  performSave();
}
function performSave(){
  saveChain = saveChain
    .then(()=> utforLagring())
    .catch(err=>{
      console.error("Lagringsfeil:", err);
      autosaveDirty = true; // behold endringene som ulagret -> 45s-nettet prøver igjen
      settStatus("Kunne ikke lagre", true);
      visFeil("Kunne ikke lagre: " + (err && err.message ? err.message : err));
    });
  return saveChain;
}
function settStatus(tekst, feil){
  const s = el("saveStatus");
  s.textContent = tekst;
  s.classList.toggle("feil", !!feil);
}
function visFeil(melding){
  el("feilMelding").textContent = melding;
  el("feilBanner").classList.add("open");
}
function skjulFeil(){ el("feilBanner").classList.remove("open"); }
el("feilRetry").addEventListener("click", ()=>{ skjulFeil(); autosaveDirty = false; performSave(); });
el("feilLukk").addEventListener("click", skjulFeil);

/* ---------- Feltene denne editoren eier på trips ----------
   Payloaden bygges KUN fra state.trip og inneholder KUN disse feltene.
   Slug røres ikke (den hører til publiseringstrinnet), og alt fra den
   gamle modellen (priser, valuta, modus, seksjoner, grunnrytme, minimum
   deltakere, kapasitet) skrives ikke lenger. */
function tripPayload(){
  const t = state.trip;
  const tittelTom = !((t.title || "").trim());
  return {
    title: tittelTom ? (state.sisteLagredeTittel || "Uten tittel") : t.title.trim(),
    subtitle: t.subtitle || null,
    destination: t.destination || null,
    country: t.country || null,
    reisemaal_id: t.reisemaal_id || null,
    start_date: t.start_date || null,
    end_date: t.end_date || null,
    days: beregnDager(),
    departure_airport: t.departure_airport || null,
    // Forsidebildet ligger på trips fordi kundesiden skal kunne lese det for
    // en publisert reise. Reisemål-sporet lagres som id OG navnkopi, slik at
    // merknaden «hentet fra …» fortsatt gir mening om reisemålet senere
    // fjernes fra registeret.
    forsidebilde_url: t.forsidebilde_url || null,
    forsidebilde_bank_id: t.forsidebilde_bank_id || null,
    forsidebilde_reisemaal_id: t.forsidebilde_reisemaal_id || null,
    forsidebilde_reisemaal_navn: t.forsidebilde_reisemaal_navn || null,
    status: t.status || "kladd",
    updated_at: new Date().toISOString(),
  };
}

async function utforLagring(){
  settStatus("Lagrer …");
  const tittelTom = !((state.trip.title || "").trim());

  // 1) Selve reisen (partiell oppdatering - kun våre felt).
  const payload = tripPayload();
  const { error: e0 } = await window.sb.from("trips").update(payload).eq("id", tripId);
  if(e0) throw new Error("reisen: " + e0.message);
  state.sisteLagredeTittel = payload.title;

  // 2) Interne felt - egen tabell uten offentlig lesetilgang. Antall
  //    deltakere ligger her, siden tallet aldri skal vises for kunden.
  const { error: e1 } = await window.sb.from("trip_internal").upsert({
    trip_id: tripId,
    interne_notater: state.internal.interne_notater || null,
    antall_deltakere: state.internal.antall_deltakere ?? null,
    updated_at: new Date().toISOString(),
  }, { onConflict: "trip_id" });
  if(e1) throw new Error("interne felt: " + e1.message);

  // 3) Programdager. Regler (se også sql/reise_v1_trinn3_program.sql):
  //    - En dag treffes på sitt DAGNUMMER. Ingen omnummerering, ingen
  //      sletting herfra: dager utenfor perioden skal ligge bevart.
  //    - Lat oppretting: en dag uten innhold får aldri noen rad. Å åpne en
  //      reise skal ikke skrive noe.
  //    - Kun dager som faktisk er endret skrives. Flagget nullstilles FØR
  //      kallet og settes tilbake ved feil, slik at en redigering som skjer
  //      mens kallet pågår ikke går tapt.
  for(const d of state.days){
    const harInnhold = !!((d.fields.title||"").trim() || (d.fields.description||"").trim() || d.bilder.length);
    const payloadDag = { title: d.fields.title || null, description: d.fields.description || null };

    if(!d.id){
      if(!harInnhold) continue;
      d.endret = false;
      const { data, error } = await window.sb.from("trip_days")
        .insert({ trip_id: tripId, day_number: d.day_number, ...payloadDag }).select("id").single();
      if(error && error.code === "23505"){
        // Dagen finnes allerede i basen (en annen fane skrev den, eller vårt
        // eget insert gikk gjennom men svaret forsvant). Uten dette ville
        // hvert nytt forsøk kollidert på nytt, og ALLE senere dager blitt
        // stående ulagret. Vi adopterer den eksisterende raden og skriver
        // vårt innhold over - siste skriver vinner, som ellers i editoren.
        const { data: eks, error: e2 } = await window.sb.from("trip_days")
          .select("id").eq("trip_id", tripId).eq("day_number", d.day_number).maybeSingle();
        if(e2 || !eks){ d.endret = true; throw new Error("programdag " + d.day_number + ": " + (e2 ? e2.message : "fant ikke eksisterende dag")); }
        d.id = eks.id;
        const { error: e3 } = await window.sb.from("trip_days").update(payloadDag).eq("id", d.id);
        if(e3){ d.endret = true; throw new Error("programdag " + d.day_number + ": " + e3.message); }
      } else if(error){
        d.endret = true; throw new Error("programdag " + d.day_number + ": " + error.message);
      } else {
        d.id = data.id;
      }
    } else if(d.endret){
      d.endret = false;
      const { error } = await window.sb.from("trip_days").update(payloadDag).eq("id", d.id);
      if(error){ d.endret = true; throw new Error("programdag " + d.day_number + ": " + error.message); }
    }

    // 3b) Bildene på dagen. Ingen unik nøkkel på sort_order, så rekkefølgen
    //     kan skrives rett fram. Fjernede bilder slettes; nye settes inn.
    if(d.bilderEndret && d.id){
      d.bilderEndret = false;
      try{
        // Synken jobber på et ØYEBLIKKSBILDE av listen. Fjerner brukeren et
        // bilde mens kallene pågår, endrer det den levende listen - ikke
        // denne. Fjerningen setter bilderEndret på nytt, og neste lagring
        // tar den. Uten øyeblikksbildet kunne et slikt bilde forsvinne fra
        // originalBildeIds uten å bli slettet i basen - et spøkelse som
        // kom tilbake ved omlasting.
        const bilderNaa = d.bilder.slice();
        const keep = new Set(bilderNaa.map(b=>b.id).filter(Boolean));
        const slett = [...d.originalBildeIds].filter(id => id && !keep.has(id));
        if(slett.length){
          const { error } = await window.sb.from("trip_day_images").delete().in("id", slett);
          if(error) throw new Error("sletting av bilde på dag " + d.day_number + ": " + error.message);
        }
        for(let i=0; i<bilderNaa.length; i++){
          const b = bilderNaa[i];
          if(b.id){
            if(b.sort_order !== i){
              const { error } = await window.sb.from("trip_day_images").update({ sort_order: i }).eq("id", b.id);
              if(error) throw new Error("bilde på dag " + d.day_number + ": " + error.message);
              b.sort_order = i;
            }
          } else {
            const { data, error } = await window.sb.from("trip_day_images").insert({
              trip_day_id: d.id, image_url: b.image_url, alt_text: b.alt_text || null,
              sort_order: i, bank_id: b.bank_id || null,
            }).select("id").single();
            if(error) throw new Error("bilde på dag " + d.day_number + ": " + error.message);
            b.id = data.id; b.sort_order = i;
          }
        }
        // Det som nå finnes i basen: det som fantes minus det vi slettet,
        // pluss det vi satte inn - bygget fra øyeblikksbildet, ikke fra den
        // levende listen.
        const slettet = new Set(slett);
        const nyOriginal = new Set([...d.originalBildeIds].filter(id => !slettet.has(id)));
        bilderNaa.forEach(b=>{ if(b.id) nyOriginal.add(b.id); });
        d.originalBildeIds = nyOriginal;
      } catch(err){
        d.bilderEndret = true;
        throw err;
      }
    }
  }

  skjulFeil();
  const lagretTekst = "Lagret " + new Date().toLocaleTimeString("nb-NO", {hour:"2-digit", minute:"2-digit"});
  settStatus(tittelTom ? lagretTekst + " - tomt reisenavn ble ikke lagret, forrige beholdt" : lagretTekst, tittelTom);
}

/* ---------- Reisemål-kobling mot registeret ----------
   Kopimønsteret: navn og land hentes inn som redigerbar tekst, koblingen
   (reisemaal_id) beholdes som spor. Senere endringer i registeret rører
   aldri det som er kopiert inn på reisen. */
function renderReisemaalKobling(){
  const holder = el("reisemaalKobling");
  const rmId = state.trip.reisemaal_id;
  const rm = rmId ? reisemaalRegister.find(r=>r.id === rmId) : null;
  if(rmId){
    // Feilet lastingen av registeret, VET vi ikke om reisemålet finnes -
    // da vises ingen fjern-knapp, så en nettverksglipp ikke kan lokke
    // noen til å fjerne en gyldig kobling (Neuer B1).
    holder.innerHTML = reisemaalRegisterFeilet
      ? `Koblet til registeret (fikk ikke lastet registeret - last siden på nytt for detaljer)`
      : rm
      ? `Koblet til registeret: <a href="reisemaal.html?open=${encodeURIComponent(rm.id)}">${escapeHtml(rm.navn)}</a>
         <button type="button" id="btnFjernReisemaal" title="Fjern koblingen">✕</button>`
      : `Koblet til et reisemål som ikke lenger finnes i registeret
         <button type="button" id="btnFjernReisemaal" title="Fjern koblingen">✕</button>`;
    const btn = el("btnFjernReisemaal");
    if(btn) btn.addEventListener("click", ()=>{
      state.trip.reisemaal_id = null;
      markDirty(); renderReisemaalKobling(); renderForsidebilde();
    });
  } else {
    const valg = reisemaalRegister.map(r=>
      `<option value="${r.id}">${escapeHtml(r.navn)}${r.land ? " ("+escapeHtml(r.land)+")" : ""}</option>`).join("");
    holder.innerHTML = reisemaalRegister.length
      ? `<select id="velgReisemaal" style="font-size:12px; padding:4px 6px; border:1px solid var(--hairline); border-radius:6px; max-width:100%;">
           <option value="">Koble til Reisemål-registeret…</option>${valg}</select>`
      : "";
    const sel = el("velgReisemaal");
    if(sel) sel.addEventListener("change", (e)=>{
      const r = reisemaalRegister.find(x=>x.id === e.target.value);
      if(!r) return;
      state.trip.reisemaal_id = r.id;
      // Kopier navn/land inn kun der feltene er tomme - en utfylt verdi er
      // et bevisst valg som ikke skal overskrives av en kobling.
      if(!(state.trip.destination||"").trim()){ state.trip.destination = r.navn; el("ri-reisemaal").value = r.navn; }
      if(!(state.trip.country||"").trim()){ state.trip.country = r.land || null; el("ri-land").value = r.land || ""; }
      markDirty(); renderReisemaalKobling(); renderForsidebilde();
    });
  }
}

/* ---------- Forsidebilde ----------
   Bildet plukkes fra bildebanken til reisemålet reisen er koblet til, eller
   lastes opp. Ingenting velges automatisk.

   PRODUKTBESLUTNING (godkjent 31.08.2026): bytter man reisemål etter at et
   forsidebilde er valgt, BEHOLDES bildet. Et bevisst valg skal aldri slettes
   eller byttes av systemet selv. I stedet vises en tydelig merknad om hvilket
   reisemål bildet kom fra, med «Bytt bilde» rett ved siden av. Velger man et
   nytt bilde fra det nye reisemålets bank, forsvinner merknaden av seg selv.

   Forsidebildet låses IKKE når reisen publiseres. Låsen dekker reisenavn og
   datoer - avtalen med kunden. Å bytte et bilde er ufarlig, og skal ikke
   kreve en opplåsing. */

// Bankens tak, slik reisemaal.html håndhever det. Brukes KUN til telleren
// «X / 50 bilder i banken» i plukkeren. Ingen opplasting herfra kan lenger
// treffe banken, så det er ikke noe tak å håndheve på denne siden.
const REISEMAAL_BANK_BILDER_MAKS = 50;

// Banken hentes på forespørsel og mellomlagres for resten av sideøkten.
// Endres banken fra reisemaal.html, er det i en annen fane/økt.
const reisemaalBankCache = new Map();   // reisemaal_id -> rader fra reisemaal_bilder

// Pågår det en opplasting til forsidebildet nå? Flagget MÅ ligge her, ikke
// på knappene: boksen tegnes på nytt hvis reisemålet byttes underveis, og en
// lås som bare lå på DOM-noden ville forsvunnet med den - da kunne to
// opplastinger kjøre samtidig, og den siste som ble ferdig ville bestemt
// hvilket bilde reisen satt igjen med.
let forsidebildeOpptatt = false;

async function hentReisemaalBank(reisemaalId){
  if(!reisemaalId) return [];
  if(reisemaalBankCache.has(reisemaalId)) return reisemaalBankCache.get(reisemaalId);
  const { data, error } = await window.sb.from("reisemaal_bilder")
    .select("*").eq("reisemaal_id", reisemaalId).order("sortering");
  // Feiler kallet, skal det BOBLE OPP til plukkeren, som viser feilen. Et
  // stille "ingen bilder" ville sett ut som en tom bank og fått noen til å
  // laste opp et bilde de allerede har.
  if(error) throw new Error(error.message);
  const rader = data || [];
  reisemaalBankCache.set(reisemaalId, rader);
  return rader;
}

function reisemaalNavnFor(id){
  if(!id) return null;
  const r = reisemaalRegister.find(x=>x.id === id);
  return r ? r.navn : null;
}

// Leses PÅ KLIKKTIDSPUNKTET, ikke når plassen tegnes - ellers ville boksen
// huske et foreldet reisemål hvis koblingen endres etterpå.
function forsidebildeBank(){
  const rid = state.trip.reisemaal_id;
  const navn = reisemaalNavnFor(rid);
  return {
    tittel: navn ? ("Bildebank for " + navn) : "Reisemålets bildebank",
    erKoblet: ()=> !!state.trip.reisemaal_id,
    tomBeskjed: "Koble reisen til et reisemål i feltet over for å se bildene i reisemålets bildebank. "
              + "Du kan også laste opp et bilde direkte - det blir da liggende kun på denne reisen.",
    hentBilder: async ()=>{
      const rader = await hentReisemaalBank(state.trip.reisemaal_id);
      return rader.slice()
        .sort((a,b)=>(a.sortering??0)-(b.sortering??0))
        .map(r=>({ id:r.id, url:r.bilde_url, alt_tekst:r.alt_tekst }));
    },
    maks: REISEMAAL_BANK_BILDER_MAKS,
  };
}

function settForsidebilde(url, bankId, reisemaalId){
  const t = state.trip;
  t.forsidebilde_url = url;
  t.forsidebilde_bank_id = bankId || null;
  t.forsidebilde_reisemaal_id = reisemaalId || null;
  // Navnkopi tas her, mens vi vet det - ikke slått opp senere.
  t.forsidebilde_reisemaal_navn = reisemaalId ? reisemaalNavnFor(reisemaalId) : null;
  markDirty();
}

function fjernForsidebilde(){
  // Et bilde VALGT FRA BANKEN blir liggende i reisemålets bildebank og kan
  // velges igjen. Et OPPLASTET bilde finnes derimot ingen andre steder enn
  // her - fjerning er da endelig, selv om selve filen blir liggende i
  // lagringen uten at noe i Admin finner den igjen.
  settForsidebilde(null, null, null);
}

// Samme tak som workeren håndhever for bildebank-opplasting - gjentatt her
// slik at et forsidebilde ikke kan bli vesentlig større enn resten av Admin
// tillater.
const BILDE_MAKS_BYTES = 15 * 1024 * 1024;

// PRODUKTREGEL (besluttet 31.08.2026), gjelder ALLE bildeplasser i
// Påmeldingstur - se også toppen av shared/bildevelger.js:
//
//   «Velg fra bildebank»  = bruk et bilde som allerede ligger i biblioteket
//   «Last opp bilde»      = last opp KUN til denne reisen
//
// Et bilde som lastes opp mens man bygger en tur skal ALDRI havne i
// reisemaal_bilder eller et annet registers bildebank - heller ikke når
// reisen er koblet til et reisemål. Bildebanken er et bevisst kuratert
// bibliotek, og det kureres i registeret, ikke som en bivirkning av at noen
// laster opp et bilde på en tur. Skal et bilde inn permanent, legges det
// inn bevisst i Reisemål-registeret.
//
// Opplastingen går derfor alltid til reise-bilder-bucketen, og skriver
// verken bankkobling eller reisemål-spor på reisen. Konsekvensen er at et
// opplastet bilde aldri gir merknaden «hentet fra …» - den hører kun til
// bilder som FAKTISK kommer fra et reisemåls bildebank.
async function lastOppForsidebilde(file){
  if(file.size > BILDE_MAKS_BYTES){
    throw new Error("Filen er for stor (maks 15 MB).");
  }
  // Et filnavn uten punktum har ingen endelse - .pop() ville da gitt hele
  // navnet tilbake og laget "<uuid>.img_0001".
  const m = file.name.match(/\.([a-z0-9]{1,5})$/i);
  const ext = m ? m[1].toLowerCase() : "jpg";
  const path = tripId + "/" + newClientKey() + "." + ext;
  const { error } = await window.sb.storage.from("reise-bilder").upload(path, file, { upsert:false });
  if(error) throw error;
  const { data } = window.sb.storage.from("reise-bilder").getPublicUrl(path);
  settForsidebilde(data.publicUrl, null, null);

  // Lagre med det samme: bildet ligger allerede i lagringen, og en reise som
  // mister koblingen til et bilde som ER lastet opp er verre enn et ekstra
  // lagringskall.
  //
  // MERK: lagringen startes, men ventes IKKE på. performSave() returnerer
  // hele lagringskjeden, ikke bare vår egen lenke - venter vi på den, arver
  // opplastingen ventetiden til enhver tidligere lagring som måtte henge, og
  // «Laster opp…» ville blitt stående selv om bildet for lengst er oppe.
  // Lagringen har sitt eget synlige spor uansett: statuslinjen viser
  // «Lagrer…»/«Lagret», og en feil gir rødt banner og nytt forsøk.
  clearTimeout(autosaveTimer);
  autosaveDirty = false;
  performSave();
}

// Merknaden styres av NAVNKOPIEN, ikke av id-en. Id-en har «on delete set
// null»: slettes reisemålet fra registeret, forsvinner den, mens navnet
// består. Gikk vi på id-en, ville merknaden stilltiende forsvunnet nettopp
// i det tilfellet navnkopien ble laget for.
// Et OPPLASTET bilde har ingen navnkopi (opplasting rører aldri et
// bildebankregister) og gir derfor aldri merknad - som regelen krever.
// Merknaden undertrykkes kun når vi POSITIVT kan slå fast at bildet kommer
// fra det reisemålet reisen er koblet til nå.
function forsidebildeMerknad(){
  const t = state.trip;
  if(!t.forsidebilde_url) return null;
  if(!t.forsidebilde_reisemaal_navn) return null;
  const sammeReisemaal = !!t.forsidebilde_reisemaal_id
    && t.forsidebilde_reisemaal_id === t.reisemaal_id;
  if(sammeReisemaal) return null;
  return "Forsidebildet er hentet fra " + t.forsidebilde_reisemaal_navn;
}

function renderForsidebilde(){
  const wrap = el("forsideWrap");
  if(!wrap) return;
  // Feiler tegningen (f.eks. hvis shared/bildevelger.js ikke ble lastet),
  // skal RESTEN av editoren fortsatt komme opp. Uten dette ville et kast her
  // stoppe innlastingen etter at skjermbildet er vist, og etterlate en
  // publisert reise med ulåste felt og autolagringen avslått.
  try{
    wrap.innerHTML = "";
    wrap.appendChild(window.bildevelger.slot({
      label: "Forsidebilde",
      getUrl: ()=> state.trip.forsidebilde_url || null,
      getMerknad: forsidebildeMerknad,
      bank: forsidebildeBank,
      onVelg: (bilde)=> settForsidebilde(bilde.url, bilde.id, state.trip.reisemaal_id),
      onFjern: fjernForsidebilde,
      onLastOpp: lastOppForsidebilde,
      // Bekreftelsen skal komme når bildet IKKE kan velges inn igjen.
      // Plukkeren viser kun banken til det reisemålet reisen er koblet til
      // NÅ, så det holder ikke at bildet en gang kom fra en bank: kommer det
      // fra et ANNET reisemål (eller er bankraden slettet), står det ikke i
      // plukkeren lenger, og da skal vi spørre.
      erFraBank: ()=> !!state.trip.forsidebilde_bank_id
                   && state.trip.forsidebilde_reisemaal_id === state.trip.reisemaal_id,
      erOpptatt: ()=> forsidebildeOpptatt,
      settOpptatt: (v)=>{ forsidebildeOpptatt = v; },
      etterEndring: renderForsidebilde,
    }));
  } catch(err){
    console.error("Kunne ikke tegne bildevelgeren:", err);
    wrap.innerHTML = '<div class="hint">Kunne ikke vise bildevelgeren. Last siden på nytt.</div>';
  }
}

/* ---------- Status + låsing ----------
   Kritiske felt (reisenavn, datoer) er låst når reisen ikke er under
   arbeid. «Endre» henter antall påmeldinger og viser advarsel. Opplåsingen
   er ren skjermtilstand og lagres aldri. */
function erLaast(){ return state.trip.status !== "kladd" && !opplaast; }

function oppdaterLaasUI(){
  const laast = erLaast();
  document.querySelectorAll("[data-kritisk]").forEach(input=>{
    input.disabled = laast;
    input.title = laast ? "Låst - reisen er publisert. Klikk «Endre» for å låse opp." : "";
  });
  const holder = el("laasReiseinfo");
  if(state.trip.status === "kladd"){ holder.innerHTML = ""; }
  else {
    holder.innerHTML = opplaast
      ? `<span class="laas-linje">Låst opp for redigering i denne økten</span>`
      : `<span class="laas-linje">🔒 Kritiske felt er låst <button type="button" id="btnLaasOpp">Endre</button></span>`;
    const btn = el("btnLaasOpp");
    if(btn) btn.addEventListener("click", laasOpp);
  }
  el("kortReiseinfo").classList.toggle("laast", laast);
}

async function laasOpp(){
  const antall = await hentPaameldingsAntall();
  const antallTekst = (antall === null) ? "ukjent - tellingen feilet" : String(antall);
  const ok = confirm(
    "Denne reisen er publisert.\n\n" +
    "Påmeldinger: " + antallTekst + "\n\n" +
    "Endringer du gjør blir synlige for NYE kunder så snart de er lagret.\n\n" +
    "Vil du låse opp de kritiske feltene?"
  );
  if(!ok) return;
  opplaast = true;
  oppdaterLaasUI();
}

el("f-status").addEventListener("change", (e)=>{
  const ny = e.target.value;
  if(ny === "publisert"){
    // Enkel og hjelpsom sjekk - de reelle publiseringskravene bygges i
    // publiseringstrinnet. Her stoppes bare det åpenbare.
    const mangler = [];
    if(!(state.trip.title||"").trim()) mangler.push("Reisenavn");
    if(!state.trip.start_date || !state.trip.end_date) mangler.push("Fra- og til-dato");
    else if(beregnDager() === null) mangler.push("Til-dato må være etter fra-dato");
    if(mangler.length){
      alert("Reisen kan ikke publiseres ennå. Mangler:\n\n– " + mangler.join("\n– "));
      e.target.value = state.trip.status;
      return;
    }
  }
  state.trip.status = ny;
  opplaast = false;
  oppdaterLaasUI();
  markDirty();
});

async function hentPaameldingsAntall(){
  // Feiler tellingen, er svaret UKJENT (null) - aldri 0. Sperren under
  // feiler da STENGT.
  const [r1, r2] = await Promise.all([
    window.sb.from("registrations").select("id", { count:"exact", head:true }).eq("trip_id", tripId),
    window.sb.from("bookings").select("id", { count:"exact", head:true }).eq("trip_id", tripId),
  ]);
  if(r1.error || r2.error) return null;
  paameldingsAntall = (r1.count||0) + (r2.count||0);
  return paameldingsAntall;
}

/* ---------- Program ----------
   Dagene GENERERES fra reisens datoer. Brukeren skriver aldri dagnummer
   eller dato. Innholdet hører til DAGNUMMERET: flyttes fra-datoen, får dag 1
   ny dato, men beholder innholdet sitt - ingenting skyves mellom dager.

   Forkortes reisen, beholdes dagene utenfor perioden i state og i basen,
   men vises ikke. De kommer tilbake hvis reisen forlenges. En rolig beskjed
   forteller at de finnes. */

function dagDato(dagNr){
  const t = state.trip;
  if(!t.start_date) return null;
  const d = new Date(t.start_date + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + dagNr - 1);
  return d;
}
function formatDagDato(d){
  // «søndag 29. mars 2026» -> «Søndag 29. mars 2026». Kun første bokstav:
  // måneder skrives med liten forbokstav på norsk.
  const t = d.toLocaleDateString("nb-NO", { weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"UTC" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function dagHarInnhold(d){
  return !!((d.fields.title||"").trim() || (d.fields.description||"").trim() || d.bilder.length);
}
function nyTomDag(nr){
  return { id:null, day_number:nr, fields:{ title:"", description:"" }, endret:false,
           bilder:[], bilderEndret:false, originalBildeIds:new Set() };
}

// Hvilke dager som har en opplasting på gang. Per DAG - ett flagg for hele
// siden ville låst dag 4 når dag 3 laster opp.
const dagOpptatt = new Set();

function renderProgram(){
  const holder = el("programHolder");
  if(!holder) return;
  const N = beregnDager();
  const t = state.trip;

  // Et tak som ingen ekte reise treffer, men som stopper en tastefeil i
  // årstallet fra å generere hundretusener av kort.
  if(N && N > 365){
    holder.innerHTML = `<div class="program-melding">Reisen er satt til ${N} dager - mer enn ett år. Sjekk datoene i <a href="#" data-gaa-til="reiseinfo">Reiseinfo</a>.</div>`;
    const lenke = holder.querySelector("[data-gaa-til]");
    if(lenke) lenke.addEventListener("click", (e)=>{ e.preventDefault(); visFane("reiseinfo"); });
    return;
  }

  if(!N){
    holder.innerHTML = `<div class="program-melding">${
      (t.start_date && t.end_date)
        ? "Til-datoen er før fra-datoen. Rett datoene i Reiseinfo, så genereres programdagene automatisk."
        : "Programdagene genereres automatisk fra reisens fra- og til-dato. Sett datoene i <a href=\"#\" data-gaa-til=\"reiseinfo\">Reiseinfo</a> først."
    }</div>`;
    const lenke = holder.querySelector("[data-gaa-til]");
    if(lenke) lenke.addEventListener("click", (e)=>{ e.preventDefault(); visFane("reiseinfo"); });
    return;
  }

  // Sørg for at state har dag 1..N. Nye dager er tomme og uten rad -
  // de får ingen rad før noe skrives på dem.
  for(let n=1; n<=N; n++){
    if(!state.days.some(d=>d.day_number === n)) state.days.push(nyTomDag(n));
  }
  state.days.sort((a,b)=>a.day_number - b.day_number);

  const synlige = state.days.filter(d=>d.day_number <= N);
  const bevarte = state.days.filter(d=>d.day_number > N && dagHarInnhold(d));

  holder.innerHTML = "";

  if(bevarte.length){
    const nr = bevarte.map(d=>d.day_number);
    const spenn = nr.length === 1 ? "dag " + nr[0] : "dag " + nr[0] + "–" + nr[nr.length-1];
    const b = document.createElement("div");
    b.className = "program-bevart";
    b.textContent = (bevarte.length === 1 ? "Én dag" : bevarte.length + " dager") + " med innhold ligger bevart utenfor reiseperioden (" + spenn + "). "
      + "De vises ikke, og kommer tilbake hvis reisen forlenges igjen.";
    holder.appendChild(b);
  }

  synlige.forEach(d=>{
    const kort = document.createElement("div");
    kort.className = "dag-kort";
    kort.dataset.nr = d.day_number;
    const dato = dagDato(d.day_number);
    kort.innerHTML = `
      <div class="dag-kort-hode">
        <span class="dag-nr">Dag ${d.day_number}</span>
        <span class="dag-dato">${dato ? escapeHtml(formatDagDato(dato)) : ""}</span>
      </div>
      <input type="text" class="dag-tittel" placeholder="Dagens tittel" value="${escapeHtml(d.fields.title||"")}">
      <textarea class="dag-tekst" placeholder="Programtekst for dagen">${escapeHtml(d.fields.description||"")}</textarea>
      <div class="dag-bilder-label">Bilder</div>
      <div class="dag-galleri"></div>
    `;
    // Tekstfeltene tegnes ALDRI på nytt mens man skriver - bare state
    // oppdateres. Galleriet er sitt eget deltre og tegner seg selv.
    kort.querySelector(".dag-tittel").addEventListener("input", e=>{ d.fields.title = e.target.value; d.endret = true; markDirty(); });
    kort.querySelector(".dag-tekst").addEventListener("input", e=>{ d.fields.description = e.target.value; d.endret = true; markDirty(); });
    holder.appendChild(kort);
    renderDagGalleri(d);
  });
}

function renderDagGalleri(d){
  const kort = document.querySelector(`.dag-kort[data-nr="${d.day_number}"]`);
  if(!kort) return;
  const wrap = kort.querySelector(".dag-galleri");
  try{
    wrap.innerHTML = "";
    wrap.appendChild(window.bildevelger.galleri({
      // erFraBank skal bety «kan velges inn igjen fra plukkeren slik den står
      // nå». Er banken for det koblede reisemålet allerede hentet, sjekker vi
      // at bildet faktisk ligger der; ellers stoler vi på sporet.
      getBilder: ()=>{
        const bank = reisemaalBankCache.get(state.trip.reisemaal_id);
        return d.bilder.map(b=>({
          key:b.clientKey, url:b.image_url, alt:b.alt_text,
          erFraBank: !!b.bank_id && (bank ? bank.some(r=>r.id === b.bank_id) : true),
        }));
      },
      bank: ()=> dagBank(d),
      onVelg: (bilde)=>{
        d.bilder.push({ id:null, clientKey:newClientKey(), image_url:bilde.url, alt_text:bilde.alt_tekst || null, bank_id:bilde.id });
        d.bilderEndret = true; markDirty();
      },
      onFjern: (key)=>{
        d.bilder = d.bilder.filter(b=>b.clientKey !== key);
        d.bilderEndret = true; markDirty();
      },
      onFlytt: (key, retning)=>{
        const i = d.bilder.findIndex(b=>b.clientKey === key);
        const j = i + retning;
        if(i < 0 || j < 0 || j >= d.bilder.length) return;
        const [b] = d.bilder.splice(i,1); d.bilder.splice(j,0,b);
        d.bilderEndret = true; markDirty();
      },
      onLastOpp: (file)=> lastOppDagsbilde(d, file),
      erOpptatt: ()=> dagOpptatt.has(d.day_number),
      settOpptatt: (v)=>{ if(v) dagOpptatt.add(d.day_number); else dagOpptatt.delete(d.day_number); },
      etterEndring: ()=> renderDagGalleri(d),
    }));
  } catch(err){
    console.error("Kunne ikke tegne bildene for dag " + d.day_number + ":", err);
    wrap.innerHTML = '<div class="hint">Kunne ikke vise bildevelgeren. Last siden på nytt.</div>';
  }
}

// Banken for en programdag: reisemålets bildebank. Bilder som allerede
// ligger på DENNE dagen skjules i plukkeren; samme bilde på en annen dag er
// helt greit.
function dagBank(d){
  const rid = state.trip.reisemaal_id;
  const navn = reisemaalNavnFor(rid);
  return {
    tittel: navn ? ("Bildebank for " + navn) : "Reisemålets bildebank",
    erKoblet: ()=> !!state.trip.reisemaal_id,
    tomBeskjed: "Koble reisen til et reisemål i Reiseinfo for å se bildene i reisemålets bildebank. "
              + "Du kan også laste opp bilder direkte - de blir da liggende kun på denne reisen.",
    hentBilder: async ()=>{
      const rader = await hentReisemaalBank(state.trip.reisemaal_id);
      return rader.slice()
        .sort((a,b)=>(a.sortering??0)-(b.sortering??0))
        .map(r=>({ id:r.id, url:r.bilde_url, alt_tekst:r.alt_tekst }));
    },
    brukteIds: ()=> new Set(d.bilder.map(b=>b.bank_id).filter(Boolean)),
    maks: REISEMAAL_BANK_BILDER_MAKS,
  };
}

// Opplasting til en programdag: ALLTID privat på reisen, aldri til
// bildebanken (produktregelen, se toppen av shared/bildevelger.js).
// Filstien inneholder bevisst IKKE dagnummeret - et dagnummer kan bety noe
// annet etter at reisen er kortet og forlenget.
async function lastOppDagsbilde(d, file){
  if(file.size > BILDE_MAKS_BYTES){
    throw new Error("Filen er for stor (maks 15 MB).");
  }
  const m = file.name.match(/\.([a-z0-9]{1,5})$/i);
  const ext = m ? m[1].toLowerCase() : "jpg";
  const path = tripId + "/dager/" + newClientKey() + "." + ext;
  const { error } = await window.sb.storage.from("reise-bilder").upload(path, file, { upsert:false });
  if(error) throw error;
  const { data } = window.sb.storage.from("reise-bilder").getPublicUrl(path);
  d.bilder.push({ id:null, clientKey:newClientKey(), image_url:data.publicUrl, alt_text:null, bank_id:null });
  d.bilderEndret = true;
  markDirty();
  // Lagre med det samme - filen ligger allerede i lagringen. Ventes ikke på
  // (se samme resonnement ved forsidebildet).
  clearTimeout(autosaveTimer);
  autosaveDirty = false;
  performSave();
}

/* ---------- Faner ---------- */
function visFane(navn){
  document.querySelectorAll(".tab-btn[data-tab]").forEach(b=>b.classList.toggle("aktiv", b.dataset.tab === navn));
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("aktiv", p.dataset.panel === navn));
  // Programmet skal alltid speile datoene slik de står NÅ når man går inn.
  if(navn === "program" && autosaveKlar) renderProgram();
}
document.querySelectorAll(".tab-btn[data-tab]").forEach(btn=>{
  btn.addEventListener("click", ()=> visFane(btn.dataset.tab));
});

/* ---------- Sletting (cascade i basen tar påmeldingene - sperre) ---------- */
el("btnSlett").addEventListener("click", async ()=>{
  const antall = await hentPaameldingsAntall();
  if(antall === null){
    alert("Fikk ikke verifisert om reisen har påmeldinger (tellingen feilet).\n\n" +
      "Sletting er derfor sperret. Prøv igjen senere.");
    return;
  }
  if(antall > 0){
    alert("Denne reisen har " + antall + " påmelding(er) og kan ikke slettes.\n\n" +
      "Sletting ville også slettet påmeldingene permanent, med navn og persondata. " +
      "Sett reisen til Under arbeid i stedet dersom den ikke lenger skal vises.");
    return;
  }
  if(!confirm("Slette denne reisen permanent, inkludert program og bilder?")) return;
  const { error } = await window.sb.from("trips").delete().eq("id", tripId);
  if(error){ alert("Kunne ikke slette: " + error.message); return; }
  window.location.href = "reiser.html";
});

/* ---------- Innlasting ---------- */
function renderGrunnfelter(){
  const t = state.trip;
  el("navnVisning").textContent = t.title || "";
  el("f-status").value = t.status || "kladd";
  el("typeLine").textContent = TYPE_LABEL[t.trip_type] || t.trip_type || "";
  el("ri-navn").value = t.title || "";
  el("ri-undertittel").value = t.subtitle || "";
  el("ri-reisemaal").value = t.destination || "";
  el("ri-land").value = t.country || "";
  el("ri-fra").value = t.start_date || "";
  el("ri-til").value = t.end_date || "";
  el("ri-avreisested").value = t.departure_airport || "";
  el("ri-deltakere").value = state.internal.antall_deltakere ?? "";
  el("i-notater").value = state.internal.interne_notater || "";
  oppdaterDagerVisning();
  renderReisemaalKobling();
  renderForsidebilde();
}

async function lastReise(id){
  const [rTrip, rInternal, rDays, rReisemaal] = await Promise.all([
    window.sb.from("trips").select("*").eq("id", id).single(),
    window.sb.from("trip_internal").select("*").eq("trip_id", id).maybeSingle(),
    window.sb.from("trip_days").select("*").eq("trip_id", id).order("day_number"),
    window.sb.from("reisemaal").select("id,navn,land").order("navn"),
  ]);
  if(rTrip.error || !rTrip.data) return false;
  // Feiler en av datakildene, skal editoren stoppe - ikke vise en
  // tilsynelatende tom reise som en ny lagring så ville duplisert.
  // (Reisemål-registeret er unntaket: brukes kun til nedtrekket.)
  const lastefeil = [rInternal.error, rDays.error].filter(Boolean);
  if(lastefeil.length){
    el("loadMsg").textContent = "Kunne ikke laste hele reisen (" + lastefeil[0].message + "). Last siden på nytt før du redigerer.";
    return "stopp";
  }
  const trip = rTrip.data, internal = rInternal.data, days = rDays.data;
  reisemaalRegister = rReisemaal.data || [];
  reisemaalRegisterFeilet = !!rReisemaal.error;

  state.trip = {
    title: trip.title, subtitle: trip.subtitle, trip_type: trip.trip_type,
    destination: trip.destination, country: trip.country,
    reisemaal_id: trip.reisemaal_id || null,
    start_date: trip.start_date, end_date: trip.end_date,
    departure_airport: trip.departure_airport, status: trip.status,
    forsidebilde_url: trip.forsidebilde_url || null,
    forsidebilde_bank_id: trip.forsidebilde_bank_id || null,
    forsidebilde_reisemaal_id: trip.forsidebilde_reisemaal_id || null,
    forsidebilde_reisemaal_navn: trip.forsidebilde_reisemaal_navn || null,
  };
  state.sisteLagredeTittel = trip.title || "";
  state.internal = {
    interne_notater: (internal && internal.interne_notater) || "",
    antall_deltakere: (internal && internal.antall_deltakere != null) ? internal.antall_deltakere : null,
  };

  // ALLE dagene lastes - også de som ligger utenfor perioden. De skal
  // bevares, og de skal telles i beskjeden om bevarte dager.
  state.days = (days||[]).map(d=>({
    id:d.id, day_number:d.day_number,
    fields:{ title:d.title||"", description:d.description||"" }, endret:false,
    bilder:[], bilderEndret:false, originalBildeIds:new Set(),
  }));
  if(state.days.length){
    const { data: dayImgs, error: eImgs } = await window.sb.from("trip_day_images")
      .select("*").in("trip_day_id", state.days.map(d=>d.id)).order("sort_order");
    if(eImgs){
      el("loadMsg").textContent = "Kunne ikke laste hele reisen (" + eImgs.message + "). Last siden på nytt før du redigerer.";
      return "stopp";
    }
    const perDag = new Map(state.days.map(d=>[d.id, d]));
    (dayImgs||[]).forEach(b=>{
      const d = perDag.get(b.trip_day_id);
      if(!d) return;
      d.bilder.push({ id:b.id, clientKey:b.id, image_url:b.image_url, alt_text:b.alt_text, bank_id:b.bank_id || null, sort_order:b.sort_order });
    });
    state.days.forEach(d=>{ d.originalBildeIds = new Set(d.bilder.map(b=>b.id)); });
  }
  return true;
}

/* ---------- Init ---------- */
(async ()=>{
  const session = await requireLogin();
  if(!session) return;

  const params = new URLSearchParams(location.search);
  tripId = params.get("id");
  if(!tripId){
    el("loadMsg").textContent = "Mangler reise-ID i lenken.";
    return;
  }

  const ok = await lastReise(tripId);
  if(ok === "stopp") return; // lastefeil - melding er allerede satt
  if(!ok){
    el("loadMsg").textContent = "Fant ikke reisen, eller den ble slettet.";
    return;
  }
  await hentPaameldingsAntall();

  el("loadMsg").style.display = "none";
  el("editorArea").style.display = "block";
  renderGrunnfelter();
  renderProgram();
  oppdaterLaasUI();
  settStatus("");
  autosaveKlar = true;
})();
</script>
