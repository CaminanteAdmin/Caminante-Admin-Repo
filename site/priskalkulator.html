<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priskalkulator</title>
<style>
  :root{
    --surface-1:#fcfcfb;
    --page:#f9f9f7;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-muted:#898781;
    --grid:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --blue:#2a78d6;
    --blue-dark:#184f95;
    --good:#0ca30c;
    --critical:#d03b3b;
    --warning:#fab219;
    --card-bg:#eaf2fb;
    --card-border:#a9c9ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-1:#1a1a19;
      --page:#0d0d0d;
      --ink:#ffffff;
      --ink-2:#c3c2b7;
      --ink-muted:#898781;
      --grid:#2c2c2a;
      --baseline:#383835;
      --border:rgba(255,255,255,0.10);
      --blue:#3987e5;
      --blue-dark:#86b6ef;
      --good:#0ca30c;
      --critical:#e66767;
      --warning:#fab219;
      --card-bg:#16202c;
      --card-border:#3d6094;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--page);
    color:var(--ink);
    line-height:1.45;
  }
  header.app-header{
    padding:12px 24px;
    border-bottom:1px solid var(--border);
    background:var(--surface-1);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header.app-header h1{
    font-size:19px;
    margin:0;
    font-weight:700;
  }
  .topbar-user{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-2); }
  .btn{
    border:1px solid var(--border);
    background:var(--surface-1);
    color:var(--ink);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{ background:var(--page); }
  .btn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .btn.primary:hover{ background:var(--blue-dark); }
  .btn.small{ padding:5px 10px; font-size:12px; font-weight:500; }
  .btn.big{
    padding:16px 26px;
    font-size:16px;
    border-radius:10px;
  }
  .remove-btn{
    color:var(--critical);
    border-color:var(--critical);
    background:transparent;
  }
  .remove-btn:hover{ background:rgba(208,59,59,0.08); }
  main{
    padding:0 24px 48px;
    max-width:1320px;
    margin:0 auto;
  }
  .hero{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    padding:22px 0 16px;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .toolbar input[type="search"]{
    flex:1 1 240px;
    min-width:160px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    background:var(--surface-1);
    color:var(--ink);
  }
  .count-pill{ font-size:12.5px; color:var(--ink-muted); margin-left:auto; }
  .list-panel{
    background:var(--surface-1);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:14px;
    overflow-x:auto;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left;
    font-weight:600;
    color:var(--ink-2);
    padding:8px;
    background:var(--card-bg);
    border-bottom:1px solid var(--card-border);
    white-space:nowrap;
  }
  thead th:first-child{ border-top-left-radius:6px; }
  thead th:last-child{ border-top-right-radius:6px; }
  tbody td{ padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap; }
  tbody tr.row-clickable{ cursor:pointer; }
  tbody tr.row-clickable:hover{ background:var(--card-bg); }
  .navn-cell{ font-weight:600; }
  .num-cell{ font-variant-numeric:tabular-nums; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  /* v: samme ikon-knapp-mønster som forslag.html sin oversikt (kopiere-ikon
     / slette-ikon i stedet for tekstknappene "Dupliser"/"Slett") - tar
     mindre plass i en tabellrad. */
  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface-1);
    color:var(--ink-2);
    cursor:pointer;
    padding:0;
  }
  .icon-btn:hover{ background:var(--page); }
  .icon-btn.danger{ color:#b04a4a; }
  .icon-btn.danger:hover{ background:#fbeaea; border-color:#d03b3b; }
  .icon-btn svg{ width:15px; height:15px; display:block; }
  .load-msg{ padding:40px 24px; color:var(--ink-muted); font-size:13px; }
  .empty-msg{ padding:20px 8px; color:var(--ink-muted); font-size:13px; }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Caminante – Priskalkulator for gruppereiser</h1>
  </div>
  <div class="topbar-user">
    <span id="userName"></span>
    <button class="btn small" id="logoutBtn">Logg ut</button>
  </div>
</header>

<main>
  <div class="hero">
    <button class="btn primary big" id="btnOpprettKalkyle">+ Opprett ny kalkyle</button>
  </div>

  <div id="loadMsg" class="load-msg">Laster kalkyler…</div>

  <div id="mainArea" style="display:none;">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Søk på kundenavn eller reisemål…">
      <span class="count-pill" id="countPill"></span>
    </div>
    <div class="list-panel">
      <table>
        <thead>
          <tr>
            <th>Kundenavn</th>
            <th>Reise</th>
            <th>Antall deltakere</th>
            <th>Kundepris</th>
            <th>Omsetning</th>
            <th>Fortjeneste</th>
            <th>Sist endret</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty-msg" style="display:none;">Ingen kalkyler matcher søket.</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
/* ---------- Kalkyleoversikt ----------
   v38: erstatter den gamle "Åpne kalkyle"-sleide-inn-panelet i selve
   kalkulatoren med en egen oversiktsside, etter samme mønster som Forslag &
   tilbud (forslag.html -> forslag-editor.html). Selve regnearket/motoren bor
   nå i kalkyle-editor.html?kalkyle=<id>. Kalkyler lagres automatisk der -
   "Lagre"/"Lagre som kopi" er derfor fjernet, og erstattet med "Dupliser" på
   hver linje her. */

const nf = new Intl.NumberFormat('nb-NO', {maximumFractionDigits:0});
function kr(v){ return (v===null || v===undefined || isNaN(v)) ? '–' : nf.format(Math.round(v)) + ' kr'; }
function escapeHtml(str){
  return (str ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtSistEndret(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('nb-NO',{year:'numeric',month:'short',day:'numeric'}) + ' kl. ' + dt.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});
}

/* Reisemål + reisedato slås sammen til én "Reise"-kolonne i oversikten,
   f.eks. "Marrakech, 12.-15. okt 2027". reise_start_dato/reise_slutt_dato er
   rene dato-strenger (YYYY-MM-DD) fra <input type="date"> i editoren -
   parses manuelt (ikke new Date()) for å unngå tidssone-forskyvning. */
const MONTHS_SHORT = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
function parseIsoDate(s){
  if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if(!m) return null;
  return { y:parseInt(m[1],10), mo:parseInt(m[2],10)-1, d:parseInt(m[3],10) };
}
function fmtReiseDato(startStr, sluttStr){
  const start = parseIsoDate(startStr);
  const slutt = parseIsoDate(sluttStr);
  if(!start && !slutt) return '';
  if(start && slutt){
    if(start.y===slutt.y && start.mo===slutt.mo){
      return `${start.d}.-${slutt.d}. ${MONTHS_SHORT[start.mo]} ${start.y}`;
    }
    if(start.y===slutt.y){
      return `${start.d}. ${MONTHS_SHORT[start.mo]}–${slutt.d}. ${MONTHS_SHORT[slutt.mo]} ${start.y}`;
    }
    return `${start.d}. ${MONTHS_SHORT[start.mo]} ${start.y}–${slutt.d}. ${MONTHS_SHORT[slutt.mo]} ${slutt.y}`;
  }
  const only = start || slutt;
  return `${only.d}. ${MONTHS_SHORT[only.mo]} ${only.y}`;
}
function fmtReiseKolonne(reisemaal, startStr, sluttStr){
  const dato = fmtReiseDato(startStr, sluttStr);
  if(reisemaal && dato) return `${reisemaal}, ${dato}`;
  return reisemaal || dato || '';
}

let currentUserId = null;
let kalkylerListe = [];
let searchQuery = '';

async function loadKalkyler(){
  const { data, error } = await window.sb.from('kalkyler')
    .select('id,navn,skole_id,kalkyle_data,sist_endret,reise_start_dato,reise_slutt_dato')
    .order('sist_endret', { ascending:false });
  if(error){
    document.getElementById('loadMsg').textContent = 'Kunne ikke laste kalkyler: ' + error.message;
    return false;
  }
  // Reisemål og oppsummeringstall (antall/kundepris/omsetning/fortjeneste)
  // ligger inne i kalkyle_data (hhv. .values.m1_navn og .counts.*Visning) -
  // se serializeCalculator() i kalkyle-editor.html. Eldre kalkyler som ikke
  // er åpnet siden dette ble lagt til, viser "-" på tallkolonnene til de
  // åpnes og lagres på nytt.
  kalkylerListe = (data||[]).map(row=>{
    const counts = (row.kalkyle_data && row.kalkyle_data.counts) || {};
    const values = (row.kalkyle_data && row.kalkyle_data.values) || {};
    const reisemaal = values.m1_navn || '';
    return {
      ...row,
      reisemaal,
      reiseKolonne: fmtReiseKolonne(reisemaal, row.reise_start_dato, row.reise_slutt_dato),
      antall: counts.anslattVisning ?? null,
      kundepris: counts.kundeprisVisning ?? null,
      totalOms: counts.totalOmsVisning ?? null,
      dbTotalt: counts.dbTotaltVisning ?? null,
    };
  });
  return true;
}

function filteredListe(){
  if(!searchQuery) return kalkylerListe;
  const q = searchQuery.toLowerCase();
  return kalkylerListe.filter(k=>
    (k.navn||'').toLowerCase().includes(q) || (k.reisemaal||'').toLowerCase().includes(q));
}

function renderList(){
  const list = filteredListe();
  const body = document.getElementById('listBody');
  body.innerHTML = '';
  list.forEach(k=>{
    const tr = document.createElement('tr');
    tr.className = 'row-clickable';
    tr.innerHTML = `
      <td class="navn-cell">${escapeHtml(k.navn || 'Uten navn')}</td>
      <td>${escapeHtml(k.reiseKolonne)}</td>
      <td class="num-cell">${k.antall ?? '–'}</td>
      <td class="num-cell">${k.kundepris!=null ? kr(k.kundepris) : '–'}</td>
      <td class="num-cell">${k.totalOms!=null ? kr(k.totalOms) : '–'}</td>
      <td class="num-cell">${k.dbTotalt!=null ? kr(k.dbTotalt) : '–'}</td>
      <td>${escapeHtml(fmtSistEndret(k.sist_endret))}</td>
      <td class="row-actions">
        <button class="icon-btn" data-action="dupliser" data-id="${k.id}" title="Dupliser kalkyle">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6.5" y="6.5" width="10" height="10" rx="1.8"/><path d="M3.5 13V4.8A1.3 1.3 0 0 1 4.8 3.5h8.2"/></svg>
        </button>
        <button class="icon-btn danger" data-action="slett" data-id="${k.id}" title="Slett kalkyle">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V6M6.2 6l.6 9.3a1 1 0 0 0 1 .95h4.4a1 1 0 0 0 1-.95L14 6"/></svg>
        </button>
      </td>
    `;
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      window.location.href = `kalkyle-editor.html?kalkyle=${encodeURIComponent(k.id)}`;
    });
    body.appendChild(tr);
  });
  document.getElementById('emptyMsg').style.display = list.length===0 ? 'block' : 'none';
  document.getElementById('countPill').textContent = `${list.length} av ${kalkylerListe.length} kalkyler vises`;

  body.querySelectorAll('button[data-action="dupliser"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); dupliserKalkyle(btn.dataset.id); });
  });
  body.querySelectorAll('button[data-action="slett"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); slettKalkyle(btn.dataset.id); });
  });
}

async function opprettNyKalkyle(){
  const { data, error } = await window.sb.from('kalkyler').insert({
    navn: 'Uten navn',
    opprettet_av: currentUserId,
  }).select().single();
  if(error){ alert('Kunne ikke opprette kalkyle: ' + error.message); return; }
  window.location.href = `kalkyle-editor.html?kalkyle=${encodeURIComponent(data.id)}`;
}

async function opprettKalkyleForSkole(skoleId, skoleNavn){
  const { data, error } = await window.sb.from('kalkyler').insert({
    navn: skoleNavn || 'Uten navn',
    skole_id: skoleId,
    opprettet_av: currentUserId,
  }).select().single();
  if(error){ alert('Kunne ikke opprette kalkyle: ' + error.message); return; }
  window.location.href = `kalkyle-editor.html?kalkyle=${encodeURIComponent(data.id)}`;
}

async function dupliserKalkyle(id){
  const kilde = kalkylerListe.find(k=>k.id===id);
  if(!kilde) return;
  const { data: full, error: readErr } = await window.sb.from('kalkyler').select('*').eq('id', id).single();
  if(readErr){ alert('Kunne ikke lese kalkylen: ' + readErr.message); return; }
  const { data, error } = await window.sb.from('kalkyler').insert({
    navn: (full.navn || 'Uten navn') + ' (kopi)',
    skole_id: full.skole_id,
    reise_start_dato: full.reise_start_dato,
    reise_slutt_dato: full.reise_slutt_dato,
    kalkyle_data: full.kalkyle_data,
    opprettet_av: currentUserId,
  }).select().single();
  if(error){ alert('Kunne ikke duplisere: ' + error.message); return; }
  window.location.href = `kalkyle-editor.html?kalkyle=${encodeURIComponent(data.id)}`;
}

async function slettKalkyle(id){
  const kilde = kalkylerListe.find(k=>k.id===id);
  if(!confirm(`Slette kalkylen "${(kilde && kilde.navn) || 'Uten navn'}" permanent?`)) return;
  const { error } = await window.sb.from('kalkyler').delete().eq('id', id);
  if(error){ alert('Kunne ikke slette: ' + error.message); return; }
  kalkylerListe = kalkylerListe.filter(k=>k.id!==id);
  renderList();
}

document.getElementById('btnOpprettKalkyle').addEventListener('click', opprettNyKalkyle);
document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value; renderList(); });

(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  currentUserId = session.user.id;

  // Lenke fra Skoleoversikten: ?nySkole=<id>&nySkoleNavn=<navn> oppretter en
  // ny kalkyle forhåndskoblet til skolen, og sender deg rett inn i editoren -
  // listen under vises ikke i dette tilfellet.
  const params = new URLSearchParams(location.search);
  const nySkoleId = params.get('nySkole');
  if(nySkoleId){
    document.getElementById('loadMsg').textContent = 'Oppretter kalkyle…';
    await opprettKalkyleForSkole(nySkoleId, params.get('nySkoleNavn') || '');
    return;
  }

  const ok = await loadKalkyler();
  document.getElementById('loadMsg').style.display = 'none';
  if(!ok) return;
  document.getElementById('mainArea').style.display = 'block';
  renderList();
})();
</script>
</body>
</html>
