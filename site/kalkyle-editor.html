  return {
    navn: strVal('meta_navn','') || 'Uten navn',
    reise_start_dato: strVal('meta_start','') || null,
    reise_slutt_dato: strVal('meta_slutt','') || null,
    skole_id: currentSkoleId,
  };
}
function fillMeta(row){
  el('meta_navn').value = row.navn || '';
  el('meta_start').value = row.reise_start_dato || '';
  el('meta_slutt').value = row.reise_slutt_dato || '';
  currentSkoleId = row.skole_id || null;
  updateSkoleLinkDisplay();
}
function clearMeta(){
  ['meta_navn','meta_start','meta_slutt'].forEach(id=>{ if(el(id)) el(id).value=''; });
  currentSkoleId = null;
  updateSkoleLinkDisplay();
}

/* ---------- Autolagring ----------
   v38: kalkyle-editoren opprettes aldri lenger direkte - man kommer alltid
   inn her med en allerede opprettet, tom kalkyle-rad (opprettet fra
   oversikten, priskalkulator.html) og en ekte id i URL-en. Editoren gjør
   derfor bare UPDATE, aldri INSERT, og lagrer automatisk i stedet for
   manuelle Lagre/Lagre som kopi-knapper.
   autosaveSuppressed skrus på mens en kalkyle lastes inn (loadCalculatorData
   kaller recalcAll() som en del av innlastingen), slik at det å bare ÅPNE en
   kalkyle ikke i seg selv trigger en (overflødig) lagring. */
let autosaveTimer = null;
let autosaveSuppressed = false;
let autosaveInFlight = false;
let autosavePending = false;

function scheduleAutosave(){
  if(autosaveSuppressed || !currentKalkyleId) return;
  setKalkyleStatus('Ulagrede endringer …');
  if(autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(runAutosave, 1500);
}

async function runAutosave(){
  if(!currentKalkyleId) return;
  if(autosaveInFlight){ autosavePending = true; return; }
  autosaveInFlight = true;
  setKalkyleStatus('Lagrer …');
  const payload = { ...collectMeta(), kalkyle_data: serializeCalculator() };
  const { data, error } = await window.sb.from('kalkyler').update(payload).eq('id', currentKalkyleId).select('sist_endret').single();
  autosaveInFlight = false;
  if(error){
    setKalkyleStatus('Kunne ikke lagre: ' + error.message);
  } else {
    currentKalkyleSistEndret = data.sist_endret;
    setKalkyleStatus('Lagret ' + new Date(data.sist_endret).toLocaleTimeString('nb-NO', {hour:'2-digit', minute:'2-digit'}));
    updateForslagLinkDisplay();
  }
  if(autosavePending){ autosavePending = false; runAutosave(); }
}

async function openKalkyleById(id){
  setKalkyleStatus('Laster…');
  autosaveSuppressed = true;
  const { data, error } = await window.sb.from('kalkyler').select('*').eq('id', id).single();
  if(error){ setKalkyleStatus('Fant ikke kalkylen: ' + error.message); autosaveSuppressed = false; return; }
  currentKalkyleId = data.id;
  currentKalkyleSistEndret = data.sist_endret;
  // v46: loadCalculatorData() kaller buildModule1(false), som bygger om
  // #m1_turdetaljer helt fra bunnen - meta_start/meta_slutt ligger nå INNI
  // dette kortet, så de må fylles ut ETTER ombyggingen, ellers overskriver
  // ombyggingen datoene fillMeta() akkurat satte. syncDagerFraDatoer() kjøres
  // til slutt slik at "Antall dager" beregnes/låses riktig ut fra de faktiske
  // lagrede datoene, ikke bare den (tomme) tilstanden fra selve ombyggingen.
  loadCalculatorData(data.kalkyle_data);
  fillMeta(data);
  syncDagerFraDatoer();
  recalcAll();
  autosaveSuppressed = false;
  setKalkyleStatus('Sist lagret ' + new Date(data.sist_endret).toLocaleString('nb-NO'));
  updateForslagLinkDisplay();
}

/* ---------- Forslag & tilbud-integrasjon ----------
   Prinsipp: "Priskalkulatoren beregner - Forslag presenterer." Denne delen
   leser kun allerede beregnede/lagrede verdier (kundepris, enkeltromstillegg)
   og oppretter en rad i forslag-tabellen - ingen egen prisberegning her. */

async function updateForslagLinkDisplay(){
  const linkEl = el('forslagLink');
  linkedForslagId = null;
  if(!currentKalkyleId){
    if(linkEl) linkEl.innerHTML = '';
    updateForslagButtonState();
    return;
  }
  const { data, error } = await window.sb.from('forslag')
    .select('id,tittel')
    .eq('kalkyle_id', currentKalkyleId)
    .order('opprettet_dato', { ascending:false })
    .limit(1);
  if(error || !data || !data.length){
    if(linkEl) linkEl.innerHTML = '';
    updateForslagButtonState();
    return;
  }
  const f = data[0];
  linkedForslagId = f.id;
  if(linkEl) linkEl.innerHTML = `📄 <a href="forslag-editor.html?id=${encodeURIComponent(f.id)}">${(f.tittel||'Forslag').replace(/</g,'&lt;')} →</a>`;
  updateForslagButtonState();
}
/* v9: "Opprett forslag fra kalkyle"-knappen skal ikke lage et duplikat-
   forslag hver gang man kommer tilbake til en kalkyle som allerede har fått
   et forslag - den blir da "Tilbake til forslag" og åpner det eksisterende
   forslaget direkte i stedet. Kalt fra updateForslagLinkDisplay() (kjøres
   ved åpning av kalkylen OG etter hver autolagring), slik at knappen alltid
   stemmer med databasens faktiske tilstand. */
function updateForslagButtonState(){
  const btn = el('btnOpprettForslag');
  if(!btn) return;
  if(linkedForslagId){
    btn.textContent = 'Gå til forslag';
    btn.title = 'Åpner forslaget som allerede er opprettet fra denne kalkylen';
  } else {
    btn.textContent = 'Opprett forslag fra kalkyle';
    btn.title = 'Oppretter et nytt reiseforslag basert på denne kalkylen';
  }
}

/* Forslag-integrasjon, utvidet versjon: "Priskalkulatoren er i størst mulig
   grad kilden til de strukturerte reisedataene. Forslag presenterer disse
   dataene for kunden." Disse hjelpefunksjonene leser KUN allerede innsamlede
   data fra gatherModule1() (hoteller, fly-, transport-, aktivitets- og
   andre-kostnads-linjer) - ingen ny beregning, ingen endring av selve
   prisberegningen (pureCalc1 er urørt). */

const ROOM_TYPE_LABELS = Object.fromEntries(ROOM_TYPES.map(rt=>[rt.key, rt.label]));

// v43: matPlan -> tekst i "måltider"-databasekolonnen (fritekst, samme
// kolonne som ble brukt før v42-avkrysningen).
const MATPLAN_TEKST = {
  ingen: null,
  frokost: 'Frokost inkludert',
  halvpensjon: 'Halvpensjon inkludert',
  helpensjon: 'Helpensjon inkludert',
};
// v: "Romtype" i Forslaget er ikke lenger ett fritekstfelt, men Standard
// romtype + avkrysningsbare Andre romtyper (se forslag-editor.html sin
// renderRomtypeAndre()). Ved overføring fra kalkyle settes Standard romtype
// til hotellets valgte "Standard romtype" i kalkylen (h.standard), og Andre
// romtyper hukes AUTOMATISK av for enhver romtype (utenom selve standarden)
// som har fått en eksplisitt pris i kalkylen (h.prisSatt, fanget i
// gatherHotel() FØR enkeltrom-fallbacken - se der for hvorfor rekkefølgen
// betyr noe). Egendefinerte romtyper finnes ikke i kalkylen, så det feltet
// er alltid tomt ved overføring.
function bygHotellopphold(gm1){
  return (gm1.hotels||[])
    .filter(h=>h.netter>0)
    .map((h,i)=>{
      const romtypeStandard = ROOM_TYPE_LABELS[h.standard] || h.standard || 'Dobbeltrom';
      const romtypeAndre = ['enkelt','dobbel','trippel','fire']
        .filter(t => t!==h.standard && h.prisSatt && h.prisSatt[t])
        .map(t => ROOM_TYPE_LABELS[t]);
      return {
        sortering: i,
        sted: h.sted || null,
        fra_dato: null, til_dato: null,
        netter: h.netter,
        hotellnavn: h.navn || null,
        standard: ROOM_TYPE_LABELS[h.standard] || h.standard || null,
        romtype_standard: romtypeStandard,
        romtype_andre: romtypeAndre,
        romtype_egendefinert: [],
        maltider: MATPLAN_TEKST[h.matPlan] || null,
        // v: samme standardverdi (3 stjerner) som når et hotellopphold legges
        // til manuelt i selve Forslag-editoren ("+ Legg til hotellopphold") -
        // uten dette feltet fikk kalkyle-overførte hotellopphold ingen
        // stjerner satt i det hele tatt (vises som "blank" i editoren).
        stjerner: 3,
      };
    });
}

// v: Flyinformasjon-fanen i Forslag har nå en fast Utreise/Retur/Intern-
// struktur (kolonnen "kategori") i stedet for frie segmenter, og kalkylen
// har ikke nok detaljer (dato/tid/flightnr) til å vite hvilken retning eller
// hvor mange fly-oppføringer det egentlig blir. Som praktisk standardverdi
// legges alle fly-linjer fra kalkylen inn som et utkast under "Utreise", med
// bare rute-teksten (navn) forhåndsutfylt - dato/tid/flightnr/selskap og en
// eventuell Retur-flight må fylles inn manuelt i Forslaget etterpå.
// Buss-linjer (gm1.transport) overføres IKKE lenger som egne transportrader
// (Flyinformasjon-fanen er nå fly-spesifikk) - de vises fortsatt som
// tekstlinjer under "Inkludert i prisen" via bygInkludertFraKalkyle(), som før.
function bygTransportrader(gm1){
  const rader = [];
  let sortering = 0;
  (gm1.flyItems||[]).forEach(item=>{
    rader.push({
      sortering: sortering++,
      kategori: 'utreise',
      beskrivelse: item.navn || null,
    });
  });
  return rader;
}

// v19: hotell- og fly-linjer er FJERNET herfra (var tidligere med i
// listeposter/hotel-løkken over) - forslag-print.html bygger nå disse to
// linjetypene automatisk og LEVENDE, direkte fra forslag_hotellopphold/
// forslag_transport (se hotellNetterLinjer/flyLinjer der), i stedet for en
// engangs-kopi tatt herfra ved opprettelsestidspunktet. Det unngår at
// Inkludert-listen viser utdatert hotellnavn/flyinfo hvis Vidar endrer
// hotell eller flightrute i selve Forslaget etterpå (tidligere kunne BEGGE
// - den gamle, statiske teksten herfra OG den nye, korrekte - stå oppført
// samtidig i PDF-en). Buss/aktiviteter/andre kostnader har ingen tilsvarende
// strukturert kilde i Forslaget og overføres derfor fortsatt som før.
function bygInkludertFraKalkyle(gm1){
  const linjer = [];
  const listeposter = [
    ...(gm1.transport||[]),
    ...(gm1.aktiviteter||[]),
    ...(gm1.andreFasteKostnader||[]),
  ];
  listeposter.forEach(item=>{
    if(item.inkluderITilbud===false) return;
    const txt = (item.navn||'').trim();
    if(txt) linjer.push(txt);
  });
  return linjer;
}

async function opprettForslagFraKalkyle(){
  if(!currentKalkyleId){
    alert('Lagre kalkylen først - et forslag må kobles til en lagret kalkyle.');
    return;
  }
  let gm1, res1;
  try{
    gm1 = gatherModule1();
    res1 = pureCalc1(gm1);
  } catch(e){
    alert('Kunne ikke lese ut pris fra kalkylen: ' + e.message);
    return;
  }
  const destinasjon = strVal('m1_navn','') || '';
  const tittel = strVal('meta_navn','') || destinasjon || 'Nytt forslag';
  const payload = {
    tittel,
    destinasjon,
    kundetype: currentSkoleId ? 'Skole' : 'Annen gruppe',
    skole_id: currentSkoleId || null,
    // v: kunde_navn ble tidligere ikke satt her i det hele tatt - "Kundenavn"
    // fra kalkylen (meta_navn - samme felt brukes både som fritekst
    // kundenavn og for skolesøk, se el('meta_navn').value=s.navn ved valg av
    // skole) ble aldri overført til forslaget. meta_navn holder alltid
    // riktig visningstekst uansett om det er fritekst eller en valgt skole,
    // så feltet kan settes direkte uten å sjekke currentSkoleId.
    kunde_navn: strVal('meta_navn','') || null,
    ansvarlig: currentUserId,
    fra_dato: strVal('meta_start','') || null,
    til_dato: strVal('meta_slutt','') || null,
    antall_reisende: (res1 && res1.anslatt) ? res1.anslatt : null,
    kalkyle_id: currentKalkyleId,
    kalkyle_sist_endret_ved_kobling: currentKalkyleSistEndret,
    pris_per_person: (res1 && res1.kundepris!=null) ? res1.kundepris : null,
    // v: "Antall personer prisen er basert på" i Pris-fanen skal hentes fra
    // kalkylens antall BETALENDE deltakere (p.anslatt/res1.anslatt) - ikke
    // antall_reisende, som også teller med reiseledere.
    pris_antall_personer: (res1 && res1.anslatt) ? res1.anslatt : null,
    enkeltromstillegg: (res1 && res1.enkeltTilleggPerPerson!=null) ? res1.enkeltTilleggPerPerson : null,
    valuta: 'NOK',
    inkludert: bygInkludertFraKalkyle(gm1),
    // v: standard "Ikke inkludert"-punkter forhåndsutfylt - samme standardliste
    // som "+ Nytt forslag" i forslag.html, fritt redigerbare/slettbare etterpå.
    ikke_inkludert: ["Øvrige måltider", "Reiseforsikring", "Eventuell tips til guide og sjåfør"],
    opprettet_av: currentUserId,
  };
  const { data, error } = await window.sb.from('forslag').insert(payload).select().single();
  if(error){ alert('Kunne ikke opprette forslag: ' + error.message); return; }

  const hotellopphold = bygHotellopphold(gm1).map(h=>({...h, forslag_id: data.id}));
  const transportrader = bygTransportrader(gm1).map(t=>({...t, forslag_id: data.id}));
  const feil = [];
  if(hotellopphold.length){
    const r = await window.sb.from('forslag_hotellopphold').insert(hotellopphold);
    if(r.error) feil.push('hotellopphold: ' + r.error.message);
  }
  if(transportrader.length){
    const r = await window.sb.from('forslag_transport').insert(transportrader);
    if(r.error) feil.push('transport: ' + r.error.message);
  }
  if(feil.length){
    alert('Forslaget ble opprettet, men noe av reisedataene kunne ikke overføres automatisk (' + feil.join('; ') + '). Du kan legge dem inn manuelt i Forslaget.');
  }
  window.location.href = `forslag-editor.html?id=${encodeURIComponent(data.id)}`;
}

// v38: "Ny kalkyle"/"Åpne…"/"Lagre"/"Lagre som kopi"/"Slett" er fjernet fra
// editoren - det gjøres nå fra kalkyleoversikten (priskalkulator.html), som
// også har "Dupliser" og "Slett" på hver linje. Se opprettNyKalkyle()/
// dupliserKalkyle()/slettKalkyle() der i stedet.

(async function initKalkyleBar(){
  const session = await requireLogin();
  if(!session) return;
  currentUserId = session.user.id;

  await loadSkoleOptions();

  el('btnOpprettForslag').addEventListener('click', ()=>{
    if(linkedForslagId){
      window.location.href = `forslag-editor.html?id=${encodeURIComponent(linkedForslagId)}`;
    } else {
      opprettForslagFraKalkyle();
    }
  });

  el('meta_navn').addEventListener('input', (e)=>{
    // Fritekst som ikke (lenger) matcher et valgt skolenavn nøyaktig -> koblingen
    // fjernes helt til brukeren faktisk klikker et forslag i listen. Selve teksten
    // i feltet berøres ikke - man kan fortsette å skrive et rent fritekstnavn.
    if(currentSkoleId && skoleNameById.get(currentSkoleId) !== e.target.value){
      currentSkoleId = null;
      updateSkoleLinkDisplay();
    }
    renderSkoleDropdown(e.target.value);
    scheduleAutosave();
  });
  el('meta_navn').addEventListener('focus', (e)=>{ if(e.target.value.trim() && !currentSkoleId) renderSkoleDropdown(e.target.value); });
  el('meta_navn').addEventListener('blur', ()=> hideSkoleDropdown());
  // v46: meta_start/meta_slutt fikk tidligere sin autosave-lytter her (ved
  // init), men de to feltene ligger nå INNI #m1_turdetaljer, som bygges om av
  // buildModule1() ved flere anledninger (f.eks. "+ Legg til hotell") - en
  // addEventListener knyttet her ville forsvunnet ved neste ombygging. Autosave
  // og synkronisering av "Antall dager" er derfor koblet inn med inline
  // oninput-attributter direkte i turdetaljerFields() i stedet.
  el('metaSkoleClear').addEventListener('click', ()=>{
    // Fjerner kun koblingen til skolen - navnet som allerede står i feltet
    // beholdes, siden det nå også er kalkylens fritekstnavn.
    currentSkoleId = null;
    hideSkoleDropdown();
    updateSkoleLinkDisplay();
    scheduleAutosave();
  });

  // Editoren åpner alltid en allerede opprettet kalkyle - ?kalkyle=<id> er
  // obligatorisk. Kalkylen opprettes fra oversikten (priskalkulator.html),
  // som sender deg hit med en ekte id med det samme.
  const params = new URLSearchParams(location.search);
  const openId = params.get('kalkyle');
  if(openId){
    await openKalkyleById(openId);
  } else {
    setKalkyleStatus('Mangler kalkyle-id - går tilbake til oversikten…');
    window.location.href = 'priskalkulator.html';
  }
})();
</script>
