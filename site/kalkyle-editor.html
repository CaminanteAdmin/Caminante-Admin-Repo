<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priskalkulator</title>
<style>
  :root{
    --surface-1:#fcfcfb;
    --page:#f9f9f7;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-muted:#898781;
    --grid:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --blue:#2a78d6;
    --blue-dark:#184f95;
    --good:#0ca30c;
    --critical:#d03b3b;
    --warning:#fab219;
    --aqua:#1baf7a;
    /* Kakediagram (kun brukt der): ulike nyanser av blå, samme hue (212°),
       rekkefølgen er valgt slik at naboer i sirkelen har mest mulig ulik lyshet. */
    --cat-1:#0d2c4f;
    --cat-2:#1e66b8;
    --cat-3:#113a69;
    --cat-4:#2275d3;
    --cat-5:#154984;
    --cat-6:#3584de;
    --cat-7:#1a579e;
    --cat-8:#5094e2;
    --card-bg:#eaf2fb;
    --card-border:#a9c9ec;
    /* v29: rødt motstykke til --card-bg/--card-border, samme visuelle stil
       (dus/lys pastell bakgrunn + tydelig, klar kantlinje), brukt på bokser
       som viser en aktiv feil/mismatch (f.eks. "Estimert rommiks"). */
    --card-bg-critical:#fbeaea;
    --card-border-critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-1:#1a1a19;
      --page:#0d0d0d;
      --ink:#ffffff;
      --ink-2:#c3c2b7;
      --ink-muted:#898781;
      --grid:#2c2c2a;
      --baseline:#383835;
      --border:rgba(255,255,255,0.10);
      --blue:#3987e5;
      --blue-dark:#86b6ef;
      --good:#0ca30c;
      --critical:#e66767;
      --warning:#fab219;
      --aqua:#199e70;
      /* Kakediagram (kun brukt der): ulike nyanser av blå, samme hue (212°) */
      --cat-1:#1b66bb;
      --cat-2:#8bb9ee;
      --cat-3:#2079df;
      --cat-4:#aaccf3;
      --cat-5:#448fe4;
      --cat-6:#c5dcf7;
      --cat-7:#67a4e9;
      --cat-8:#e0ecfb;
      --card-bg:#16202c;
      --card-border:#3d6094;
      --card-bg-critical:#2c1616;
      --card-border-critical:#e66767;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--page);
    color:var(--ink);
    line-height:1.45;
  }
  header.app-header{
    padding:12px 24px;
    border-bottom:1px solid var(--border);
    background:var(--surface-1);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header.app-header h1{
    font-size:19px;
    margin:0;
    font-weight:700;
  }
  main{
    padding:0 24px 48px;
    max-width:1320px;
    margin:0 auto;
  }
  .workspace{
    display:grid;
    grid-template-columns:minmax(340px,480px) 1fr;
    gap:20px;
    margin-top:16px;
    align-items:start;
  }
  @media (max-width:900px){
    .workspace{grid-template-columns:1fr;}
  }
  .dual-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:16px;
  }
  .dual-col > .card{margin-bottom:0;}
  @media (max-width:700px){
    .dual-col{grid-template-columns:1fr;}
  }
  .section-heading{
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-muted);
    margin:22px 0 8px;
    padding-top:14px;
    border-top:1px solid var(--grid);
  }
  .section-heading:first-child{border-top:none;padding-top:0;margin-top:0;}
  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .card-title{
    font-weight:700;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--ink-2);
    margin:0 0 12px;
    padding:0;
  }
  .field{
    margin-bottom:10px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-2);
    margin-bottom:3px;
  }
  .input-group{
    display:flex;
    gap:6px;
  }
  input[type=text],input[type=number],input[type=date],select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--page);
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
  }
  /* v46: "Antall dager" ser slik ut når feltet er låst fordi verdien er
     beregnet automatisk fra reisedato - skal synes tydelig at feltet ikke er
     ment å skrives i akkurat nå (se syncDagerFraDatoer()). */
  input[type=number]:disabled{
    background:var(--grid);
    color:var(--ink-muted);
    cursor:not-allowed;
  }
  .input-group select{
    width:110px;
    flex:0 0 auto;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .row3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  .row4{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:8px;
  }
  @media (max-width:520px){
    .row4{grid-template-columns:1fr 1fr;}
  }
  .hint{
    font-size:12px;
    color:var(--ink-muted);
    margin-top:2px;
  }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-size:14px;color:var(--ink);}
  .hotel-block{
    border-top:1px dashed var(--grid);
    padding-top:12px;
    margin-top:12px;
  }
  .hotel-block:first-of-type{border-top:none;margin-top:0;padding-top:0;}
  input.hotel-name-input{
    display:block;
    width:auto;
    max-width:100%;
    margin:0 0 8px;
    padding:2px 4px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-2);
    background:transparent;
    border:1px solid transparent;
    border-radius:4px;
  }
  input.hotel-name-input:hover{border-color:var(--card-border);}
  input.hotel-name-input:focus{
    background:var(--surface-1);
    border-color:var(--card-border);
    outline:none;
  }
  .rate-card{
    background:var(--page);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-top:8px;
  }
  .rate-row{
    display:grid;
    grid-template-columns:1fr 90px 80px;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
    font-size:13px;
  }
  .rate-row .rt-label{color:var(--ink-2);}
  .list-row{
    display:grid;
    grid-template-columns:2fr 1fr 96px 30px;
    gap:6px;
    align-items:center;
    margin-bottom:6px;
  }
  .list-row input,.list-row select{margin:0;}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn{
    border:1px solid var(--border);
    background:var(--surface-1);
    color:var(--ink);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
  }
  .btn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .btn.ghost{
    background:transparent;
  }
  .btn.small{
    padding:5px 10px;
    font-size:12px;
    font-weight:500;
  }
  .remove-btn{
    color:var(--critical);
    border-color:var(--critical);
    background:transparent;
    padding:5px 8px;
  }
  .remove-btn:hover{background:rgba(208,59,59,0.08);}
  .toolbar{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin:16px 0 4px;
  }
  .warning-box{
    background:rgba(250,178,25,0.14);
    border:1px solid var(--warning);
    color:var(--ink);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
  }
  .critical-box{
    background:rgba(208,59,59,0.10);
    border:1px solid var(--critical);
    color:var(--ink);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-bottom:6px;
  }
  .stat-tile{
    background:var(--page);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
  }
  .stat-tile .label{
    font-size:12px;
    color:var(--ink-muted);
    margin-bottom:4px;
  }
  .stat-tile .value{
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat-tile.hero .value{font-size:28px;color:var(--blue);}
  .stat-tile .sub{
    font-size:12px;
    color:var(--ink-2);
    margin-top:2px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:8px;
  }
  th,td{
    text-align:right;
    padding:7px 8px;
    border-bottom:1px solid var(--grid);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  th:first-child,td:first-child{text-align:left;}
  th{
    color:var(--ink-muted);
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  tr.base-row td{
    background:rgba(42,120,214,0.08);
    font-weight:700;
  }
  .chart-wrap{
    margin-top:10px;
  }
  .chart-wrap svg{width:100%;height:auto;display:block;}
  .legend-row{
    display:flex;
    gap:14px;
    align-items:center;
    font-size:12px;
    color:var(--ink-2);
    margin-top:6px;
  }
  .legend-swatch{
    display:inline-block;
    width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;
  }
  .db-note{
    font-size:12px;
    color:var(--ink-2);
    background:var(--page);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    margin-top:8px;
  }
  /* v18: kompakt høyde på alle bokser i resultatpanelet (høyresiden), slik at
     mer info vises uten scrolling. Kun #m1_results - venstre inputpanel er
     upåvirket. Bredden på boksene er uendret, kun vertikale mål er redusert. */
  #m1_results .card{
    padding:12px 16px;
    margin-bottom:12px;
  }
  #m1_results .dual-col{margin-bottom:12px;}
  #m1_results .card-title{margin:0 0 8px;}
  #m1_results .stat-row{gap:8px;margin-bottom:2px;}
  #m1_results .stat-tile{padding:8px 12px;}
  #m1_results .stat-tile .value{font-size:19px;}
  #m1_results .stat-tile.hero .value{font-size:23px;}
  #m1_results .stat-tile .label{margin-bottom:2px;}
  #m1_results table{margin-top:4px;}
  #m1_results th,#m1_results td{padding:5px 8px;}

  /* ==========================================================
     Lagt til for Caminante Admin: topbar-brukerområde, kalkyle-
     verktøylinje (lagre/åpne/slett) og "Åpne kalkyle"-panelet.
     Rører ikke noen av klassene/reglene over - kun nye, egne regler,
     bygget med de samme CSS-variablene som resten av siden.
     ========================================================== */
  .topbar-user{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--ink-2);
  }
  /* v46: droppet igjen (etter tilbakemelding) - hverken "vinkel"-formen eller
     den sømløse overlapp-boksen fra v45 er lenger i bruk. Reiseinformasjon
     er nå bare et helt vanlig .card i venstre kolonne. Knapperaden
     ("Tilbake til oversikten" osv.) og lagringsstatusen ligger IKKE lenger i
     noen boks - de står direkte på sidens bakgrunn, øverst i høyre kolonne,
     over "Beregnet pris per deltaker"/"Kostnadsfordeling" (se #m1_results).
     .workspace (se lenger opp) har fortsatt align-items:start, slik at hver
     kolonne kun tar den høyden dens eget innhold trenger, og kortene under
     en kort høyrekolonne-topp flyter rett opp under - denne effekten trengte
     aldri selve "vinkel"-boksen, bare den kontinuerlige to-kolonners flyten. */
  .kalkyle-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .kalkyle-status{
    font-size:12px;
    color:var(--ink-muted);
    margin-top:6px;
  }
  .ovl-open{ position:fixed; inset:0; background:rgba(11,11,11,0.30); display:none; z-index:30; }
  .ovl-open.open{ display:block; }
  .open-panel{
    position:fixed;
    top:0; right:0; bottom:0;
    width:min(480px,100%);
    background:var(--surface-1);
    box-shadow:-8px 0 24px rgba(0,0,0,0.2);
    transform:translateX(100%);
    transition:transform .18s ease;
    overflow-y:auto;
    z-index:31;
    padding:20px 22px 40px;
  }
  .open-panel.open{ transform:translateX(0); }
  .open-panel .close-btn{
    position:absolute; top:14px; right:16px;
    border:none; background:none; font-size:20px; cursor:pointer; color:var(--ink-muted);
  }
  .open-panel h2{ font-size:16px; margin:0 0 14px; padding-right:30px; }
  .kalkyle-item{
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .kalkyle-item:hover{ background:var(--page); }
  .kalkyle-item .k-navn{ font-weight:700; font-size:13px; }
  .kalkyle-item .k-meta{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>

<header class="app-header">
  <div>
    <h1>Caminante – Priskalkulator for gruppereiser</h1>
  </div>
  <div class="topbar-user">
    <span id="userName"></span>
    <button class="btn small" id="logoutBtn">Logg ut</button>
  </div>
</header>

<main>

  <section id="module1">
    <!-- v46: droppet den sømløse "vinkel"-boksen fra v45 igjen, etter
         tilbakemelding. Venstre kolonne: Reiseinformasjon er nå bare et helt
         vanlig .card, etterfulgt direkte av #m1_inputs-kortene. Reisedato
         flyttet inn i Reiseinformasjon-kortet (rendres av turdetaljerFields(),
         rett under Reisemål - se #m1_turdetaljer). Høyre kolonne: knapperaden
         og lagringsstatusen ligger IKKE lenger i noen boks - de står direkte
         på sidens bakgrunn øverst, etterfulgt av #m1_results-kortene (inkl.
         "Beregnet pris per deltaker" sammen med "Kostnadsfordeling", som før). -->
    <div class="workspace">
      <div class="col-left">
        <div class="card">
          <div class="card-title">Reiseinformasjon</div>
          <div class="field">
            <label for="meta_navn">Kundenavn</label>
            <div style="position:relative;">
              <input type="text" id="meta_navn" placeholder="F.eks. Marrakech 2027, eller søk skolenavn…" autocomplete="off" style="width:100%; box-sizing:border-box; padding-right:24px;">
              <button type="button" id="metaSkoleClear" title="Fjern kobling til skole" style="display:none; position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:13px; color:var(--ink-muted); line-height:1; padding:3px 5px;">✕</button>
              <div id="skoleDropdown" style="display:none; position:absolute; z-index:20; top:100%; left:0; right:0; margin-top:2px; background:var(--surface-1); border:1px solid var(--border); border-radius:6px; max-height:220px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.12);"></div>
            </div>
            <div class="save-hint" id="skoleLink" style="margin-top:4px; font-size:10px;"></div>
            <div class="save-hint" id="forslagLink" style="margin-top:2px; font-size:10px;"></div>
            <div class="hint" style="margin-top:6px;">Skriv fritt, eller begynn å skrive et skolenavn for å koble kalkylen til en skole.</div>
          </div>
          <!-- v41: Turdetaljer (Reisemål, Reisedato, Antall dager, Antall
               deltakere/reiseledere, valuta) rendres inn her av
               buildModule1()/turdetaljerFields() - rett under Kundenavn og
               hjelpeteksten, som del av samme Reiseinformasjon-boks. -->
          <div id="m1_turdetaljer"></div>
        </div>
        <div class="inputs" id="m1_inputs"></div>
      </div>
      <div class="col-right">
        <div class="kalkyle-actions">
          <a class="btn small" href="priskalkulator.html" style="text-decoration:none;display:inline-flex;align-items:center;">← Tilbake til oversikten</a>
          <!-- v10: "Opprett tilbud fra kalkyle"-placeholderen er fjernet -
               Tilbud-flyten går nå via Forslag (se "Gå til forslag"/"Opprett
               forslag fra kalkyle" over) i stedet for en egen snarvei her. -->
          <button class="btn small" id="btnOpprettForslag" title="Oppretter et nytt reiseforslag basert på denne kalkylen">Opprett forslag fra kalkyle</button>
        </div>
        <div class="kalkyle-status" id="kalkyleStatus" style="margin-bottom:12px;">Laster…</div>
        <div class="results" id="m1_results"></div>
      </div>
    </div>
  </section>

</main>

<script>
/* =========================================================================
   CAMINANTE PRISKALKULATOR – v4
   Bygget etter kartleggingsdokumentet "Priskalkulator for gruppereiser –
   kartlegging og beregningslogikk" i Caminante-prosjektet.
   Endringer i v4 (2026-07-12, samme dag som v3):
   - Kommisjonsfeltet på hotellenes rate-kort er fjernet. Prisene som legges
     inn i rate-kortet skal nå være nettopriser (etter ev. kommisjon).
   - Modul 1 har fått "Standard romtype" på hvert hotell, brukt til et
     automatisk romanslag (rundet opp) når detaljert romfordeling ikke er
     fylt inn. Ved flere hotell uten detaljert fordeling deles hodetallet
     likt mellom dem, med et ev. oddetall lagt til det første.
   - Antall netter settes automatisk til dager−1 når et modul kun har ett
     hotell (feltet fjernes fra skjemaet). Ved flere hotell er netter per
     hotell fortsatt manuelt, og summen valideres mot dager−1.
   - Mat-kortet har fått frokost/lunsj/middag stablet i én kolonne i stedet
     for på rad, med bredere beløpsfelt og smalere valutafelt.
   - Reiseleder henter nå «Reisekostnader» (fly+aktiviteter) og «Mat»
     automatisk fra deltakernes satser i stedet for egne manuelle felt.
     Opphold i enkeltrom beregnes fortsatt automatisk. Honorar/dag er
     fortsatt manuelt, og et nytt valgfritt felt «Andre kostnader for
     reiseleder» er lagt til.
   - «Pris»-boksen (Modul 1: dekningsbidrag, Modul 2: pris og
     påmeldingsscenarioer) er flyttet opp mellom Reiseinformasjon og
     Reisekostnader. Modul 1 sitt dekningsbidrag er nå en nedtrekksmeny
     500–4000 kr i trinn på 100, med 1000 kr forhåndsvalgt.
   - «Friplasser»/«fripersoner» er gjennomgående byttet til «lærerplasser»
     (kun Modul 1).
   - Modul 1 sitt resultatpanel er splittet i tre bolker: kostnadsdetaljer
     per person, kostnadsdetaljer totalt, og fortjeneste/dekningsbidrag
     (kr og % per deltaker og totalt).
   Tidligere, fra v3 (strukturell omlegging):
   - "Grunndata" omdøpt til "Reiseinformasjon", alltid øverst, felles for
     begge moduler, og en fleksibel liste over valutaer.
   - Hver kostnadslinje (inkl. listerader) har en valuta-nedtrekksmeny mot
     de definerte valutaene i stedet for en enkel NOK/FX-bryter.
   - Gruppering "Reisekostnader" i fast rekkefølge for begge moduler.
   - Fikset: Modul 2 manglet tidligere et fly-felt i skjemaet – flykostnad
     ble alltid 0 i Modul 2.
   - Fikset: "+ Legg til"-knapper bygde hele skjemaet på nytt og slettet alt
     utfylt data. Løst med en snapshot/gjenopprett-mekanisme.
   ========================================================================= */

/* ---------- Generelle DOM-hjelpere ---------- */
function el(id){ return document.getElementById(id); }
function num(id, def){ const e=el(id); if(!e) return def; const v=parseFloat(e.value); return isNaN(v)?def:v; }
function strVal(id, def){ const e=el(id); return e ? (e.value||def) : def; }
function isChecked(id){ const e=el(id); return e ? e.checked : false; }
// v43: leser hvilken matplan-radio som er valgt for et gitt hotell
// (hp = f.eks. "m1_hotel1_"). Defaulter til 'frokost' hvis feltene av en
// eller annen grunn ikke finnes ennå i DOM-en (f.eks. midt i en rebuild).
function matPlanValue(hp){
  const opts = ['ingen','frokost','halvpensjon','helpensjon'];
  for(const opt of opts){ if(isChecked(hp+'matplan_'+opt)) return opt; }
  return 'frokost';
}

const nf = new Intl.NumberFormat('nb-NO', {maximumFractionDigits:0});
function kr(v){ return (v===null || v===undefined || isNaN(v)) ? '–' : nf.format(Math.round(v)) + ' kr'; }
function pct(v){ return (v===null || v===undefined || isNaN(v)) ? '–' : v.toFixed(1).replace('.',',') + ' %'; }
function num1(v){ return (v===null || v===undefined || isNaN(v)) ? '–' : nf.format(Math.round(v)); }

/* ---------- State: antall hotell / listelinjer / valutaer per modul ---------- */
/* DEFAULT_COUNTS: antallet linjer som står i skjemaet fra start (før brukeren
   selv legger til noe). Brukes til å avgjøre hvilke linjer som skal ha en
   fjern-knapp: kun linjer brukeren selv har lagt til (indeks >= grunntall)
   kan fjernes - linjene som står der som standard skal ikke ha fjern-knapp. */
const DEFAULT_COUNTS = {hotelCount:1, aktCount:2, fastCount:2, transportCount:2, flyCount:1};
const DEFAULT_VALUTA_COUNT = 1;
/* v9: lærerplasser og reiseledere er slått sammen til én kombinert kategori
   ("Antall reiseledere", registrert i Reiseinformasjon sammen med Antall
   deltakere, kun Modul 1). MAX_REISELEDERE er et praktisk tak på hvor mange
   individuelle honorar/andre kostnader-feltpar som rendres i skjemaet. */
const MAX_REISELEDERE = 10;
const state = {
  m1: {...DEFAULT_COUNTS, valutaer:['EUR'], sensIndex:null, kundepris:null}
};

/* ---------- Bevar feltverdier på tvers av rebuilds ---------- */
function snapshotValues(rootId){
  const root = el(rootId);
  const vals = {};
  if(!root) return vals;
  root.querySelectorAll('input, select').forEach(elx=>{
    if(!elx.id) return;
    // v43: radioknapper (f.eks. matplan-valget på hotell) må fanges på
    // .checked akkurat som checkbox - ellers fanges kun den statiske
    // value-attributten, som ikke sier noe om hvilken radio i gruppen som
    // faktisk er valgt, og valget mistes stille ved neste strukturelle rebuild.
    vals[elx.id] = (elx.type==='checkbox' || elx.type==='radio') ? elx.checked : elx.value;
  });
  return vals;
}
function restoreValues(rootId, vals){
  const root = el(rootId);
  if(!root) return;
  root.querySelectorAll('input, select').forEach(elx=>{
    if(!elx.id || !Object.prototype.hasOwnProperty.call(vals, elx.id)) return;
    if(elx.type==='checkbox' || elx.type==='radio') elx.checked = vals[elx.id];
    else elx.value = vals[elx.id];
  });
}
/* v41: Reiseinformasjon/Turdetaljer-feltene (Reisemål, Antall dager,
   deltakere, reiseledere, valuta) flyttet ut av #m1_inputs til en egen
   #m1_turdetaljer-container (se buildModule1()) - disse to hjelperne fanger
   og gjenoppretter felt fra BEGGE containerne samlet, slik at kall som
   snapshotter/gjenoppretter "hele modulen" (f.eks. ved fjerning av en
   hotell-/listelinje) ikke mister disse feltverdiene. */
function snapshotModuleAll(moduleKey){
  return { ...snapshotValues(moduleKey+'_inputs'), ...snapshotValues(moduleKey+'_turdetaljer') };
}
function restoreModuleAll(moduleKey, vals){
  restoreValues(moduleKey+'_inputs', vals);
  restoreValues(moduleKey+'_turdetaljer', vals);
}

/* ---------- Fjerne linjer: reindekser snapshot-verdier når en linje midt i en liste fjernes ---------- */
function shiftIndexedValues(vals, prefix, tag, removeIdx){
  const re = new RegExp('^'+tag+'(\\d+)_(.*)$');
  const out = {};
  Object.keys(vals).forEach(key=>{
    if(!key.startsWith(prefix)){ out[key]=vals[key]; return; }
    const rest = key.slice(prefix.length);
    const m = rest.match(re);
    if(!m){ out[key]=vals[key]; return; }
    const idx = parseInt(m[1],10);
    if(idx===removeIdx) return; // dropp verdiene for linjen som fjernes
    const newIdx = idx>removeIdx ? idx-1 : idx;
    out[`${prefix}${tag}${newIdx}_${m[2]}`] = vals[key];
  });
  return out;
}
function shiftCurrencyRefs(vals, removedIdx){
  const out = {};
  Object.keys(vals).forEach(key=>{
    let v = vals[key];
    if(key.endsWith('_cur') && typeof v==='string' && /^v\d+$/.test(v)){
      const j = parseInt(v.slice(1),10);
      if(j===removedIdx) v = 'NOK'; // valutaen linjen pekte på er fjernet
      else if(j>removedIdx) v = 'v'+(j-1);
    }
    out[key] = v;
  });
  return out;
}

/* ---------- Valuta: liste, nedtrekksmenyer og kurser ---------- */
function currencyOptions(moduleKey){
  const list = state[moduleKey].valutaer;
  let o = `<option value="NOK">NOK</option>`;
  list.forEach((kode,i)=>{
    const label = (kode && kode.trim()) ? kode.trim().toUpperCase() : `Valuta ${i+1}`;
    o += `<option value="v${i}">${label}</option>`;
  });
  return o;
}
function addValuta(moduleKey){
  state[moduleKey].valutaer.push('');
  buildModule1();
  recalcAll();
}
function updateValutaKode(moduleKey, idx, value){
  state[moduleKey].valutaer[idx] = value;
  buildModule1();
  recalcAll();
}
function removeValuta(moduleKey, idx){
  const prefix = moduleKey+'_';
  let vals = snapshotModuleAll(moduleKey);
  vals = shiftIndexedValues(vals, prefix, 'valuta', idx);
  vals = shiftCurrencyRefs(vals, idx);
  state[moduleKey].valutaer.splice(idx,1);
  buildModule1(false);
  restoreModuleAll(moduleKey, vals);
  recalcAll();
}
function currencyRate(prefix, moduleKey, idx){
  const kurs = num(`${prefix}valuta${idx}_kurs`, 1);
  const margin = num(`${prefix}valuta${idx}_margin`, 0);
  return (kurs||1) * (1 + (margin||0)/100);
}
function resolveCurValue(raw, curSelectEl, prefix, moduleKey){
  const curVal = curSelectEl ? curSelectEl.value : 'NOK';
  if(!curVal || curVal==='NOK') return raw;
  const idx = parseInt(curVal.slice(1),10);
  if(isNaN(idx)) return raw;
  return raw * currencyRate(prefix, moduleKey, idx);
}
function moneyValue(prefix, id, moduleKey){
  const raw = num(prefix+id, 0)||0;
  return resolveCurValue(raw, el(prefix+id+'_cur'), prefix, moduleKey);
}
function valutaInfoText(prefix, moduleKey){
  const list = state[moduleKey].valutaer;
  if(!list.length) return 'Ingen utenlandske valutaer lagt til – alle kostnader regnes i NOK.';
  return 'Justerte kurser: ' + list.map((kode,i)=>{
    const rate = currencyRate(prefix, moduleKey, i);
    const label = (kode && kode.trim()) ? kode.trim().toUpperCase() : `Valuta ${i+1}`;
    return `${label} ${rate.toFixed(3)} NOK`;
  }).join(' · ');
}

     erstattet med en avkrysning "Inkludert frokost". v43: avkrysningen er nå
     utvidet til fire gjensidig utelukkende radioknapper ("Ingen måltider" /
     "Inkludert frokost" [standard] / "Inkludert halvpensjon" / "Inkludert
     helpensjon") - se matPlanValue()/gatherHotel()/bygHotellopphold()/
     bygInkludertFraKalkyle() for hvordan verdien brukes videre, og
     refreshMatSkjulteRader() for hvordan valget skjuler rader i Mat-kortet
     lenger nede. "Sted / by"-feltet er fjernet igjen på samme ønske fra

  const MATPLAN_OPTIONS = [

  return `

function addHotel(key){
  if(state[key].hotelCount<3) state[key].hotelCount++;

  recalcAll();
}

function removeHotel(moduleKey, idx){
  if(state[moduleKey].hotelCount<=1) return;
  const prefix = moduleKey+'_';
  let vals = snapshotModuleAll(moduleKey);
  vals = shiftIndexedValues(vals, prefix, 'hotel', idx);
  const tn = touchedNetter[moduleKey];
  const newTn = {};
  Object.keys(tn).forEach(k=>{
    const i = parseInt(k,10);
    if(i===idx) return;
    newTn[String(i>idx?i-1:i)] = tn[k];
  });
  touchedNetter[moduleKey] = newTn;
  state[moduleKey].hotelCount--;
  buildModule1(false);
  restoreModuleAll(moduleKey, vals);
  recalcAll();
}

/* ---------- Fleksible lister: transport/guide, aktiviteter, andre faste kostnader ---------- */
/* Forslag-integrasjon (additivt, påvirker aldri beløpssummeringen - ren
   tilleggsinformasjon til "Opprett forslag fra kalkyle"). v36: eget
   "Kundetekst til Inkludert"-felt er fjernet - selve navn/beskrivelse-feltet
   i linjen (f.eks. "Fly", "Buss") brukes direkte som Inkludert-tekst. v37:
   type-valget på transportlinjer er også fjernet igjen på ønske fra Vidar -
   alle transportlinjer overføres nå til Forslaget som type "Buss" (kan
   justeres manuelt i Forslaget ved behov). v40: avkrysningen "Ta med i
   Inkludert" er fjernet igjen - alt som er med i kalkylen regnes nå alltid
   som inkludert (se gatherList() nedenfor, som ikke lenger leser noe
   avkrysningsfelt). */

function listCard(prefix, kind, title, hint, countKey, moduleKey, defaults){
  const count = state[moduleKey][countKey];
  const baseCount = DEFAULT_COUNTS[countKey] || 0;
  let rows = '';
  for(let i=0;i<count;i++){
    const rid = `${prefix}${kind}_${i}_`;
    const defName = (defaults && defaults[i]) ? defaults[i] : '';
    const removeBtn = i>=baseCount ? `<button type="button" class="btn small remove-btn" onclick="removeListRow('${moduleKey}','${countKey}','${kind}',${i})" title="Fjern linje">✕</button>` : '';
    rows += `
      <div class="list-row">
        <input type="text" id="${rid}navn" placeholder="Navn/beskrivelse" value="${defName}" oninput="recalcAll()">
        <input type="number" id="${rid}belop" placeholder="beløp" min="0" step="10" oninput="recalcAll()">
        <select id="${rid}cur" oninput="recalcAll()" onchange="recalcAll()">${currencyOptions(moduleKey)}</select>
        ${removeBtn}
      </div>`;
  }
  return `
    <div class="card">
      <div class="card-title">${title}</div>
      <div id="${prefix}${kind}_rows">${rows}</div>
      <button type="button" class="btn small" onclick="addListRow('${moduleKey}','${countKey}')">+ Legg til linje</button>
      ${hint ? `<div class="hint" style="margin-top:6px;">${hint}</div>` : ''}
    </div>`;
}

function addListRow(moduleKey, countKey){
  state[moduleKey][countKey]++;
  buildModule1();
  recalcAll();
}

function removeListRow(moduleKey, countKey, kind, idx){
  const prefix = moduleKey+'_';
  let vals = snapshotModuleAll(moduleKey);
  vals = shiftIndexedValues(vals, prefix, kind+'_', idx);
  state[moduleKey][countKey] = Math.max(0, state[moduleKey][countKey]-1);
  buildModule1(false);
  restoreModuleAll(moduleKey, vals);
  recalcAll();
}

function gatherList(prefix, kind, count, moduleKey){
  const items = [];
  for(let i=0;i<count;i++){
    const rid = `${prefix}${kind}_${i}_`;
    const belopRaw = num(rid+'belop',0)||0;
    if(!belopRaw) continue;
    const belop = resolveCurValue(belopRaw, el(rid+'cur'), prefix, moduleKey);
    const item = {navn:strVal(rid+'navn',''), belop};
    // Forslag-integrasjon (additivt - påvirker ikke beløpssummeringen over,
    // kun brukt av "Opprett forslag fra kalkyle"): alt som er med i kalkylen
    // regnes alltid som inkludert (v40 - avkrysningen er fjernet).
    item.inkluderITilbud = true;
    items.push(item);
  }
  return items;
}

   synkronisert live via refreshMatDagerOptions() (koblet til m1_dager sin
   oninput, se turdetaljerFields()) - uten å bygge om hele skjemaet, som ville
   mistet fokus i feltet brukeren faktisk skriver i. */
function matDagerOptionsHtml(maxDager, selected){

}
function refreshMatDagerOptions(){

/* v46: "Antall dager" var tidligere den eneste "masteren" og endret seg
   aldri automatisk. Nå er reisedatoene masteren når begge er satt: antall
   dager regnes ut inkludert BÅDE start- og sluttdato (10.-13. februar blir
   4 dager). computeDagerFraDatoer() parses datostrengene som UTC for å
   unngå av-en-dag-feil rundt sommertid/vintertid. Returnerer null (ikke et
   tall) når en av datoene mangler, er ugyldige, eller sluttdato er før
   startdato - da er "Antall dager" fortsatt et vanlig, redigerbart felt. */
function computeDagerFraDatoer(){
  const s = strVal('meta_start','');
  const e = strVal('meta_slutt','');
  if(!s || !e) return null;
  const sd = new Date(s+'T00:00:00Z');
  const ed = new Date(e+'T00:00:00Z');
  if(isNaN(sd.getTime()) || isNaN(ed.getTime())) return null;
  const diffDays = Math.round((ed.getTime() - sd.getTime()) / 86400000);
  if(diffDays < 0) return null;
  return diffDays + 1;
}
/* Kaller denne når datoene endres, og hver gang #m1_turdetaljer bygges om
   (buildModule1()) - slik at "Antall dager" og dens låste/åpne tilstand
   alltid stemmer med de faktiske datoverdiene som står i feltene akkurat nå. */
function syncDagerFraDatoer(){
  const dagerEl = el('m1_dager');
  if(!dagerEl) return;
  const hintEl = el('m1_dager_kilde_hint');
  const beregnet = computeDagerFraDatoer();
  if(beregnet !== null){
    dagerEl.value = beregnet;
    dagerEl.disabled = true;
    if(hintEl) hintEl.textContent = `Beregnet automatisk fra reisedato: ${beregnet} dager (inkl. start- og sluttdato).`;
  } else {
    dagerEl.disabled = false;
    if(hintEl) hintEl.textContent = 'Fylles ut automatisk når begge reisedatoer er valgt - kan også skrives inn manuelt.';
  }
  refreshMatDagerOptions();
}

/* v43: matplan-radioene på hvert hotell ("Ingen måltider" / "Inkludert
   frokost" / "Inkludert halvpensjon" / "Inkludert helpensjon") avgjør om de
   tilsvarende radene i Mat-kortet lenger nede kan skjules, siden måltidet da
   allerede er dekket av overnattingen. Med flere hotell i samme kalkyle (opp
   til 3, kun Modul 1) brukes en forsiktig "alle aktive hotell må dekke
   måltidet"-regel: hvis ett hotell IKKE dekker f.eks. lunsj, holdes
   Lunsj-raden synlig, slik at kostnaden for det hotellet fortsatt kan
   registreres. Merk (nevnt til Vidar, ikke bygget som egen logikk): valgt
   literal ordlyd fra ønsket betyr at "Inkludert halvpensjon" kun skjuler
   Frokost-raden (ikke Middag), selv om halvpensjon tradisjonelt også
   inkluderer middag - dette kan justeres senere om det viser seg upraktisk. */
const MATPLAN_DEKNING = {
  ingen:       {frokost:false, lunsj:false, middag:false},
  frokost:     {frokost:true,  lunsj:false, middag:false},
  halvpensjon: {frokost:true,  lunsj:false, middag:false},
  helpensjon:  {frokost:true,  lunsj:true,  middag:true},
};
function matPlanDekning(prefix, moduleKey){
  const count = (state[moduleKey] && state[moduleKey].hotelCount) || 0;
  const aktivePlaner = [];
  for(let i=1;i<=count;i++){
    const hp = `${prefix}hotel${i}_`;
    const netterEl = el(hp+'netter');
    if(!netterEl) continue;
    const netter = parseFloat(netterEl.value)||0;
    if(netter<=0) continue;
    aktivePlaner.push(matPlanValue(hp));
  }
  if(!aktivePlaner.length) return {frokost:false, lunsj:false, middag:false};
  return {
    frokost: aktivePlaner.every(plan=>MATPLAN_DEKNING[plan].frokost),
    lunsj: aktivePlaner.every(plan=>MATPLAN_DEKNING[plan].lunsj),
    middag: aktivePlaner.every(plan=>MATPLAN_DEKNING[plan].middag),
  };
}

/* =========================================================================
   === PURE START ===
   Rene beregningsfunksjoner – tar imot et vanlig JS-objekt (ingen DOM),
   returnerer et resultatobjekt. Testet separat med eksempeltall.
   ========================================================================= */

const ROOM_PERSONER = {enkelt:1, dobbel:2, trippel:3, fire:4};

/* v35: sensitivitetstall rundt anslått antall - helt intervall fra -20 til
   +20 (steg 1) i begge retninger, i stedet for det tidligere sparsomme
   utvalget (5 nærmeste + 3 grovere 5er-intervall videre ut). Eks. anslatt=40
   -> 20,21,22,...,39, 40, 41,42,...,59,60 (alle heltall, ikke bare hver 5.). */
function buildSensNumbers(anslatt){
  const nums = [];
  for(let i=-20;i<=20;i++) nums.push(anslatt+i);
  return nums.filter(n=>n>0);
}

function pureCalc1(p){
  // Rommodell Modul 1: antall rom per type (detaljert) eller kjapt anslag ut fra
  // standard romtype og hodetall, når romtall-feltene for et hotell står på 0.
  // v7/v9: kun betalende deltakere driver kjapt-anslaget for elevrommene.
  // Reiseledere (som fra v9 også dekker det som tidligere het lærerplasser)
  // mikses aldri med elevene i rom - de har egen enkeltrom-basert
  // oppholdskostnad, se rlFellesPerPerson under.
  // v24-fix: hotellene representerer etapper av SAMME reise (netter per hotell
  // summeres til "antall dager" minus 1, jf. rommodell-synken i v22/v23) - ikke
  // en samtidig oppdeling av gruppen på flere hotell. Kjapt anslag skal derfor
  // beregne romtallet ut fra HELE hodetallet ved hvert hotell (hele gruppen bor
  // der i de netter hotellet er satt til), ikke en brøkdel av deltakerne delt
  // mellom hotellene. (Tidligere ble hodetallet delt likt mellom hotell uten
  // detaljert rombestilling, noe som ga halvert - og feil - overnattingskostnad
  // per person så snart mer enn ett "kjapt anslag"-hotell var i bruk samtidig.)
  const totalHodetall = (p.anslatt||0);
  const hotelsWithNetter = p.hotels.filter(h=>h.netter>0);

  let sumNetter=0, totalRomkost=0, totalSengeplasser=0, oppholdEnkeltPerPerson=0, enkeltTilleggPerPerson=0;
  // v9: lærerplasser og reiseledere er slått sammen til én kombinert kategori
  // ("reiseledere"), som alltid bor på enkeltrom (se rlFellesPerPerson under).
  // Må hentes ut før hotell-løkken siden den nå også brukes i romMiks-tellingen.
  const antallReiseledere = p.antallReiseledere||0;
  // v17: samlet estimert rommiks (antall rom per romtype) på tvers av alle
  // hotell, brukt til den nye "Estimert rommiks"-boksen. Teller både rom fra
  // detaljert rombestilling og fra kjapt-anslag-grenen (tildeles hotellets
  // standard romtype), samt ett enkeltrom per reiseleder per hotell (v18-fix:
  // reiselederne sitt romforbruk manglet tidligere helt i rommiksen, selv om
  // kostnaden deres alltid har vært inkludert via oppholdEnkeltPerPerson).
  const romMiks = {enkelt:0, dobbel:0, trippel:0, fire:0};
  // v28: rommiksen spores nå også PER HOTELL (etappe), slik at "Estimert
  // rommiks"-boksen kan vise ett samlet oppsett når alle etappene har samme
  // rommiks, og bryte det ut per hotell når etappene faktisk er ulike - i
  // stedet for å alltid summere på tvers (som ga et misvisende "dobbelt så
  // mange rom"-inntrykk når samme gruppe bare bodde i samme romtype ved flere
  // etapper etter hverandre).
  const romMiksHotels = [];
  // v30: sengeplass-mismatch må sjekkes PER HOTELL (etappe), ikke ved å summere
  // sengeplasser på tvers av alle hotell. I etappe-modellen bor HELE gruppen ved
  // hvert hotell (bare i et annet antall netter), så riktig sammenligning er:
  // "har DETTE hotellets rombestilling nok sengeplasser til hele gruppen?" - ikke
  // "er summen av sengeplasser over alle etapper lik antall deltakere?" (den
  // summen vokser bare med antall hotell og gir ingen mening). Kjapt anslag-hotell
  // er alltid selvregnende korrekt (rundes opp til nok rom for hele gruppen) og
  // holdes derfor utenfor selve mismatch-sjekken - kun hotell med presis
  // rombestilling sjekkes.
  //
  // v34: Vidar presiserte at han IKKE ønsker at reiseledernes rom skal legges
  // til automatisk når han spesifiserer romantallet selv ("Presis rombestilling")
  // - da skal rommiks-visningen vise NØYAKTIG de rommene som er skrevet inn, og
  // varselet skal heller slå ut dersom summen ikke stemmer med antall deltakere
  // OG reiseledere til sammen, slik at brukeren selv kan legge til rom for
  // reiselederne om nødvendig. Det automatiske enkeltrom-tillegget per
  // reiseleder gjelder derfor nå KUN "kjapt anslag"-grenen (der romtallet uansett
  // beregnes helautomatisk), ikke "Presis rombestilling"-grenen.
  const totalReisendeForRomsjekk = totalHodetall + antallReiseledere;
  const bedsMismatchHotels = [];
  p.hotels.forEach(h=>{
    if(!h.netter) return;
    sumNetter += h.netter;
    const hotelMiks = {enkelt:0, dobbel:0, trippel:0, fire:0};
    const hasDetail = ['enkelt','dobbel','trippel','fire'].some(t=>(h.antall&&h.antall[t])>0);
    // Sengeplasser fra selve rombestillingen (eksplisitt oppgitt av brukeren i
    // "Presis rombestilling") - ingen automatisk tillegg her (v34), slik at det
    // som vises og det som sjekkes er nøyaktig det samme som brukeren har
    // skrevet inn.
    let hotelSengeplasserDetail = 0;
    if(hasDetail){
      ['enkelt','dobbel','trippel','fire'].forEach(t=>{
        const antallRom = (h.antall && h.antall[t]) || 0;
        if(!antallRom) return;
        totalRomkost += antallRom * h.pris[t] * h.netter;
        totalSengeplasser += antallRom * ROOM_PERSONER[t];
        hotelSengeplasserDetail += antallRom * ROOM_PERSONER[t];
        romMiks[t] += antallRom;
        hotelMiks[t] += antallRom;
      });
    } else {
      // Kjapt anslag: helautomatisk anslag, inkluderer fortsatt ett enkeltrom
      // per reiseleder (v18/v34) siden brukeren ikke spesifiserer noe selv her.
      romMiks.enkelt += antallReiseledere;
      hotelMiks.enkelt += antallReiseledere;
      const stdType = h.standard || 'dobbel';
      const rooms = totalHodetall>0 ? Math.ceil(totalHodetall / ROOM_PERSONER[stdType]) : 0;
      totalRomkost += rooms * h.pris[stdType] * h.netter;
      totalSengeplasser += rooms * ROOM_PERSONER[stdType];
      romMiks[stdType] += rooms;
      hotelMiks[stdType] += rooms;
    }
    if(hasDetail && totalReisendeForRomsjekk>0 && hotelSengeplasserDetail!==totalReisendeForRomsjekk){
      bedsMismatchHotels.push({idx: h._idx+1, sengeplasser: hotelSengeplasserDetail});
    }
    romMiksHotels.push({idx: h._idx+1, miks: hotelMiks});
    oppholdEnkeltPerPerson += h.pris.enkelt * h.netter;
    // v10: enkeltromstillegg - kun til informasjon (hva det koster ekstra å
    // booke enkeltrom fremfor å dele dobbeltrom). Hvis ingen egen enkeltrompris
    // er oppgitt, er h.pris.enkelt allerede satt lik dobbeltromprisen av
    // gatherHotel, så denne ene personen da betaler full dobbeltromspris -
    // tillegget blir dermed automatisk dobbeltromspris/2, uten spesialtilfelle.
    enkeltTilleggPerPerson += (h.pris.enkelt - h.pris.dobbel/2) * h.netter;
  });
  const nightMismatch = p.netterFraDato>0 && sumNetter>0 && sumNetter!==p.netterFraDato;

  // v35: hvert måltid ganges nå med sitt EGET antall dager (matFrokostDager
  // osv.), ikke lenger automatisk med hele reiselengden - se matCard/
  // gatherModule1 for feltene og bakoverkompatibilitet for eldre kalkyler.
  const matPerPerson = p.matFrokost*(p.matFrokostDager||0) + p.matLunsj*(p.matLunsjDager||0) + p.matMiddag*(p.matMiddagDager||0) + p.matEkstra;
  const aktivitetSum = p.aktiviteter.reduce((s,a)=>s+(a.belop||0),0);
  const andreFasteSum = p.andreFasteKostnader.reduce((s,a)=>s+(a.belop||0),0);
  const transportSum = p.transport.reduce((s,a)=>s+(a.belop||0),0);

  const Kvar = p.fly + matPerPerson + aktivitetSum; // overnatting ligger nå i faste kostnader

  // v9: lærerplasser og reiseledere er slått sammen til én kombinert kategori
  // ("reiseledere") med samme delte fly+mat+aktiviteter+opphold-sats, men med
  // individuelt honorar og andre kostnader per reiseleder.
  // (antallReiseledere er hentet ut lenger opp, før hotell-løkken.)
  const rlFellesPerPerson = p.fly + matPerPerson + aktivitetSum + oppholdEnkeltPerPerson;
  // Den delte satsen (fly/mat/aktiviteter/opphold) skalerer med hele antallet,
  // også utover MAX_REISELEDERE-taket for individuelle honorar-felt. Honorar/
  // andre kostnader legges til kun for de reiselederne som faktisk har felt.
  let totalRLKostnad = rlFellesPerPerson * antallReiseledere;
  (p.reiseledere||[]).forEach(rl=>{
    totalRLKostnad += (rl.honorarDag||0)*p.dager + (rl.andre||0) + (rl.kjoregodtgjorelse||0) + (rl.parkering||0);
  });

  const Kfast = transportSum + andreFasteSum + totalRomkost + totalRLKostnad;

  const anslatt = p.anslatt;
  const anslattSafe = anslatt>0 ? anslatt : null;
  const DBmaal = p.dbPerPerson;
  const prisOpprinnelig = anslatt>0 ? (Kfast/anslatt)+Kvar+DBmaal : null;

  // v21: Kundepris (den faktiske, overstyrbare salgsprisen) er nå utgangspunktet
  // for fortjeneste, kostnadsdetaljer og sensitivitet - ikke lenger den rene
  // kalkyleprisen (prisOpprinnelig). Faller tilbake til beregnet pris per
  // deltaker (avrundet) hvis Kundepris-feltet er tomt/nullstilt.
  const kundeprisRaw = p.kundepris;
  const kundepris = (kundeprisRaw!==null && kundeprisRaw!==undefined && !isNaN(kundeprisRaw))
    ? kundeprisRaw
    : (prisOpprinnelig!==null ? Math.round(prisOpprinnelig) : null);
  const kostPerPersonBase = anslattSafe ? (Kfast/anslattSafe)+Kvar : null;
  const totalOms = (kundepris!==null && anslattSafe) ? kundepris*anslattSafe : null;
  const dbPerson = (kundepris!==null && kostPerPersonBase!==null) ? kundepris-kostPerPersonBase : null;
  const dbTotalt = (dbPerson!==null && anslattSafe) ? dbPerson*anslattSafe : null;
  const dbPct = (dbPerson!==null && kundepris) ? dbPerson/kundepris*100 : null;

  // v13/v21: sensitiviteten viser, for hvert antall betalende (N), hva som skjer
  // DERSOM kundeprisen holdes fast: justert fortjeneste per person, total endret
  // fortjeneste sammenlignet med dagens situasjon (anslatt antall, til kundepris),
  // og hvilken ny pris som ville opprettholdt dagens fortjeneste per person ved
  // dette antallet.
  const sensNumbers = anslatt>0 ? buildSensNumbers(anslatt) : [];
  const sensRows=[];
  if(anslatt>0 && kundepris!==null){
    sensNumbers.forEach(N=>{
      if(N<=0) return;
      const kostPerPerson=(Kfast/N)+Kvar;
      const db=kundepris-kostPerPerson; // justert fortjeneste per person, ved fast kundepris
      const totalEndring = db*N - (dbTotalt||0); // endring i total fortjeneste vs. dagens situasjon
      const anbefaltPris=kostPerPerson+(dbPerson||0); // pris som opprettholder dagens fortjeneste per person
      sensRows.push({N,db,totalEndring,anbefaltPris,isBase:N===anslatt});
    });
  }

  // v21: minimum antall betalende for at Kundeprisen (holdt fast) dekker alle
  // kostnader (fortjeneste >= 0). Samme modell som sensitivitetsberegningen over,
  // løst for N ved db=0. Udefinert hvis kundeprisen ikke engang dekker den
  // variable kostnaden per person - da hjelper ikke flere deltakere.
  let breakEven = null;
  if(kundepris!==null && kundepris>Kvar){
    breakEven = Kfast>0 ? Math.max(1, Math.ceil(Kfast/(kundepris-Kvar))) : 1;
  }

  // v30: bedsMismatch bygger på bedsMismatchHotels (per-hotell-sjekk regnet ut
  // i løkken over), ikke en sum av sengeplasser over alle etapper.
  // v34: sjekken (og varselteksten) sammenlignes igjen mot antall deltakere OG
  // reiseledere til sammen (`totalReisende`) for hotell med "Presis
  // rombestilling" - brukeren spesifiserer nå NØYAKTIG de rommene som trengs
  // selv (ingen automatisk reiseleder-tillegg), og skal derfor selv sørge for
  // at rom for reiseledere er inkludert der det er ønskelig. Se kommentar ved
  // bedsMismatchHotels for full begrunnelse.
  const totalReisende = anslatt + antallReiseledere;
  const bedsMismatch = bedsMismatchHotels.length>0;
  const bedsMismatchMultiHotel = hotelsWithNetter.length>1;
  const bedsMismatchText = !bedsMismatch ? '' : (
    bedsMismatchMultiHotel
      ? `Obs: Antall sengeplasser stemmer ikke med antall deltakere og reiseledere (${totalReisende}). ${bedsMismatchHotels.map(m=>`Hotell ${m.idx}: ${m.sengeplasser} sengeplasser`).join(', ')}.`
      : `Obs: Antall sengeplasser (${bedsMismatchHotels[0].sengeplasser}) stemmer ikke med antall deltakere og reiseledere (${totalReisende}).`
  );

  const perPerson = anslattSafe ? {
    rom: totalRomkost/anslattSafe,
    transport: transportSum/anslattSafe,
    andreFaste: andreFasteSum/anslattSafe,
    reiseleder: totalRLKostnad/anslattSafe,
    fly: p.fly,
    mat: matPerPerson,
    aktiviteter: aktivitetSum,
    dekningsbidrag: dbPerson||0
  } : null;
  const totalt = anslattSafe ? {
    rom: totalRomkost,
    transport: transportSum,
    andreFaste: andreFasteSum,
    reiseleder: totalRLKostnad,
    fly: p.fly*anslattSafe,
    mat: matPerPerson*anslattSafe,
    aktiviteter: aktivitetSum*anslattSafe,
    dekningsbidrag: dbTotalt||0
  } : null;
  const totalInntekt = (anslattSafe && prisOpprinnelig!==null) ? prisOpprinnelig*anslattSafe : null;
  const dbBlock = (anslattSafe && prisOpprinnelig!==null) ? {
    perPersonKr: DBmaal,
    totaltKr: DBmaal*anslattSafe,
    perPersonPct: prisOpprinnelig ? (DBmaal/prisOpprinnelig*100) : null,
    totaltPct: totalInntekt ? ((DBmaal*anslattSafe)/totalInntekt*100) : null
  } : null;

  return {
    sumNetter, nightMismatch, totalRomkost, totalSengeplasser, totalReisende, bedsMismatch, bedsMismatchText,
    Kvar, Kfast, andreFasteSum, transportSum, aktivitetSum, matPerPerson, totalRLKostnad,
    oppholdEnkeltPerPerson, enkeltTilleggPerPerson, anslatt, DBmaal, prisOpprinnelig, sensRows,
    perPerson, totalt, dbBlock, totalInntekt, romMiks, romMiksHotels,
    kundepris, totalOms, dbPerson, dbTotalt, dbPct, breakEven
  };
}

/* ---------- DOM-innsamling → params ---------- */

function gatherHotel(prefix, idx, moduleKey, isM1){
  const hp = `${prefix}hotel${idx}_`;
  const netter = num(hp+'netter',0)||0;
  const hotel = {netter, pris:{}, standard: strVal(hp+'standard','dobbel')};
  ['enkelt','dobbel','trippel','fire'].forEach(t=>{
    hotel.pris[t] = moneyValue(prefix, `hotel${idx}_${t}_pris`, moduleKey);
  });
  // v: Forslag-integrasjon (bygHotellopphold) trenger å vite hvilke romtyper
  // som FAKTISK har en eksplisitt pris satt av brukeren, for å kunne
  // automatisk huke av "Andre romtyper" der. Må fanges FØR
  // enkeltrom-fallbacken rett under (som ellers ville gjort at enkeltrom
  // alltid så ut som priset, siden den arver dobbeltromprisen).
  hotel.prisSatt = {
    enkelt: hotel.pris.enkelt>0, dobbel: hotel.pris.dobbel>0,
    trippel: hotel.pris.trippel>0, fire: hotel.pris.fire>0,
  };
  // Enkeltrom skjules bak "Andre romtyper" som standard - hvis ingen egen
  // enkeltrompris er fylt inn, bruk dobbeltromprisen som utgangspunkt.
  if(!(hotel.pris.enkelt>0)) hotel.pris.enkelt = hotel.pris.dobbel;
  if(isM1){
    hotel.antall = {};
    ['enkelt','dobbel','trippel','fire'].forEach(t=>{
      hotel.antall[t] = num(hp+t+'_antall',0)||0;
    });
    // Forslag-integrasjon (additivt - brukes ikke av pureCalc1/prisberegningen,
    // kun av "Opprett forslag fra kalkyle"). v42: "sted" er fjernet (feltet
    // finnes ikke lenger i skjemaet), h.sted er derfor alltid tomt - beholdt
    // som felt (ikke fjernet fra objektet) siden bygHotellopphold()/
    // bygInkludertFraKalkyle() fortsatt leser det trygt med fallback. v43:
    // enkelt-avkrysningen "frokostInkludert" er erstattet med "matPlan" (en
    // av 'ingen'/'frokost'/'halvpensjon'/'helpensjon'), se matPlanValue().
    hotel.navn = strVal(hp+'navn','');
    hotel.sted = '';
    hotel.matPlan = matPlanValue(hp);
  }
  return hotel;
}

function gatherHotels(prefix, moduleKey, count, isM1){
  const hotels=[];
  for(let i=1;i<=count;i++){
    const h = gatherHotel(prefix,i,moduleKey,isM1);
    h._idx = i-1;
    hotels.push(h);
  }
  return hotels;
}

/* Antall netter foreslås automatisk som dager-1 på hvert hotellkort, men er et
   redigerbart felt. Vi husker hvilke hotellkort brukeren selv har endret
   netter-feltet på ("touched"), og synker kun de resterende (untouched)
   feltene.

   v22-fiks (rettet igjen v23, se merknad under): samlet antall hotellnetter
   (på tvers av flere hotell) skal stemme med "antall dager" minus 1.

   v23: "Antall dager" er den eneste "masteren" - den endres ALDRI automatisk.
   Det er hotellenes netter-felt som justeres for å stemme med dager-1: det
   FØRSTE (laveste indeks) hotellet som ikke er manuelt overstyrt ("touched")
   får resten av nettene, ETTER at nettene til ev. touched hotell er trukket
   fra. Eksempel: 6 dager gir Hotell 1 = 5 netter automatisk. Aktiverer man
   Hotell 2 og skriver inn 2 netter der manuelt, reduseres Hotell 1
   automatisk til 3 (5-2), slik at summen (3+2=5) fortsatt stemmer med
   dager-1. Legger man også til Hotell 3 med f.eks. 1 natt, trekkes dette
   også fra Hotell 1 først (nå 2), og ville deretter (hvis Hotell 1 reduseres
   helt ned til 0 og det fortsatt er mer å trekke fra) gått videre til Hotell 2 -
   men siden Hotell 2 her er manuelt satt (touched), er det uansett låst og
   IKKE noe man trekker fra automatisk; det er alltid det nærmeste UNTOUCHED
   hotellet (i indeksrekkefølge fra 1) som er "bufferen". Ev. andre untouched
   hotell (typisk et nylig lagt-til hotell man ikke har rukket å fylle inn
   ennå) røres ikke - de starter på 0 helt til brukeren selv skriver inn noe
   der (som da gjør DEM touched).

   v26: i stedet for å la summen av manuelt satte hotellnetter overstige
   dager-1 (og deretter vise en advarsel, mens bufferhotellet klippes til 0),
   klipper vi nå INPUTEN selv når brukeren skriver inn et tall: et hotells
   netter-felt kan aldri settes høyere enn det som er igjen av "dager-1" etter
   at de ANDRE manuelt satte hotellenes nåværende netter er trukket fra. Vil
   man ha flere netter enn dette tillater, må man først øke "Antall dager". */
const touchedNetter = { m1:{} };
function markNetterTouched(moduleKey, idx){ touchedNetter[moduleKey][String(idx)] = true; }
function clampNetterInput(moduleKey, prefix, idx, netterFraDato){
  const tn = touchedNetter[moduleKey];
  const count = state[moduleKey].hotelCount;
  let othersTouchedSum = 0;
  for(let i=1;i<=count;i++){
    if(i===idx) continue;
    if(tn[String(i)]){
      const fld = el(`${prefix}hotel${i}_netter`);
      othersTouchedSum += fld ? (parseInt(fld.value,10)||0) : 0;
    }
  }
  const maxAllowed = Math.max(0, netterFraDato - othersTouchedSum);
  const fld = el(`${prefix}hotel${idx}_netter`);
  if(fld){
    const v = parseInt(fld.value,10)||0;
    if(v>maxAllowed) fld.value = maxAllowed;
  }
}
function onHotelNetterInput(moduleKey, idx){
  const prefix = moduleKey+'_';
  const dager = num(prefix+'dager',0)||0;
  const netterFraDato = dager>0 ? dager-1 : 0;
  clampNetterInput(moduleKey, prefix, idx, netterFraDato);
  markNetterTouched(moduleKey, idx);
  recalcAll();
}
function syncAutoNetter(moduleKey, prefix, count, netterFraDato){
  const tn = touchedNetter[moduleKey];
  let touchedSum = 0;
  let primaryIdx = null;
  for(let i=1;i<=count;i++){
    if(tn[String(i)]){
      const fld = el(`${prefix}hotel${i}_netter`);
      touchedSum += fld ? (parseInt(fld.value,10)||0) : 0;
    } else if(primaryIdx===null){
      primaryIdx = i; // det første (laveste indeks) untouched hotellet
    }
  }
  if(primaryIdx===null) return; // ingen untouched hotell å synke mot
  const remaining = Math.max(0, netterFraDato - touchedSum);
  const fld = el(`${prefix}hotel${primaryIdx}_netter`);
  if(fld && document.activeElement!==fld) fld.value = remaining;
}

function gatherModule1(){
  const p='m1_';
  const dager = num(p+'dager',0)||0;
  const netterFraDato = dager>0 ? dager-1 : 0;
  syncAutoNetter('m1', p, state.m1.hotelCount, netterFraDato);
  const hotels = gatherHotels(p, 'm1', state.m1.hotelCount, true);
  const flyItems = gatherList(p,'fly', state.m1.flyCount, 'm1');
  const fly = flyItems.reduce((s,a)=>s+(a.belop||0),0);
  return {
    dager, netterFraDato, hotels,
    fly,
    // Forslag-integrasjon (additivt): de enkelte fly-linjene ble tidligere
    // kastet etter at summen (fly, over) var beregnet. De bevares nå også
    // her, uendret i format, kun til bruk i "Opprett forslag fra kalkyle" -
    // pureCalc1 leser fortsatt kun p.fly (summen), ikke p.flyItems.
    flyItems,
    matFrokost: moneyValue(p,'mat_frokost','m1'), matLunsj: moneyValue(p,'mat_lunsj','m1'),
    matMiddag: moneyValue(p,'mat_middag','m1'), matEkstra: moneyValue(p,'mat_ekstra','m1'),
    // v35: "Antall dager" per måltid, klippet til [0, dager] slik at man ikke
    // kan angi flere måltider enn reisen faktisk har dager.
    matFrokostDager: Math.max(0, Math.min(num(p+'mat_frokost_dager',0)||0, dager)),
    matLunsjDager: Math.max(0, Math.min(num(p+'mat_lunsj_dager',0)||0, dager)),
    matMiddagDager: Math.max(0, Math.min(num(p+'mat_middag_dager',0)||0, dager)),
    aktiviteter: gatherList(p,'akt', state.m1.aktCount, 'm1'),
    transport: gatherList(p,'transport', state.m1.transportCount, 'm1'),
    andreFasteKostnader: gatherList(p,'fast', state.m1.fastCount, 'm1'),
    antallReiseledere: num(p+'rl_antall',0)||0,
    reiseledere: gatherReiseledere(p,'m1', num(p+'rl_antall',0)||0),
    anslatt: num(p+'anslatt',0)||0,
    dbPerPerson: num(p+'db_per_person',0)||0,
    kundepris: state.m1.kundepris
  };
}

/* v9: individuelt honorar og andre kostnader per reiseleder (kun de N første
   basert på antallReiseledere, opp til MAX_REISELEDERE feltpar i skjemaet). */
function gatherReiseledere(prefix, moduleKey, antallReiseledere){
  const list = [];
  const n = Math.min(antallReiseledere||0, MAX_REISELEDERE);
  for(let i=1;i<=n;i++){
    list.push({
      honorarDag: moneyValue(prefix, `rl_honorar_${i}`, moduleKey),
      andre: moneyValue(prefix, `rl_andre_${i}`, moduleKey),
      kjoregodtgjorelse: moneyValue(prefix, `rl_kjoregodtgjorelse_${i}`, moduleKey),
      parkering: moneyValue(prefix, `rl_parkering_${i}`, moduleKey)
    });
  }
  return list;
}

/* ---------- Enkel SVG-graf ---------- */
function svgBarChart(rows, opts){
  const w=560, h=opts.height||190, padL=44, padB=28, padT=10, padR=10;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const vals = rows.map(r=>r.value);
  let min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  if(min===max){ min-=1; max+=1; }
  const range = max-min;
  const zeroY = padT + innerH - ((0-min)/range)*innerH;
  const bw = innerW/rows.length*0.6;
  const gap = innerW/rows.length;

  let bars='', labels='';
  rows.forEach((r,i)=>{
    const x = padL + i*gap + (gap-bw)/2;
    const valY = padT + innerH - ((r.value-min)/range)*innerH;
    const y = Math.min(valY, zeroY);
    const barH = Math.max(1, Math.abs(valY-zeroY));
    const color = opts.color ? opts.color(r) : 'var(--blue)';
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"></rect>`;
    const labelY = valY < zeroY ? valY-6 : valY+14;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="10" text-anchor="middle" fill="var(--ink-2)">${opts.format?opts.format(r.value):r.value}</text>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--ink-muted)">${r.label}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--baseline)" stroke-width="1"></line>
    ${bars}${labels}
  </svg>`;
}

function costPieChart(categories){
  const nonZero = categories.filter(c=>(c.value||0)>0);
  const total = nonZero.reduce((s,c)=>s+c.value,0);
  if(total<=0) return '<div class="hint">Ingen kostnader å vise ennå.</div>';
  let acc = 0;
  const stops = nonZero.map(c=>{
    const pctOf = c.value/total*100;
    const from = acc; acc += pctOf;
    return `${c.color} ${from.toFixed(2)}% ${acc.toFixed(2)}%`;
  }).join(', ');
  const legend = nonZero.map(c=>{
    const pctOf = c.value/total*100;
    return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-bottom:3px;">
      <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c.color};flex:0 0 auto;"></span>
      <span style="flex:1;">${c.label}</span>
      <span style="font-variant-numeric:tabular-nums;color:var(--ink);">${pctOf.toFixed(0)}%</span>
    </div>`;
  }).join('');
  return `
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
      <div style="width:104px;height:104px;border-radius:50%;flex:0 0 auto;background:conic-gradient(${stops});"></div>
      <div style="flex:1;min-width:170px;">${legend}</div>
    </div>`;
}

/* ---------- Sensitivitet: glidebryter i stedet for søylediagram ---------- */
/* v24: to rader med 3 bokser hver.
   v35: "Total endring" (tidligere "Total endret fortjeneste") og "Total
   justert fortjeneste" har byttet plass - rad 1: antall betalende, justert
   fortjeneste, total justert fortjeneste (= db*N, dvs. resulterende total
   fortjeneste). Rad 2: total endring (delta vs. dagens situasjon), anbefalt
   ny pris, minimum antall betalende (break-even) sist. */
function sensReadoutHtml(row, breakEven){
  if(!row) return '';
  const totalJustert = row.db*row.N;
  return `
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat-tile hero">
        <div class="label">Antall betalende</div>
        <div class="value">${row.N}</div>
      </div>
      <div class="stat-tile">

function updateSensDisplay(moduleKey){

  const lastRes = window._lastRes && window._lastRes[moduleKey];
  const breakEven = lastRes ? lastRes.breakEven : null;

/* ---------- Kundepris: overstyrbar salgspris i "Kundepris"-boksen ---------- */
/* v14: brukeren kan skrive inn sin egen kundepris (standard = beregnet "Pris
   per betalende"). v21: Kundepris påvirker nå også kakediagrammet, "Kostnads-
   detaljer" og hele sensitivitetskortet (ikke bare Kundepris-/Fortjeneste-
   boksene), så vi må kjøre en full recalcAll() for å holde alt synkront -
   ikke bare et direkte DOM-patch av noen få tall som før. For å unngå at
   inputfeltet mister fokus/markørposisjon midt i den fulle re-renderingen,
   husker vi markørposisjonen og gjenoppretter den rett etterpå. Fritekstfelt
   (ikke type=number), så det ikke får nettleserens opp/ned-justeringspiler. */
function updateKundepris(moduleKey, val){
  const v = parseFloat(String(val).replace(',','.'));
  state[moduleKey].kundepris = (val==='' || isNaN(v)) ? null : v;
  const inputId = moduleKey+'_kundepris';
  const input = el(inputId);
  const selStart = input ? input.selectionStart : null;
  const selEnd = input ? input.selectionEnd : null;
  recalcAll();
  const newInput = el(inputId);
  if(newInput && selStart!==null){
    newInput.focus();
    try{ newInput.setSelectionRange(selStart, selEnd); }catch(e){}
  }
}
window._lastRes = {};

/* v28: "Estimert rommiks" viser ett samlet romoppsett hvis alle hotell/etapper
   har nøyaktig samme rommiks (siden det da representerer den samme gruppens
   faste romfordeling gjennom hele reisen, ikke noe som skal telles opp per
   etappe) - og bryter det ut per hotell («Hotell 1 -> ...», «Hotell 2 -> ...»)
   kun når etappene faktisk har ulik rommiks. */
function roomMiksBoxHtml(romMiksHotels){
  const hotels = romMiksHotels || [];
  if(!hotels.length) return `<div class="hint">Ingen rom beregnet ennå – fyll inn overnatting.</div>`;
  const sameAsFirst = h => ROOM_TYPES.every(rt => (h.miks[rt.key]||0) === (hotels[0].miks[rt.key]||0));
  const allSame = hotels.every(sameAsFirst);
  const roomRows = miks => {
    const entries = ROOM_TYPES.filter(rt => (miks[rt.key]||0) > 0);
    if(!entries.length) return `<div class="hint">Ingen rom beregnet ennå.</div>`;
    return `<table><tbody>${entries.map(rt => `<tr><td>${rt.label}</td><td>${miks[rt.key]}</td></tr>`).join('')}</tbody></table>`;
  };
  if(allSame) return roomRows(hotels[0].miks);
  return hotels.map(h => `
    <div style="margin-bottom:8px;">
      <div style="font-weight:600;font-size:13px;margin-bottom:4px;">Hotell ${h.idx}</div>
      ${roomRows(h.miks)}
    </div>`).join('');
}

function renderModule1(res, raw){

  el(p+'rl_sum_auto').textContent = kr(rlSum);

  let html='';

  if(res.anslatt<=0){
    html += `<div class="warning-box">Fyll inn anslått antall deltakere for å beregne pris.</div>`;
  }
  // v24: bedsMismatch-varselet er flyttet inn i "Estimert rommiks"-boksen
  // selv (se der), i stedet for å vises øverst på siden.

  // v13/v14: "Pris per deltaker" er kortet ned til kun den beregnede prisen.
  // Kundepris (som brukeren kan overstyre) og alt som avhenger av den

  // v20: "Minimum antall betalende" (break-even) fjernet igjen etter ønske
  // fra Vidar (var Claudes eget forslag i v17, ikke noe Vidar hadde bedt om).

  </div>`;

  window._lastRes = window._lastRes || {};

  html += `<div class="card">
    <div class="card-title">Kundepris per deltaker</div>

          oninput="updateKundepris('m1', this.value)">
      </div>
      <div class="stat-tile">
        <div class="label">Total omsetning</div>

      </div>
    </div>
  </div>`;

  html += `<div class="card">
    <div class="card-title">Fortjeneste</div>
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Fortjeneste per person</div>

        <div class="value" id="m1_db_pct">${res.dbPct!==null ? pct(res.dbPct) : '–'}</div>

  // v17: rommiks-estimat og enkeltromstillegg side om side, over sensitiviteten.

  // dersom sengeplasser ikke stemmer med antall deltakere + reiseledere,

  el('m1_results').innerHTML = html;

/* ---------- Recalc ---------- */
function recalcAll(){
  try{
    // v43: må kjøres FØR gatherModule1(), slik at ev. nullstilling av
    // skjulte mat-rader (se refreshMatSkjulteRader()) rekker å slå inn i
    // samme beregningsrunde, i stedet for å henge igjen til neste oninput.
    refreshMatSkjulteRader();
    const raw1 = gatherModule1();
    const res1 = pureCalc1(raw1);
    renderModule1(res1, raw1);
  }catch(e){ console.error('Modul 1 feil:',e); }
  // v38: recalcAll() kalles allerede fra oninput på så godt som hvert eneste
  // felt i kalkylemotoren over (uendret) - gjenbruker akkurat det
  // koblingspunktet til å utsette en autolagring, se scheduleAutosave()
  // (definert i skriptblokken under). typeof-sjekken er nødvendig fordi
  // motoren over kaller recalcAll() én gang synkront ved sideinnlasting,
  // FØR den andre skriptblokken (der scheduleAutosave hører hjemme) har
  // rukket å kjøre.
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

/* ---------- Init ---------- */
buildModule1();
recalcAll();

<script>

   LAGRING MOT SUPABASE (Caminante Admin)

// v9 (forslag-integrasjon): id-en til et allerede opprettet Forslag koblet

function serializeCalculator(){
  // v1 Forslag-integrasjon: fanger opp enkeltromstillegget kalkulatoren allerede
  // regner ut til visning (pureCalc1/gatherModule1, begge uendret fra motoren
  // over), slik at det kan gjenbrukes av Forslag uten at Forslag regner ut noe
  // selv. Ingenting i selve kalkulator-motoren er endret av dette.
  // v38: fanger i tillegg opp antall deltakere, EFFEKTIV kundepris (den som
  // faktisk vises/brukes - kan avvike fra state.m1.kundepris, som er kun det
  // manuelle overstyringsfeltet og kan være tom/null), total omsetning og
  // total fortjeneste. Brukes KUN til å vise disse i kalkyleoversikten uten å
  // måtte kjøre pureCalc1 på nytt for hver rad der. Viktig: lagres under EGNE
  // navn (kundeprisVisning osv.), ikke som "kundepris" - det navnet er
  // allerede i bruk i state.m1 for det manuelle overstyringsfeltet, og å
  // overskrive det ville stille ha endret kalkylens prismodus ved neste åpning.
  let enkeltTilleggPerPerson = null, kundeprisVisning = null, totalOmsVisning = null, dbTotaltVisning = null, anslattVisning = null;
  try{
    const gm1 = gatherModule1();
    const res1 = pureCalc1(gm1);
    enkeltTilleggPerPerson = res1.enkeltTilleggPerPerson;
    kundeprisVisning = res1.kundepris;
    totalOmsVisning = res1.totalOms;
    dbTotaltVisning = res1.dbTotalt;
    anslattVisning = gm1.anslatt;
  } catch(e){ console.error('Kunne ikke beregne oppsummeringstall for lagring:', e); }
  return {
    counts: { ...JSON.parse(JSON.stringify(state.m1)), enkeltTilleggPerPerson, kundeprisVisning, totalOmsVisning, dbTotaltVisning, anslattVisning },
    touchedNetter: JSON.parse(JSON.stringify(touchedNetter.m1)),
    values: snapshotModuleAll('m1'),
  };
}

function loadCalculatorData(data){
  const counts = (data && data.counts) ? data.counts : {...DEFAULT_COUNTS, valutaer:['EUR'], sensIndex:null, kundepris:null};
  state.m1 = { ...counts, valutaer: [...(counts.valutaer||['EUR'])] };
  touchedNetter.m1 = { ...((data && data.touchedNetter) || {}) };
  buildModule1(false);
  const vals = (data && data.values) || {};
  restoreModuleAll('m1', vals);
  // v35 bakoverkompatibilitet: "Antall dager per måltid" fantes ikke da eldre
  // kalkyler ble lagret, og feltets nye HTML-standard er 0. Uten denne
  // backfillen ville matkostnaden stille bli 0 kr for enhver tidligere lagret
  // kalkyle som åpnes på nytt. Vi fyller derfor inn hele reiselengden (samme
  // sum som den gamle, implisitte "hver dag"-beregningen ga) for de tre
  // måltidsfeltene, men KUN når feltet faktisk mangler i den lagrede
  // snapshotten - er det først lagret (også som bevisst 0), respekteres det.
  const dagerVal = num('m1_dager',0)||0;
  ['m1_mat_frokost_dager','m1_mat_lunsj_dager','m1_mat_middag_dager'].forEach(id=>{
    if(!Object.prototype.hasOwnProperty.call(vals, id)){
      const fld = el(id);
      if(fld) fld.value = dagerVal;
    }
  });
  recalcAll();
}
