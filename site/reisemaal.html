<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reisemål – Caminante Admin</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    padding:14px 24px;
    background:var(--surface-1);
    border-bottom:1px solid var(--hairline);
    position:sticky;
    top:0;
    z-index:5;
  }
  .toolbar input[type="search"]{
    flex:1 1 200px;
    min-width:160px;
    padding:7px 10px;
    border:1px solid var(--hairline);
    border-radius:8px;
    font-size:13px;
    background:var(--surface-1);
    color:var(--ink-primary);
  }
  .toolbar select{
    padding:7px 8px;
    border:1px solid var(--hairline);
    border-radius:8px;
    font-size:13px;
    background:var(--surface-1);
    color:var(--ink-primary);
  }
  .toolbar button.reset, .toolbar button.action{
    padding:7px 12px;
    border:1px solid var(--hairline);
    border-radius:8px;
    font-size:13px;
    background:var(--surface-1);
    color:var(--ink-secondary);
    cursor:pointer;
  }
  .toolbar button.action.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .toolbar button:hover{ background:var(--page); }
  .toolbar button.action.primary:hover{ background:#123d75; }
  .count-pill{
    font-size:12.5px;
    color:var(--ink-muted);
    margin-left:auto;
    padding-left:8px;
  }
  .main{
    padding:16px 24px 32px;
  }
  .list-panel{
    background:var(--surface-1);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:14px;
    overflow-x:auto;
  }
  .list-panel h2{
    font-size:13px;
    font-weight:650;
    margin:0 0 10px;
    color:var(--ink-secondary);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left;
    font-weight:600;
    color:var(--ink-secondary);
    padding:8px 8px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{ color:var(--ink-primary); }
  thead th .arrow{ font-size:10px; color:var(--ink-muted); margin-left:3px; }
  tbody td{ padding:8px 8px; border-bottom:1px solid var(--hairline); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--page); }
  tbody tr.selected{ background:#eaf1fb; }
  .rm-name{ font-weight:600; }
  .rm-sub{ font-size:11.5px; color:var(--ink-muted); }
  .rm-flag{ width:20px; height:14px; object-fit:cover; border-radius:2px; vertical-align:middle; margin-right:6px; border:1px solid var(--hairline); }

  .overlay-bg{ position:fixed; inset:0; background:rgba(11,11,11,0.30); display:none; z-index:20; }
  .overlay-bg.open{ display:block; }
  .profile-panel{
    position:fixed;
    top:0; right:0; bottom:0;
    width:min(520px, 100%);
    background:var(--surface-1);
    box-shadow:-8px 0 24px rgba(0,0,0,0.15);
    transform:translateX(100%);
    transition:transform 0.18s ease;
    overflow-y:auto;
    z-index:21;
    padding:20px 22px 60px;
  }
  .profile-panel.open{ transform:translateX(0); }
  .profile-close{
    position:absolute; top:16px; right:18px;
    border:none; background:none;
    font-size:20px; cursor:pointer;
    color:var(--ink-muted); line-height:1;
  }
  .profile-close:hover{ color:var(--ink-primary); }
  .profile-header{ margin-bottom:6px; padding-right:30px; display:flex; align-items:center; gap:10px; }
  .profile-header img.rm-flag-lg{ width:32px; height:22px; object-fit:cover; border-radius:3px; border:1px solid var(--hairline); flex-shrink:0; }
  .profile-header h2{ margin:0 0 4px; font-size:20px; }
  .profile-header .meta{ font-size:12.5px; color:var(--ink-muted); }

  .section{ margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline); }
  .section h3{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-secondary);
    margin:0 0 10px;
  }
  .fact-grid{
    display:grid;
    grid-template-columns:110px 1fr;
    row-gap:8px;
    column-gap:10px;
    font-size:13px;
    align-items:center;
  }
  .fact-grid label{ color:var(--ink-muted); }
  .fact-grid input, .fact-grid select, .fact-grid textarea{
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:5px 7px;
    font-size:13px;
    font-family:inherit;
    color:var(--ink-primary);
    width:100%;
    box-sizing:border-box;
  }
  .fact-grid textarea{ min-height:60px; resize:vertical; align-self:start; margin-top:2px; }
  .fact-grid textarea.tall{ min-height:100px; }
  .upload-hint{ font-size:11.5px; color:var(--ink-muted); margin-bottom:10px; }
  .flagg-row{ display:flex; align-items:center; gap:10px; }
  .flagg-preview{ width:44px; height:30px; object-fit:cover; border-radius:4px; border:1px solid var(--hairline); background:var(--page); }
  .rm-img-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .rm-img-card{ border:1px solid var(--hairline); border-radius:8px; overflow:hidden; background:var(--surface-1); }
  .rm-img-card img{ width:100%; height:90px; object-fit:cover; display:block; background:var(--page); }
  .rm-img-body{ padding:6px; display:flex; flex-direction:column; gap:5px; }
  .rm-img-body input{
    border:1px solid var(--hairline); border-radius:5px; padding:4px 6px; font-size:12px; font-family:inherit; width:100%; box-sizing:border-box;
  }
  .rm-img-remove{ font-size:11px; color:#b04a4a; background:none; border:none; cursor:pointer; padding:0; text-align:left; }

  /* Høydepunktbank (2026-08-22) - gjenbrukbare "salgspunkter" knyttet til
     reisemålet, valgt inn i Forslag-PDF-ens side 1. Bilder er REFERANSER til
     reisemaalets egen bildebank over (§3), ikke egne opplastinger. */
  .hp-card{ border:1px solid var(--hairline); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--surface-1); }
  .hp-card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .hp-card-top input.hp-navn{ font-weight:600; flex:1; }
  .hp-order-btns{ display:flex; flex-direction:column; gap:1px; }
  .hp-order-btns button{ font-size:10px; line-height:1; padding:2px 5px; border:1px solid var(--hairline); background:var(--surface-1); color:var(--ink-secondary); cursor:pointer; border-radius:3px; }
  .hp-order-btns button:hover{ background:var(--page); }
  .hp-order-btns button:disabled{ opacity:0.3; cursor:default; }
  .hp-delete{ font-size:11px; color:#b04a4a; background:none; border:none; cursor:pointer; padding:2px 4px; white-space:nowrap; }
  .hp-korttekst{ width:100%; box-sizing:border-box; border:1px solid var(--hairline); border-radius:6px; padding:6px 8px; font-size:12.5px; font-family:inherit; min-height:44px; resize:vertical; margin-bottom:8px; }
  .hp-bilde-rad{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .hp-bilde-thumb{ position:relative; width:56px; height:56px; border-radius:6px; overflow:hidden; border:1px solid var(--hairline); }
  .hp-bilde-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hp-bilde-thumb .hp-bilde-fjern{ position:absolute; top:0; right:0; background:rgba(20,20,20,0.65); color:#fff; border:none; font-size:11px; line-height:1; width:18px; height:18px; cursor:pointer; }
  .hp-legg-til-bilde{ width:56px; height:56px; border-radius:6px; border:1px dashed var(--hairline); background:none; color:var(--ink-muted); font-size:11px; cursor:pointer; }
  .hp-legg-til-bilde:hover{ background:var(--page); }
  .hp-picker{ display:none; flex-wrap:wrap; gap:6px; margin-top:8px; padding:8px; border:1px solid var(--hairline); border-radius:6px; background:var(--page); }
  .hp-picker.open{ display:flex; }
  .hp-picker .hp-picker-thumb{ width:48px; height:48px; border-radius:5px; overflow:hidden; border:1px solid var(--hairline); cursor:pointer; background:none; padding:0; }
  .hp-picker .hp-picker-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hp-picker .hp-picker-empty{ font-size:11.5px; color:var(--ink-muted); }
  .hp-ny-btn{ font-size:12.5px; padding:7px 12px; border:1px solid var(--hairline); border-radius:7px; background:var(--surface-1); color:var(--ink-secondary); cursor:pointer; }
  .hp-ny-btn:hover{ background:var(--page); }

  .comment-item{
    padding:10px 0;
    border-bottom:1px solid var(--hairline);
    font-size:13px;
  }
  .comment-meta{
    font-size:11.5px;
    color:var(--ink-muted);
    margin-bottom:3px;
    font-variant-numeric:tabular-nums;
  }
  .comment-text{ white-space:pre-wrap; line-height:1.5; }
  .add-comment{ margin-top:12px; }
  .add-comment textarea{
    width:100%;
    min-height:60px;
    border:1px solid var(--hairline);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
    resize:vertical;
  }
  .add-comment .row{ display:flex; justify-content:flex-end; margin-top:6px; }
  .delete-rm{
    margin-top:24px;
    font-size:12px;
    color:#b04a4a;
    background:none;
    border:1px solid var(--hairline);
    border-radius:7px;
    padding:6px 10px;
    cursor:pointer;
  }
  .delete-rm:hover{ background:#fbeaea; border-color:#d03b3b; }
  .load-msg{ padding:40px 24px; color:var(--ink-muted); font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><span class="company">Caminante Admin</span><span class="tool-name">Reisemål</span></a>
  <div class="user-area">
    <span id="userName"></span>
    <button class="logout-btn" id="logoutBtn">Logg ut</button>
  </div>
</div>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Søk på reisemål, by eller land…">
  <select id="filterLand"><option value="">Alle land</option></select>
  <button class="reset" id="resetFilters">Nullstill filter</button>
  <button class="action primary" id="newReisemaalBtn">+ Nytt reisemål</button>
  <button class="action" id="exportBtn">Eksporter (CSV)</button>
  <span class="count-pill" id="countPill"></span>
</div>

<div id="loadMsg" class="load-msg">Laster reisemål…</div>

<div class="main" id="mainArea" style="display:none;">
  <div class="list-panel">
    <h2>Reisemålsliste</h2>
    <table>
      <thead>
        <tr>
          <th data-key="navn">Reisemål <span class="arrow"></span></th>
          <th data-key="land">Land <span class="arrow"></span></th>
          <th data-key="valuta">Valuta <span class="arrow"></span></th>
          <th data-key="folketall">Folketall <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="profile-panel" id="profilePanel"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script src="shared/flagg-liste.js"></script>
<script src="shared/bildebank.js"></script>
<script>
/* ---------- State (in-memory cache of DB rows for the current session) ---------- */

let reisemaal = [];       // reisemaal-rader + .kommentarer[]/.bilder[] tilknyttet klientsidig
let currentUserId = null;
let state = { search:"", land:"", sortKey:"navn", sortDir:1, selectedId:null };

/* ---------- Helpers ---------- */

function escapeHtml(str){
  return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ---------- Supabase data loading ---------- */

async function loadAllData(){
  const [{ data: rmRows, error: e1 }, { data: kommentarerRows, error: e2 }, { data: profileRows, error: e3 }, { data: bildeRows, error: e4 }, { data: hpRows, error: e5 }, { data: hpBildeRows, error: e6 }] =
    await Promise.all([
      window.sb.from("reisemaal").select("*"),
      window.sb.from("reisemaal_kommentarer").select("*").order("opprettet_dato", { ascending:false }),
      window.sb.from("profiles").select("id, navn"),
      window.sb.from("reisemaal_bilder").select("*").order("sortering"),
      window.sb.from("reisemaal_hoydepunkter").select("*").order("sortering"),
      window.sb.from("reisemaal_hoydepunkt_bilder").select("*").order("sortering"),
    ]);
  if(e1 || e2 || e3 || e4 || e5 || e6){
    document.getElementById("loadMsg").textContent = "Kunne ikke laste data fra databasen. Prøv igjen, eller sjekk databaseoppsettet for reisemaal-tabellene.";
    console.error(e1, e2, e3, e4, e5, e6);
    return false;
  }
  const nameById = {};
  (profileRows||[]).forEach(p=> nameById[p.id] = p.navn);
  const bildeById = {};
  (bildeRows||[]).forEach(b=> bildeById[b.id] = b);

  reisemaal = (rmRows||[]).map(r => ({
    ...r,
    kommentarer: (kommentarerRows||[]).filter(c=>c.reisemaal_id===r.id).map(c=>({
      ...c,
      forfatter_navn: nameById[c.forfatter] || "Ukjent",
    })),
    bilder: (bildeRows||[]).filter(b=>b.reisemaal_id===r.id),
    // Høydepunktbank - hvert høydepunkt sine bilder er REFERANSER (join-rader)
    // til reisemålets egen bildebank over, løst opp til de faktiske
    // bilde-objektene her for enkel rendering. En lenke uten treff i
    // bildeById (f.eks. det underliggende reisemaal_bilder-bildet ble
    // slettet) filtreres bort.
    hoydepunkter: (hpRows||[]).filter(h=>h.reisemaal_id===r.id).map(h=>({
      ...h,
      bilder: (hpBildeRows||[])
        .filter(hb=>hb.hoydepunkt_id===h.id)
        .map(hb=>({ linkId: hb.id, sortering: hb.sortering, reisemaal_bilde_id: hb.reisemaal_bilde_id, ...bildeById[hb.reisemaal_bilde_id] }))
        .filter(b=>b.bilde_url),
    })),
  }));
  return true;
}

/* ---------- Filter dropdown population ---------- */

function fillSelect(id, values, keepFirst){
  const el = document.getElementById(id);
  while(el.options.length > (keepFirst ? 1 : 0)) el.remove(el.options.length-1);
  values.forEach(v=>{
    if(v === "" ) return;
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    el.appendChild(o);
  });
}
function refreshLandFilter(){
  const land = [...new Set(reisemaal.map(r=>r.land).filter(Boolean))].sort((a,b)=> a.localeCompare(b,"no"));
  const current = state.land;
  fillSelect("filterLand", land, true);
  if(land.includes(current)) document.getElementById("filterLand").value = current;
}

/* ---------- Filtering / sorting ---------- */

function filteredReisemaal(){
  let list = reisemaal.filter(r=>{
    if(state.search){
      const q = state.search.toLowerCase();
      if(!(r.navn||"").toLowerCase().includes(q) && !(r.by||"").toLowerCase().includes(q) && !(r.land||"").toLowerCase().includes(q)) return false;
    }
    if(state.land && r.land !== state.land) return false;
    return true;
  });
  const key = state.sortKey, dir = state.sortDir;
  list.sort((a,b)=>{
    let av = a[key], bv = b[key];
    if(typeof av === "string") av = av.toLowerCase();
    if(typeof bv === "string") bv = bv.toLowerCase();
    if(av == null) av = "";
    if(bv == null) bv = "";
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return 0;
  });
  return list;
}

/* ---------- Rendering: list ---------- */

function renderList(){
  const list = filteredReisemaal();
  const body = document.getElementById("listBody");
  body.innerHTML = "";
  list.forEach(r=>{
    const tr = document.createElement("tr");
    if(r.id === state.selectedId) tr.classList.add("selected");
    tr.innerHTML = `
      <td>
        ${r.flagg_bilde_url ? `<img class="rm-flag" src="${escapeHtml(r.flagg_bilde_url)}">` : ""}
        <div class="rm-name" style="display:inline-block;">${escapeHtml(r.navn)}</div>
        <div class="rm-sub">${escapeHtml(r.by||"")}</div>
      </td>
      <td>${escapeHtml(r.land)}</td>
      <td>${escapeHtml(r.valuta)}</td>
      <td>${escapeHtml(r.folketall)}</td>
    `;
    tr.addEventListener("click", ()=> openProfile(r.id));
    body.appendChild(tr);
  });
  document.getElementById("countPill").textContent = `${list.length} av ${reisemaal.length} reisemål vises`;
}

/* ---------- Write helpers (Supabase) ---------- */

async function updateReisemaal(id, patch){
  const { error } = await window.sb.from("reisemaal").update(patch).eq("id", id);
  if(error){ alert("Kunne ikke lagre endringen: " + error.message); return; }
  const r = reisemaal.find(x=>x.id===id);
  Object.assign(r, patch);
  refreshLandFilter();
  renderList();
  if(state.selectedId === id) renderProfile(id);
}

async function createReisemaal(){
  const { data, error } = await window.sb.from("reisemaal").insert({
    navn: "Nytt reisemål", by: "", land: "", opprettet_av: currentUserId,
  }).select().single();
  if(error){ alert("Kunne ikke opprette reisemål: " + error.message); return; }
  reisemaal.push({ ...data, kommentarer:[], bilder:[], hoydepunkter:[] });
  refreshLandFilter();
  renderList();
  openProfile(data.id);
}

async function deleteReisemaal(id){
  if(!confirm("Slette dette reisemålet permanent, inkludert alle bilder og kommentarer?")) return;
  const { error } = await window.sb.from("reisemaal").delete().eq("id", id);
  if(error){ alert("Kunne ikke slette: " + error.message); return; }
  reisemaal = reisemaal.filter(r=>r.id!==id);
  closeProfile();
  refreshLandFilter();
  renderList();
}

/* ---------- Flagg-nedtrekksliste ---------- */

// v: flagg_bilde_url lagres nå som en relativ sti til et av de lokale flaggene
// i site/flags/<kode>.svg (fra FLAGG_LISTE i shared/flagg-liste.js), ikke lenger
// et opplastet bilde i reisemaal-bilder-bucketen.
function flaggkodeFraUrl(url){
  const m = /^flags\/([a-z-]+)\.svg$/.exec(url || "");
  return m ? m[1] : null;
}
function flaggOptionsHtml(gjeldendeUrl){
  const gjeldendeKode = flaggkodeFraUrl(gjeldendeUrl);
  const sortert = FLAGG_LISTE.slice().sort((a,b)=> a.navn.localeCompare(b.navn,"nb"));
  return sortert.map(f=>
    `<option value="${f.code}" ${f.code===gjeldendeKode ? "selected" : ""}>${escapeHtml(f.navn)}</option>`
  ).join("");
}

/* ---------- Profile panel ---------- */

function openProfile(id){
  state.selectedId = id;
  renderList();
  renderProfile(id);
  document.getElementById("overlayBg").classList.add("open");
  document.getElementById("profilePanel").classList.add("open");
}
function closeProfile(){
  state.selectedId = null;
  document.getElementById("overlayBg").classList.remove("open");
  document.getElementById("profilePanel").classList.remove("open");
  renderList();
}
document.getElementById("overlayBg").addEventListener("click", closeProfile);

function renderProfile(id){
  const r = reisemaal.find(x=>x.id===id);
  const panel = document.getElementById("profilePanel");
  const sted = [r.by, r.land].filter(Boolean).join(", ") || "Sted ikke satt";

  panel.innerHTML = `
    <button class="profile-close" id="closeBtn" title="Lukk">✕</button>
    <div class="profile-header">
      ${r.flagg_bilde_url ? `<img class="rm-flag-lg" src="${escapeHtml(r.flagg_bilde_url)}">` : ""}
      <div>
        <h2>${escapeHtml(r.navn)}</h2>
        <div class="meta">${escapeHtml(sted)}</div>
      </div>
    </div>

    <div class="section">
      <h3>1. Fakta</h3>
      <div class="fact-grid">
        <label>Navn</label><input id="f-navn" value="${escapeHtml(r.navn)}">
        <label>By</label><input id="f-by" value="${escapeHtml(r.by)}">
        <label>Land</label><input id="f-land" value="${escapeHtml(r.land)}">
        <label>Valuta</label><input id="f-valuta" value="${escapeHtml(r.valuta)}" placeholder="F.eks. HRK / EUR">
        <label>Folketall</label><input id="f-folketall" value="${escapeHtml(r.folketall)}" placeholder="F.eks. 178 000">
        <label>Flagg</label>
        <div class="flagg-row">
          ${r.flagg_bilde_url ? `<img class="flagg-preview" src="${escapeHtml(r.flagg_bilde_url)}">` : `<div class="flagg-preview"></div>`}
          <select id="f-flagg" style="flex:1;">
            <option value="">— Velg flagg —</option>
            ${flaggOptionsHtml(r.flagg_bilde_url)}
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>2. Presentasjon</h3>
      <div class="upload-hint">Standardiserte tekster som hentes inn ved «Velg fra reisemål-oversikt» i Forslag - fritt redigerbare per forslag etterpå.</div>
      <div class="fact-grid">
        <label>Om reisemålet</label><textarea id="f-om-reisemaalet" class="tall">${escapeHtml(r.om_reisemaalet)}</textarea>
        <label>Muligheter og opplevelser</label><textarea id="f-muligheter" class="tall">${escapeHtml(r.muligheter_opplevelser)}</textarea>
      </div>
    </div>

    <div class="section">
      <h3>3. Bilder</h3>
      <div class="upload-hint">Generelle bilder av reisemålet - brukes ved «Velg fra reisemål-oversikt» i Forslag.</div>
      <div class="rm-img-grid" id="rmBildeGrid"></div>
      <input type="file" id="nyttRmBildeFile" accept="image/*" style="margin-top:10px;">
    </div>

    <div class="section">
      <h3>4. Høydepunkter</h3>
      <div class="upload-hint">Gjenbrukbare salgspunkter for Forslag-PDF-en (side 1) - navn, kort tekst og bilder hentet fra reisemålets bildebank over. Anbefalt: minst 4 stk, slik at det er noe å velge blant i Forslag.</div>
      <div id="hpListWrap"></div>
      <button class="hp-ny-btn" id="nyttHoydepunktBtn">+ Nytt høydepunkt</button>
    </div>

    <div class="section">
      <h3>5. Kommentarer</h3>
      <div id="commentsWrap"></div>
      <div class="add-comment">
        <textarea id="newCommentText" placeholder="Skriv en ny kommentar/erfaring – dato, klokkeslett og forfatter legges til automatisk…"></textarea>
        <div class="row"><button class="small-btn" id="addCommentBtn">Legg til kommentar</button></div>
      </div>
    </div>

    <button class="delete-rm" id="deleteRmBtn">Slett reisemål</button>
  `;

  document.getElementById("closeBtn").addEventListener("click", closeProfile);
  document.getElementById("deleteRmBtn").addEventListener("click", ()=> deleteReisemaal(r.id));

  const bind = (elId, field)=>{
    document.getElementById(elId).addEventListener("change", async (e)=>{
      await updateReisemaal(r.id, { [field]: e.target.value || null });
    });
  };
  bind("f-navn","navn"); bind("f-by","by"); bind("f-land","land");
  bind("f-valuta","valuta"); bind("f-folketall","folketall");
  bind("f-om-reisemaalet","om_reisemaalet"); bind("f-muligheter","muligheter_opplevelser");

  document.getElementById("f-flagg").addEventListener("change", async (e)=>{
    const kode = e.target.value;
    await updateReisemaal(r.id, { flagg_bilde_url: kode ? `flags/${kode}.svg` : null });
  });

  renderRmBilder(r);
  document.getElementById("nyttRmBildeFile").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const slug = slugifyBildebank(r.navn);
    if(!slug){ alert("Fyll inn Navn først, slik at bildet kan legges i riktig mappe i bildebanken."); e.target.value=""; return; }
    try{
      // v: bilder lagres nå i den delte bildebanken (Cloudflare R2, destinations/<slug>/)
      // i stedet for reisemaal-bilder-bucketen i Supabase Storage, slik at de samme
      // bildene kan gjenbrukes direkte i Forslag & Tilbud (og etter hvert Web) uten
      // å måtte lastes opp på nytt. reisemaal_bilder-tabellen er uendret - lagrer
      // bare en URL som nå peker til R2 i stedet for Supabase Storage.
      const { url } = await bildebankUpload(file, "destinations", slug);
      const { data, error } = await window.sb.from("reisemaal_bilder").insert({
        reisemaal_id: r.id, bilde_url: url, sortering: r.bilder.length,
      }).select().single();
      if(error) throw error;
      r.bilder.push(data);
      renderRmBilder(r);
    } catch(err){ alert("Kunne ikke laste opp bilde: " + err.message); }
    e.target.value = "";
  });

  renderHoydepunkter(r);
  document.getElementById("nyttHoydepunktBtn").addEventListener("click", ()=> createHoydepunkt(r));

  renderComments(r);
  document.getElementById("addCommentBtn").addEventListener("click", async ()=>{
    const tekst = document.getElementById("newCommentText").value.trim();
    if(!tekst) return;
    const { data, error } = await window.sb.from("reisemaal_kommentarer").insert({
      reisemaal_id: r.id, tekst, forfatter: currentUserId,
    }).select().single();
    if(error){ alert("Kunne ikke lagre kommentar: " + error.message); return; }
    const { data: profile } = await window.sb.from("profiles").select("navn").eq("id", currentUserId).single();
    r.kommentarer.unshift({ ...data, forfatter_navn: (profile && profile.navn) || "" });
    document.getElementById("newCommentText").value = "";
    renderComments(r);
  });
}

function renderRmBilder(r){
  const grid = document.getElementById("rmBildeGrid");
  grid.innerHTML = "";
  if(!r.bilder.length){
    grid.innerHTML = '<div class="save-hint">Ingen bilder lastet opp ennå.</div>';
    return;
  }
  r.bilder.forEach(b=>{
    const card = document.createElement("div");
    card.className = "rm-img-card";
    card.innerHTML = `
      <img src="${escapeHtml(b.bilde_url)}">
      <div class="rm-img-body">
        <input class="rb-alt" value="${escapeHtml(b.alt_tekst)}" placeholder="Bildetekst">
        <button class="rm-img-remove">Fjern</button>
      </div>
    `;
    grid.appendChild(card);
    card.querySelector(".rb-alt").addEventListener("change", async (e)=>{
      const { error } = await window.sb.from("reisemaal_bilder").update({ alt_tekst: e.target.value || null }).eq("id", b.id);
      if(error){ alert("Kunne ikke lagre bildetekst: " + error.message); return; }
      b.alt_tekst = e.target.value || null;
    });
    card.querySelector(".rm-img-remove").addEventListener("click", async ()=>{
      // v: sletter kun databaseraden, ikke selve fila i Storage - samme
      // etablerte mønster som hoteller.html og forslag-editor.html sin
      // Bilder-fane (bevisst enkel løsning).
      const { error } = await window.sb.from("reisemaal_bilder").delete().eq("id", b.id);
      if(error){ alert("Kunne ikke slette bilde: " + error.message); return; }
      r.bilder = r.bilder.filter(x=>x.id!==b.id);
      renderRmBilder(r);
    });
  });
}

/* ---------- Høydepunktbank ---------- */

function renderHoydepunkter(r){
  const wrap = document.getElementById("hpListWrap");
  wrap.innerHTML = "";
  const sorted = [...r.hoydepunkter].sort((a,b)=> a.sortering - b.sortering);
  if(!sorted.length){
    wrap.innerHTML = '<div class="save-hint" style="margin-bottom:10px;">Ingen høydepunkter opprettet ennå.</div>';
    return;
  }
  sorted.forEach((h, idx)=>{
    const card = document.createElement("div");
    card.className = "hp-card";
    const alleredeValgt = new Set(h.bilder.map(b=>b.reisemaal_bilde_id));
    const tilgjengelige = r.bilder.filter(b=> !alleredeValgt.has(b.id));
    card.innerHTML = `
      <div class="hp-card-top">
        <div class="hp-order-btns">
          <button class="hp-opp" ${idx===0 ? "disabled" : ""} title="Flytt opp">▲</button>
          <button class="hp-ned" ${idx===sorted.length-1 ? "disabled" : ""} title="Flytt ned">▼</button>
        </div>
        <input class="hp-navn" value="${escapeHtml(h.navn)}" placeholder="Navn på høydepunkt">
        <button class="hp-delete">Slett</button>
      </div>
      <textarea class="hp-korttekst" placeholder="Kort tekst (ca. 10-18 ord)…">${escapeHtml(h.korttekst)}</textarea>
      <div class="hp-bilde-rad">
        ${h.bilder.map(b=>`
          <div class="hp-bilde-thumb" data-link-id="${b.linkId}">
            <img src="${escapeHtml(b.bilde_url)}">
            <button class="hp-bilde-fjern" title="Fjern bilde">✕</button>
          </div>
        `).join("")}
        <button class="hp-legg-til-bilde">+ Bilde</button>
      </div>
      <div class="hp-picker">
        ${tilgjengelige.length ? tilgjengelige.map(b=>`
          <button class="hp-picker-thumb" data-bilde-id="${b.id}"><img src="${escapeHtml(b.bilde_url)}"></button>
        `).join("") : '<div class="hp-picker-empty">Ingen flere bilder i reisemålets bildebank å velge blant - last opp flere under §3 Bilder.</div>'}
      </div>
    `;
    wrap.appendChild(card);

    card.querySelector(".hp-navn").addEventListener("change", (e)=> updateHoydepunkt(r, h, { navn: e.target.value || "Uten navn" }));
    card.querySelector(".hp-korttekst").addEventListener("change", (e)=> updateHoydepunkt(r, h, { korttekst: e.target.value || null }));
    card.querySelector(".hp-delete").addEventListener("click", ()=> deleteHoydepunkt(r, h));
    const oppBtn = card.querySelector(".hp-opp");
    const nedBtn = card.querySelector(".hp-ned");
    if(!oppBtn.disabled) oppBtn.addEventListener("click", ()=> bytteHoydepunktRekkefolge(r, sorted, idx, idx-1));
    if(!nedBtn.disabled) nedBtn.addEventListener("click", ()=> bytteHoydepunktRekkefolge(r, sorted, idx, idx+1));

    card.querySelectorAll(".hp-bilde-fjern").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        const linkId = e.target.closest(".hp-bilde-thumb").dataset.linkId;
        fjernHoydepunktBilde(r, h, linkId);
      });
    });
    card.querySelector(".hp-legg-til-bilde").addEventListener("click", ()=>{
      card.querySelector(".hp-picker").classList.toggle("open");
    });
    card.querySelectorAll(".hp-picker-thumb").forEach(btn=>{
      btn.addEventListener("click", ()=> leggTilHoydepunktBilde(r, h, btn.dataset.bildeId));
    });
  });
}

async function createHoydepunkt(r){
  const sortering = r.hoydepunkter.length ? Math.max(...r.hoydepunkter.map(h=>h.sortering)) + 1 : 0;
  const { data, error } = await window.sb.from("reisemaal_hoydepunkter").insert({
    reisemaal_id: r.id, navn: "Nytt høydepunkt", korttekst: "", sortering, opprettet_av: currentUserId,
  }).select().single();
  if(error){ alert("Kunne ikke opprette høydepunkt: " + error.message); return; }
  r.hoydepunkter.push({ ...data, bilder: [] });
  renderHoydepunkter(r);
}

async function updateHoydepunkt(r, h, patch){
  const { error } = await window.sb.from("reisemaal_hoydepunkter").update(patch).eq("id", h.id);
  if(error){ alert("Kunne ikke lagre endringen: " + error.message); return; }
  Object.assign(h, patch);
}

async function deleteHoydepunkt(r, h){
  if(!confirm(`Slette høydepunktet «${h.navn}»? Dette fjerner det også fra alle Forslag som har valgt det.`)) return;
  const { error } = await window.sb.from("reisemaal_hoydepunkter").delete().eq("id", h.id);
  if(error){ alert("Kunne ikke slette: " + error.message); return; }
  r.hoydepunkter = r.hoydepunkter.filter(x=>x.id!==h.id);
  renderHoydepunkter(r);
}

async function bytteHoydepunktRekkefolge(r, sorted, fraIdx, tilIdx){
  const a = sorted[fraIdx], b = sorted[tilIdx];
  const aSort = a.sortering, bSort = b.sortering;
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    window.sb.from("reisemaal_hoydepunkter").update({ sortering: bSort }).eq("id", a.id),
    window.sb.from("reisemaal_hoydepunkter").update({ sortering: aSort }).eq("id", b.id),
  ]);
  if(e1 || e2){ alert("Kunne ikke endre rekkefølge."); return; }
  a.sortering = bSort; b.sortering = aSort;
  renderHoydepunkter(r);
}

async function leggTilHoydepunktBilde(r, h, reisemaalBildeId){
  const { data, error } = await window.sb.from("reisemaal_hoydepunkt_bilder").insert({
    hoydepunkt_id: h.id, reisemaal_bilde_id: reisemaalBildeId, sortering: h.bilder.length,
  }).select().single();
  if(error){ alert("Kunne ikke legge til bilde: " + error.message); return; }
  const bilde = r.bilder.find(b=>b.id===reisemaalBildeId);
  h.bilder.push({ linkId: data.id, sortering: data.sortering, reisemaal_bilde_id: reisemaalBildeId, ...bilde });
  renderHoydepunkter(r);
}

async function fjernHoydepunktBilde(r, h, linkId){
  const { error } = await window.sb.from("reisemaal_hoydepunkt_bilder").delete().eq("id", linkId);
  if(error){ alert("Kunne ikke fjerne bilde: " + error.message); return; }
  h.bilder = h.bilder.filter(b=>b.linkId!==linkId);
  renderHoydepunkter(r);
}

function renderComments(r){
  const wrap = document.getElementById("commentsWrap");
  wrap.innerHTML = "";
  const sorted = [...r.kommentarer].sort((a,b)=> a.opprettet_dato < b.opprettet_dato ? 1 : -1);
  if(sorted.length === 0){
    const p = document.createElement("div");
    p.className = "save-hint";
    p.textContent = "Ingen kommentarer registrert ennå.";
    wrap.appendChild(p);
  }
  sorted.forEach(c=>{
    const row = document.createElement("div");
    row.className = "comment-item";
    const d = new Date(c.opprettet_dato);
    const stamp = d.toLocaleDateString("nb-NO",{year:"numeric",month:"short",day:"numeric"}) + " kl. " + d.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
    row.innerHTML = `<div class="comment-meta">${stamp} · ${escapeHtml(c.forfatter_navn||"")}</div><div class="comment-text">${escapeHtml(c.tekst)}</div>`;
    wrap.appendChild(row);
  });
}

/* ---------- Wire up toolbar ---------- */

document.getElementById("searchInput").addEventListener("input", (e)=>{ state.search = e.target.value; renderList(); });
document.getElementById("filterLand").addEventListener("change", (e)=>{ state.land = e.target.value; renderList(); });
document.getElementById("resetFilters").addEventListener("click", ()=>{
  state.search=""; state.land="";
  document.getElementById("searchInput").value = "";
  document.getElementById("filterLand").value = "";
  renderList();
});
document.getElementById("newReisemaalBtn").addEventListener("click", createReisemaal);
document.getElementById("exportBtn").addEventListener("click", exportCsv);

document.querySelectorAll("thead th[data-key]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.key;
    if(state.sortKey === key){ state.sortDir *= -1; } else { state.sortKey = key; state.sortDir = 1; }
    document.querySelectorAll("thead .arrow").forEach(a=> a.textContent = "");
    th.querySelector(".arrow").textContent = state.sortDir === 1 ? "▲" : "▼";
    renderList();
  });
});

/* ---------- CSV-eksport ---------- */

function exportCsv(){
  const list = filteredReisemaal();
  const headers = ["Navn","By","Land","Valuta","Folketall"];
  const rows = list.map(r => [r.navn, r.by, r.land, r.valuta, r.folketall]);
  const csv = [headers, ...rows]
    .map(row => row.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(";"))
    .join("\r\n");
  const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `caminante-reisemaal-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Init ---------- */

(async ()=>{
  const session = await requireLogin();
  if(!session) return;
  currentUserId = session.user.id;

  const ok = await loadAllData();
  document.getElementById("loadMsg").style.display = "none";
  if(!ok) return;
  refreshLandFilter();
  document.getElementById("mainArea").style.display = "block";
  renderList();
})();
</script>
